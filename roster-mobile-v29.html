<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Solid Green Roster Without Points Section</title><style>html,body{margin:0;width:100%;height:100%;background:#0f7b3f;overflow:auto}iframe{border:0;width:100%;min-height:100vh;display:block}</style></head><body><iframe id="tracker" src="roster-mobile-v28.html?v=29"></iframe><script>
const f=document.getElementById('tracker');
function removePointsSection(){
 const d1=f.contentDocument;if(!d1)return;
 const inner=d1.querySelector('iframe');
 const d=inner&&inner.contentDocument?inner.contentDocument:d1;
 if(!d)return;
 const pointTeams=d.getElementById('pointTeams');
 if(pointTeams){const box=pointTeams.closest('.wide')||pointTeams.closest('div'); if(box)box.remove();}
 [...d.querySelectorAll('h2,h3')].forEach(h=>{if((h.textContent||'').toLowerCase().includes('teams creating points')){const box=h.closest('.wide')||h.closest('div'); if(box)box.remove(); else h.remove();}});
 [...d.querySelectorAll('.wide,.grid>div')].forEach(box=>{if((box.textContent||'').toLowerCase().includes('teams creating points'))box.remove();});
 try{f.style.height=d.documentElement.scrollHeight+'px'}catch(e){}
}
f.addEventListener('load',()=>{setTimeout(removePointsSection,1200);setInterval(removePointsSection,1500)});
</script></body></html>
