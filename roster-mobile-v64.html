<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>World Cup Mobile Roster Tracker</title><style>html,body{margin:0;width:100%;height:100%;background:#0f7b3f;overflow:auto}iframe{border:0;width:100%;min-height:100vh;display:block}</style></head><body><iframe id="tracker" src="roster-mobile-v61.html?v=64"></iframe><script>
const frame=document.getElementById('tracker');
function norm(x){return String(x||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/&/g,'and').replace(/[^a-z0-9 ]/g,' ').replace(/\s+/g,' ').trim()}
const ALIASES={usa:['united states','us','u s a','america'],mexico:['mexico'],canada:['canada'],brazil:['brazil'],japan:['japan'],germany:['germany'],paraguay:['paraguay'],netherlands:['netherlands','holland'],morocco:['morocco'],france:['france'],sweden:['sweden'],england:['england'],senegal:['senegal'],spain:['spain'],austria:['austria'],portugal:['portugal'],croatia:['croatia'],switzerland:['switzerland'],algeria:['algeria'],australia:['australia'],egypt:['egypt'],argentina:['argentina'],colombia:['colombia'],ghana:['ghana'],norway:['norway'],ecuador:['ecuador'],belgium:['belgium'],mex:['mexico'],rsa:['south africa'],bih:['bosnia','bosnia herzegovina','bosnia and herzegovina','bosnia-herzegovina'],cod:['dr congo','congo dr','congo'],civ:['ivory coast','cote d ivoire','côte d ivoire'],tur:['turkey','turkiye','türkiye']};
function toks(t){let n=norm(t),out=[n];Object.values(ALIASES).forEach(a=>{if(a.map(norm).includes(n))out.push(...a.map(norm))});return [...new Set(out)]}
function same(a,b){let A=toks(a),B=toks(b);return A.some(x=>B.includes(x))}
function docs(){try{let d=frame.contentDocument,w=frame.contentWindow;for(let i=0;i<10;i++){let inner=d&&d.querySelector?d.querySelector('iframe'):null;if(!inner||!inner.contentDocument)break;d=inner.contentDocument;w=inner.contentWindow}return{d,w}}catch(e){return{}}}
function state(m){return norm((m&&m.state)||m&&m.status)}
function played(m){let s=state(m);return ['post','complete','completed','final','finished','ft'].includes(s)||(!['pre','upcoming','scheduled'].includes(s)&&m&&m.homeScore!=null&&m.awayScore!=null&&!isNaN(Number(m.homeScore))&&!isNaN(Number(m.awayScore)))}
function future(m){return ['pre','upcoming','scheduled','in','live','playing'].includes(state(m))}
function stage(m){return String(m&&(m.round||m.stage||m.phase||m.competitionStage||m.group)||'')}
function knockout(m){return /round of 32|round of 16|quarter|semi|final|knockout|3rd|third/i.test(stage(m))}
function finalMatch(m){let s=stage(m).toLowerCase();return /final/.test(s)&&!/semi|third|3rd|place/.test(s)}
function winner(m){if(!m)return null;if(m.winnerTeam||m.winner||m.winnerName)return m.winnerTeam||m.winner||m.winnerName;let hs=Number(m.homeScore),as=Number(m.awayScore);if(Number.isFinite(hs)&&Number.isFinite(as)&&hs!==as)return hs>as?m.homeTeam:m.awayTeam;let hp=Number(m.homePenaltyScore??m.homePenalties??m.homePens??NaN),ap=Number(m.awayPenaltyScore??m.awayPenalties??m.awayPens??NaN);if(Number.isFinite(hp)&&Number.isFinite(ap)&&hp!==ap)return hp>ap?m.homeTeam:m.awayTeam;return null}
function loser(m){let win=winner(m);if(!win)return null;if(same(win,m.homeTeam))return m.awayTeam;if(same(win,m.awayTeam))return m.homeTeam;return null}
function tbd(t){return !t||/\bTBD\b|winner of|loser of/i.test(String(t))}
function statusFor(w,team){let ms=(w&&w.matches)||[],ko=ms.filter(knockout),champ=null,elim=[],alive=[],part=[];ko.forEach(m=>{[m.homeTeam,m.awayTeam].forEach(t=>{if(!tbd(t))part.push(t)});let win=winner(m),lose=loser(m);if(played(m)&&win&&finalMatch(m))champ=win;if(played(m)&&lose)elim.push(lose);if(future(m)){[m.homeTeam,m.awayTeam].forEach(t=>{if(!tbd(t))alive.push(t)})}if(played(m)&&win)alive.push(win)});if(champ)return same(team,champ)?['🏆 Champion','championStatus']:['❌ Eliminated','eliminatedStatus'];if(ko.length){if(elim.some(t=>same(team,t)))return['❌ Eliminated','eliminatedStatus'];if(alive.some(t=>same(team,t))||part.some(t=>same(team,t)))return['✅ Still Alive','aliveStatus'];return['❌ Eliminated','eliminatedStatus']}return['✅ Still Alive','aliveStatus']}
function css(d){if(!d||d.getElementById('rosterOnlyFifaStatuses'))return;let s=d.createElement('style');s.id='rosterOnlyFifaStatuses';s.textContent='#groups .rosterTeam,#groups .rosterStatus,#groups .rosterScore,#groups .rosterRecord{animation:none!important;transition:none!important}#groups .rosterStatus.aliveStatus,.teamPickFifaStatus.aliveStatus{background:#dcfce7!important;color:#087443!important;border:1px solid #86efac!important}#groups .rosterStatus.eliminatedStatus,.teamPickFifaStatus.eliminatedStatus{background:#fee2e2!important;color:#b42318!important;border:1px solid #fecaca!important}#groups .rosterStatus.championStatus,.teamPickFifaStatus.championStatus{background:#fef3c7!important;color:#92400e!important;border:1px solid #fbbf24!important;box-shadow:none!important}#groups .fifaAlive{border-color:#86efac!important;background:#f0fdf4!important}#groups .fifaEliminated{border-color:#fecaca!important;background:#fff7f7!important;opacity:1!important}#groups .fifaChampion{border-color:#fbbf24!important;background:#fff7d6!important}.teamPickFifaStatus{display:inline-block;margin-top:5px;border-radius:999px;padding:5px 8px;font-size:10px;font-weight:1000;line-height:1}';d.head.appendChild(s)}
function apply(){const {d,w}=docs();if(!d||!w)return;css(d);let holder=d.getElementById('groups');if(!holder)return;holder.querySelectorAll('.rosterTeam').forEach(card=>{let nm=card.querySelector('.rosterTeamName'),st=card.querySelector('.rosterStatus');if(!nm||!st)return;let team=(nm.textContent||'').replace('⚽','').trim();let res=statusFor(w,team);st.textContent=res[0];st.classList.remove('aliveStatus','eliminatedStatus','championStatus');st.classList.add(res[1]);card.classList.remove('fifaAlive','fifaEliminated','fifaChampion');card.classList.add(res[1]==='championStatus'?'fifaChampion':res[1]==='eliminatedStatus'?'fifaEliminated':'fifaAlive')});holder.querySelectorAll('.teamPill,.tile').forEach(el=>{let txt=(el.childNodes[0]&&el.childNodes[0].nodeValue?el.childNodes[0].nodeValue:el.textContent||'').replace(/✅ Still Alive|❌ Eliminated|🏆 Champion/g,'').trim();if(!txt)return;let res=statusFor(w,txt.replace('⚽','').trim());let b=el.querySelector('.teamPickFifaStatus');if(!b){b=d.createElement('span');b.className='teamPickFifaStatus';el.appendChild(b)}b.textContent=res[0];b.classList.remove('aliveStatus','eliminatedStatus','championStatus');b.classList.add(res[1])});try{frame.style.height=d.documentElement.scrollHeight+'px'}catch(e){}}
frame.addEventListener('load',()=>{setTimeout(apply,1200);setInterval(apply,250)});
</script></body></html>
