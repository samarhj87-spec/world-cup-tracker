<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Simple World Cup Friend Tracker</title>
  <style>
    html,body{margin:0;width:100%;min-height:100%;background:#f4f7f3;overflow:auto}
    iframe{border:0;width:100%;min-height:100vh;display:block;background:#f4f7f3}
  </style>
</head>
<body>
<iframe id="tracker" src="appv15.html?roster=24&simple=1"></iframe>
<script>
const frame=document.getElementById('tracker');

function deep(){let d=frame.contentDocument,w=frame.contentWindow;try{for(let i=0;i<3;i++){const inner=d&&d.querySelector?d.querySelector('iframe'):null;if(!inner||!inner.contentDocument)break;d=inner.contentDocument;w=inner.contentWindow}}catch(e){}return{d,w}}
function norm(x){return String(x||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/&/g,'and').replace(/[^a-z0-9 ]/g,' ').replace(/\s+/g,' ').trim()}
function groupName(w,g){try{return w.gname(g.group||g)}catch(e){return (g.friends||[]).join(', ')||g.group||g}}
function fmt(w,date){try{return new Intl.DateTimeFormat('en-US',{weekday:'short',month:'short',day:'numeric',hour:'numeric',minute:'2-digit',timeZone:(w.id&&w.id('tz')&&w.id('tz').value)||Intl.DateTimeFormat().resolvedOptions().timeZone}).format(new Date(date))}catch(e){return new Date(date).toLocaleString()}}
function statusText(m){return m.state==='in'?'Live':m.state==='post'?'Final':'Upcoming'}
function scoreText(m){return m.state==='pre'?'Not started':`${m.homeTeam} ${m.homeScore??0} - ${m.awayScore??0} ${m.awayTeam}`}
function matchPts(m,team){if(m.state==='pre')return 0;const hs=Number(m.homeScore||0),as=Number(m.awayScore||0),home=team===m.homeTeam;if(hs===as)return 1;return (home&&hs>as)||(!home&&as>hs)?3:0}
function getFilter(d){const friend=(d.getElementById('friend')||{}).value||'all';const status=(d.getElementById('status')||{}).value||'all';const search=norm((d.getElementById('search')||{}).value||'');return{friend,status,search}}
function scheduleRows(d,w){if(!w.matches)return[];const f=getFilter(d);const groupSet=f.friend==='all'?null:new Set(((w.groups||[]).find(g=>g.group===f.friend)||{}).teams?.map(norm)||[]);return w.matches.slice().sort((a,b)=>new Date(a.date)-new Date(b.date)).filter(m=>{if(f.status!=='all'&&m.state!==f.status)return false;if(groupSet&&!(groupSet.has(norm(m.homeTeam))||groupSet.has(norm(m.awayTeam))))return false;if(f.search&&!(norm(m.homeTeam).includes(f.search)||norm(m.awayTeam).includes(f.search)))return false;return true}).slice(0,80)}
function friendImpact(w,m){let out=[];(w.groups||[]).forEach(g=>{(g.teams||[]).forEach(t=>{if(norm(t)===norm(m.homeTeam)||norm(t)===norm(m.awayTeam)){out.push(`${groupName(w,g)}: ${t} ${matchPts(m,t)} pts`)}})});return out.slice(0,3).join(' • ')||'No friend impact';}

function inject(){const {d,w}=deep();if(!d||!w)return;
  let style=d.getElementById('simple-mobile-v1');
  if(!style){style=d.createElement('style');style.id='simple-mobile-v1';style.textContent=`
:root{--green:#0f7b3f;--dark:#073b4c;--soft:#f4f7f3;--line:#dfe9e1;--text:#163126;--muted:#667085;--gold:#f7c948;--goldText:#8a6200;}
*{box-sizing:border-box!important}html,body{background:var(--soft)!important;color:var(--text)!important;overflow-x:hidden!important;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif!important}header,main,.top{max-width:760px!important;padding:10px!important;margin:auto!important}.top{position:static!important}.scorebar{display:block!important;background:#fff!important;color:var(--text)!important;border:1px solid var(--line)!important;border-radius:20px!important;padding:14px!important;box-shadow:0 8px 24px #00000012!important}.scorebar .big{font-size:22px!important;color:var(--dark)!important;line-height:1.15!important}.score{font-size:34px!important;color:var(--green)!important;margin-top:6px!important}.scorebar button,.ghost,#refreshTop{display:none!important}.pill{font-size:12px!important;padding:6px 10px!important;background:#eaf8ef!important;color:var(--green)!important}.hero{display:none!important}.toolbar{display:grid!important;grid-template-columns:1fr!important;gap:10px!important;background:#fff!important;border:1px solid var(--line)!important;border-radius:20px!important;padding:12px!important;margin:10px 0!important;box-shadow:0 8px 24px #00000010!important}.toolbar>div:nth-child(1),.toolbar>div:nth-child(5),.toolbar>div:nth-child(6){display:none!important}label{font-size:11px!important;letter-spacing:.02em!important;color:var(--muted)!important;text-transform:uppercase!important;margin-bottom:5px!important}select,input{min-height:44px!important;border-radius:14px!important;border:1px solid var(--line)!important;background:#fff!important;color:var(--text)!important;font-size:15px!important;font-weight:750!important;padding:10px!important}.cards{grid-template-columns:1fr!important;gap:10px!important;margin:0 0 10px!important}.card{min-height:auto!important;border-radius:18px!important;padding:14px!important;background:#fff!important;border:1px solid var(--line)!important;box-shadow:0 8px 22px #00000010!important}.card:nth-child(n+3){display:none!important}.card:after{display:none!important}.card h3{font-size:14px!important;color:var(--muted)!important;margin:0 0 4px!important}.big{font-size:24px!important;color:var(--dark)!important}.txt,.muted{font-size:12px!important;color:var(--muted)!important;line-height:1.35!important}.grid{display:block!important;background:transparent!important;border:0!important;box-shadow:none!important;padding:0!important;margin:0!important}.grid>div,.wide{background:#fff!important;border:1px solid var(--line)!important;border-radius:20px!important;padding:14px!important;margin:10px 0!important;box-shadow:0 8px 24px #00000010!important}.grid:first-of-type>div:nth-child(2),#current{display:none!important}h2{font-size:20px!important;line-height:1.15!important;color:var(--dark)!important;margin:0 0 8px!important}.row{display:grid!important;grid-template-columns:1fr auto!important;gap:8px!important;align-items:center!important;margin:10px 0!important}.row .bar{grid-column:1/-1!important;height:9px!important;background:#edf4ee!important;border-radius:99px!important}.bar span{background:linear-gradient(90deg,var(--green),var(--gold))!important;border-radius:99px!important}.rosterGroup{background:#fff!important;border:1px solid var(--line)!important;border-radius:18px!important;margin:10px 0!important;overflow:hidden!important;box-shadow:none!important}.rosterHead{background:#f7fbf8!important;color:var(--dark)!important;border-bottom:1px solid var(--line)!important;padding:12px!important}.rosterHead b{font-size:16px!important}.rosterMeta{font-size:12px!important;color:var(--muted)!important;margin-top:3px!important}.rosterTeams{display:grid!important;grid-template-columns:1fr!important;gap:8px!important;padding:10px!important}.rosterTeam{display:block!important;border-radius:15px!important;padding:10px!important;border:1px solid var(--line)!important}.rosterTeam.hasPoints{background:#eaf8ef!important;border-color:#9ad7aa!important}.rosterTeam.zeroPoints{background:#fff8db!important;border-color:#f7c948!important}.rosterTop{display:flex!important;justify-content:space-between!important;gap:10px!important}.rosterTeamName{font-size:15px!important;font-weight:900!important}.rosterTeam.hasPoints .rosterTeamName{color:var(--green)!important}.rosterTeam.zeroPoints .rosterTeamName{color:var(--goldText)!important}.rosterRecord{font-size:12px!important;color:var(--muted)!important}.rosterScore{border-radius:999px!important;font-size:13px!important;padding:5px 9px!important;font-weight:950!important}.rosterTeam.hasPoints .rosterScore{background:#0f7b3f!important;color:white!important}.rosterTeam.zeroPoints .rosterScore{background:#f7c948!important;color:#473800!important}.rosterStatus{font-size:11px!important;margin-top:7px!important;padding:5px 8px!important;border-radius:999px!important;width:max-content!important;max-width:100%!important;background:#ffffffaa!important}.teamGrid,.winBox,#chart,#pointTeams{display:none!important}.scheduleFilters{display:none!important}#schedule .muted{display:none!important}#schedule div[style*="overflow"]{overflow:visible!important}table{display:none!important}.simpleSchedule{display:grid!important;gap:9px!important;margin-top:8px!important}.simpleMatch{border:1px solid var(--line)!important;border-radius:16px!important;padding:12px!important;background:#fbfdfb!important}.simpleMatchTop{display:flex!important;justify-content:space-between!important;gap:10px!important;font-weight:900!important;color:var(--dark)!important}.simpleBadge{font-size:12px!important;border-radius:999px!important;padding:4px 8px!important;background:#eaf8ef!important;color:var(--green)!important;white-space:nowrap!important}.simpleBadge.live{background:#fff1f4!important;color:#b42318!important}.simpleDate,.simpleImpact,.simpleScore{font-size:12px!important;color:var(--muted)!important;margin-top:6px!important;line-height:1.35!important}.simpleScore{color:var(--text)!important;font-weight:800!important}.emptySchedule{padding:14px!important;color:var(--muted)!important;border:1px dashed var(--line)!important;border-radius:14px!important;background:#fff!important}details{display:none!important}@media(min-width:680px){.toolbar{grid-template-columns:1fr 1fr!important}.toolbar>div:nth-child(4){grid-column:1/-1!important}.cards{grid-template-columns:1fr 1fr!important}.rosterTeams{grid-template-columns:1fr 1fr!important}.simpleSchedule{grid-template-columns:1fr 1fr!important}}
`;d.head.appendChild(style)}

  const alertDiv=[...d.querySelectorAll('.toolbar>div')].find(x=>/Notifications|Enable Alerts|Live Refresh/i.test(x.textContent||''));if(alertDiv)alertDiv.style.display='none';

  const topState=d.getElementById('topState');if(topState)topState.textContent='World Cup Tracker';
  const h=d.querySelector('#schedule h2');if(h)h.textContent='📅 Schedule';

  try{renderRoster(d,w)}catch(e){}
  try{renderLeaderboard(d,w)}catch(e){}
  try{renderSchedule(d,w)}catch(e){}
  try{frame.style.height=d.documentElement.scrollHeight+'px'}catch(e){}
}

function renderLeaderboard(d,w){if(!w.groups||!w.calc)return;const board=d.getElementById('leaderboard');if(!board)return;const sc=w.calc(w.groups);const rows=Object.keys(sc).map(k=>[k,sc[k]]).sort((a,b)=>b[1].points-a[1].points);const max=Math.max(6,...rows.map(r=>r[1].points));board.innerHTML=rows.map((r,i)=>`<div class="row"><div><b>${i===0?'👑 ':''}${groupName(w,r[0])}</b><div class="muted">${r[1].points} pts total</div></div><b>${r[1].points}</b><div class="bar"><span style="width:${Math.min(100,(r[1].points/max)*100)}%"></span></div></div>`).join('')||'<div class="empty">No leaderboard yet.</div>'}
function renderRoster(d,w){if(!w.groups||!w.score||!w.status||!w.rec)return;const holder=d.getElementById('groups');if(!holder)return;const gs=w.fGroups?w.fGroups():w.groups;holder.innerHTML=gs.map(g=>`<div class="rosterGroup"><div class="rosterHead"><b>${groupName(w,g)}</b><div class="rosterMeta">${(g.friends||[]).join(' • ')} • ${(g.teams||[]).length} teams</div></div><div class="rosterTeams">${(g.teams||[]).map(t=>{let sc=w.score(t),st=w.status(t),r=w.rec(t);let pointClass=Number(sc.total||0)>0?'hasPoints':'zeroPoints';return `<div class="rosterTeam ${pointClass}"><div class="rosterTop"><div><div class="rosterTeamName">⚽ ${t}</div><div class="rosterRecord">${r.w}W-${r.d}D-${r.l}L</div></div><div class="rosterScore">${sc.total} pts</div></div><span class="rosterStatus ${st.cls}">${String(st.txt).replace(/[✅⚠️⏳➖🔥]/g,'').trim()}</span></div>`}).join('')}</div></div>`).join('')||'<div class="empty">No teams match your filters.</div>'}
function renderSchedule(d,w){const sched=d.getElementById('schedule');if(!sched||!w.matches)return;let wrap=d.getElementById('simpleSchedule');if(!wrap){wrap=d.createElement('div');wrap.id='simpleSchedule';wrap.className='simpleSchedule';sched.appendChild(wrap)}const rows=scheduleRows(d,w);wrap.innerHTML=rows.length?rows.map(m=>`<div class="simpleMatch"><div class="simpleMatchTop"><span>${m.homeTeam} vs ${m.awayTeam}</span><span class="simpleBadge ${m.state==='in'?'live':''}">${statusText(m)}</span></div><div class="simpleScore">${scoreText(m)}</div><div class="simpleDate">${fmt(w,m.date)}${m.venue?' • '+m.venue:''}</div><div class="simpleImpact">${friendImpact(w,m)}</div></div>`).join(''):'<div class="emptySchedule">No matches found for these filters.</div>'}

function watch(){const {d}=deep();if(!d||window.__simpleWatch)return;['friend','status','search','tz'].forEach(id=>{const el=d.getElementById(id);if(el){el.addEventListener('change',()=>setTimeout(inject,50));el.addEventListener('input',()=>setTimeout(inject,50));}});window.__simpleWatch=true}
frame.addEventListener('load',()=>{setTimeout(()=>{inject();watch()},900);setInterval(()=>{try{inject();watch()}catch(e){}},1200)});
</script>
</body>
</html>
