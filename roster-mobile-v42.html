<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>World Cup Mobile Roster Tracker</title><style>html,body{margin:0;width:100%;height:100%;background:#0f7b3f;overflow:auto}iframe{border:0;width:100%;min-height:100vh;display:block}</style></head><body><iframe id="tracker" src="roster-mobile-v26.html?v=41"></iframe><script>
const f=document.getElementById('tracker');
function norm(x){return String(x||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/&/g,'and').replace(/[^a-z0-9 ]/g,' ').replace(/\s+/g,' ').trim()}
function cleanTeamName(x){return String(x||'').replace('⚽','').replace(/\s+/g,' ').trim()}
function getDeep(){let d=f.contentDocument,w=f.contentWindow;try{for(let i=0;i<6;i++){const inner=d&&d.querySelector?d.querySelector('iframe'):null;if(!inner||!inner.contentDocument)break;d=inner.contentDocument;w=inner.contentWindow}}catch(e){}return{d,w}}
function isTbd(t){return !t||/\bTBD\b|winner of|loser of/i.test(String(t))}
function isComplete(m){let s=norm((m&&m.state)||m&&m.status);return ['post','complete','completed','final','finished','ft'].includes(s)}
function isLive(m){let s=norm((m&&m.state)||m&&m.status);return ['in','live','playing'].includes(s)}
function isFuture(m){let s=norm((m&&m.state)||m&&m.status);return ['pre','upcoming','scheduled'].includes(s)}
function stageText(m){return String(m?.round||m?.stage||m?.group||m?.phase||m?.competitionStage||'')}
function isKnockout(m){let s=stageText(m).toLowerCase();return /round of 32|round of 16|quarter|semi|final|knockout|3rd|third/.test(s)}
function isWorldCupFinal(m){let s=stageText(m).toLowerCase();return /final/.test(s)&&!/semi|3rd|third|place/.test(s)}
function penHome(m){return Number(m?.homePenaltyScore??m?.homePenalties??m?.homePens??m?.penaltyHome??m?.homePK??m?.homePk??NaN)}
function penAway(m){return Number(m?.awayPenaltyScore??m?.awayPenalties??m?.awayPens??m?.penaltyAway??m?.awayPK??m?.awayPk??NaN)}
function matchWinner(m){if(!m)return null;if(m.winnerTeam)return m.winnerTeam;if(m.winner)return m.winner;if(m.winnerName)return m.winnerName;let hs=Number(m.homeScore),as=Number(m.awayScore);if(Number.isFinite(hs)&&Number.isFinite(as)&&hs!==as)return hs>as?m.homeTeam:m.awayTeam;let hp=penHome(m),ap=penAway(m);if(Number.isFinite(hp)&&Number.isFinite(ap)&&hp!==ap)return hp>ap?m.homeTeam:m.awayTeam;return null}
function matchLoser(m){let win=norm(matchWinner(m));if(!win)return null;let h=norm(m.homeTeam),a=norm(m.awayTeam);if(win===h)return m.awayTeam;if(win===a)return m.homeTeam;return null}
function tournamentStatus(w,team){const tn=norm(team);const matches=(w&&w.matches)||[];let knockout=matches.filter(isKnockout);let champion=null,eliminated=new Set(),alive=new Set(),participant=new Set();
 knockout.forEach(m=>{[m.homeTeam,m.awayTeam].forEach(t=>{if(!isTbd(t))participant.add(norm(t))});let win=matchWinner(m),lose=matchLoser(m);if(isComplete(m)&&win&&isWorldCupFinal(m))champion=norm(win);if(isComplete(m)&&lose&&!isTbd(lose))eliminated.add(norm(lose));if((isFuture(m)||isLive(m))){[m.homeTeam,m.awayTeam].forEach(t=>{if(!isTbd(t))alive.add(norm(t))})}if(isComplete(m)&&win&&!isTbd(win))alive.add(norm(win));});
 if(champion){return tn===champion?{txt:'🏆 Champion',cls:'championStatus'}:{txt:'❌ Eliminated',cls:'eliminatedStatus'}}
 if(knockout.length){if(eliminated.has(tn))return{txt:'❌ Eliminated',cls:'eliminatedStatus'};if(alive.has(tn)||participant.has(tn))return{txt:'✅ Still Alive',cls:'aliveStatus'};return{txt:'❌ Eliminated',cls:'eliminatedStatus'}}
 let hasFuture=matches.some(m=>!isTbd(m.homeTeam)&&!isTbd(m.awayTeam)&&(norm(m.homeTeam)===tn||norm(m.awayTeam)===tn)&&(isFuture(m)||isLive(m)));
 return hasFuture?{txt:'✅ Still Alive',cls:'aliveStatus'}:{txt:'✅ Still Alive',cls:'aliveStatus'}
}
function injectStyle(d){if(!d||d.getElementById('fifa-roster-status-style'))return;let s=d.createElement('style');s.id='fifa-roster-status-style';s.textContent=`.rosterStatus.aliveStatus{background:#dcfce7!important;color:#087443!important;border:1px solid #86efac!important}.rosterStatus.eliminatedStatus{background:#fee2e2!important;color:#b42318!important;border:1px solid #fecaca!important}.rosterStatus.championStatus{background:#fef3c7!important;color:#92400e!important;border:1px solid #fbbf24!important;box-shadow:0 0 0 2px #fde68a inset!important}.rosterTeam.fifaAlive{border-color:#86efac!important;background:#f0fdf4!important}.rosterTeam.fifaEliminated{border-color:#fecaca!important;background:#fff7f7!important;opacity:.78}.rosterTeam.fifaChampion{border-color:#fbbf24!important;background:linear-gradient(135deg,#fff7d6,#f0fdf4)!important;box-shadow:0 6px 16px #f59e0b33!important}`;d.head.appendChild(s)}
function applyStatuses(){const {d,w}=getDeep();if(!d||!w)return;injectStyle(d);d.querySelectorAll('.rosterTeam').forEach(card=>{let nameEl=card.querySelector('.rosterTeamName');let statusEl=card.querySelector('.rosterStatus');if(!nameEl||!statusEl)return;let team=cleanTeamName(nameEl.textContent);let st=tournamentStatus(w,team);statusEl.textContent=st.txt;statusEl.classList.remove('aliveStatus','eliminatedStatus','championStatus');statusEl.classList.add(st.cls);card.classList.remove('fifaAlive','fifaEliminated','fifaChampion');card.classList.add(st.cls==='championStatus'?'fifaChampion':st.cls==='eliminatedStatus'?'fifaEliminated':'fifaAlive')});try{f.style.height=d.documentElement.scrollHeight+'px'}catch(e){}}
f.addEventListener('load',()=>{setTimeout(applyStatuses,1800);setInterval(applyStatuses,1000)});
</script></body></html>
