<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>World Cup Mobile Roster Tracker</title><style>html,body{margin:0;width:100%;height:100%;background:#0f7b3f;overflow:auto}iframe{border:0;width:100%;min-height:100vh;display:block}</style></head><body><iframe id="tracker" loading="eager" fetchpriority="high" src="roster-mobile-v26.html?v=60"></iframe><script>
const frame=document.getElementById('tracker');let lastRefresh=0,syncing=false;
function docs(){try{const wrap=frame.contentDocument,wrapWin=frame.contentWindow,appFrame=wrap&&wrap.getElementById('tracker'),app=appFrame&&appFrame.contentDocument,appWin=appFrame&&appFrame.contentWindow;return{wrap,wrapWin,app,appWin}}catch(e){return{}}}
function norm(x){return String(x||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/&/g,'and').replace(/[^a-z0-9 ]/g,' ').replace(/\s+/g,' ').trim()}
const ALIASES={usa:['united states','us','u s a','america'],mex:['mexico'],rsa:['south africa'],kor:['south korea','korea'],cze:['czechia','czech republic'],can:['canada'],bih:['bosnia and herzegovina','bosnia herzegovina','bosnia','bosnia-herzegovina'],qat:['qatar'],sui:['switzerland'],bra:['brazil'],mar:['morocco'],hti:['haiti'],sco:['scotland'],aus:['australia'],tur:['turkey','turkiye'],par:['paraguay'],ger:['germany'],cuw:['curacao'],civ:['ivory coast','cote d ivoire'],ecu:['ecuador'],ned:['netherlands','holland'],jpn:['japan'],swe:['sweden'],tun:['tunisia'],bel:['belgium'],egy:['egypt'],iri:['iran'],nzl:['new zealand'],esp:['spain'],cpv:['cape verde'],ksa:['saudi arabia'],uru:['uruguay'],fra:['france'],sen:['senegal'],irq:['iraq'],nor:['norway'],arg:['argentina'],dza:['algeria'],aut:['austria'],jor:['jordan'],por:['portugal'],cod:['dr congo','congo dr','congo'],uzb:['uzbekistan'],col:['colombia'],eng:['england'],cro:['croatia'],gha:['ghana'],pan:['panama']};
function tokens(t){let n=norm(t),out=[n];Object.keys(ALIASES).forEach(k=>{if(ALIASES[k].some(a=>norm(a)===n))out.push(k,...ALIASES[k].map(norm))});return [...new Set(out)]}
function same(a,b){return tokens(a).some(x=>tokens(b).includes(x))}
function show(t){if(same(t,'Bosnia-Herzegovina'))return 'Bosnia-Herzegovina';if(same(t,'Congo Dr'))return 'Congo Dr';return t}
function isLive(m){let s=norm((m&&m.state)||m&&m.status);return ['in','live','playing'].includes(s)}
function isFuture(m){let s=norm((m&&m.state)||m&&m.status);return ['pre','upcoming','scheduled'].includes(s)}
function isPlayed(m){let s=norm((m&&m.state)||m&&m.status);return ['post','complete','completed','final','finished','ft'].includes(s)||(!isFuture(m)&&!isLive(m)&&m&&m.homeScore!=null&&m.awayScore!=null)}
function stage(m){return String(m&&(m.round||m.stage||m.phase||m.group||m.competitionStage)||'')}
function isKO(m){return /round of 32|round of 16|quarter|semi|final|knockout|3rd|third/i.test(stage(m))}
function isFinal(m){return /final/i.test(stage(m))&&!/semi|3rd|third|place/i.test(stage(m))}
function pen(m,home){let keys=home?['homePenaltyScore','homePenalties','homePens','penaltyHome','homePK','homePk']:['awayPenaltyScore','awayPenalties','awayPens','penaltyAway','awayPK','awayPk'];for(const k of keys){let v=Number(m&&m[k]);if(Number.isFinite(v))return v}return NaN}
function winner(m){if(!m)return null;if(m.winnerTeam||m.winner||m.winnerName)return m.winnerTeam||m.winner||m.winnerName;let hs=Number(m.homeScore),as=Number(m.awayScore);if(Number.isFinite(hs)&&Number.isFinite(as)&&hs!==as)return hs>as?m.homeTeam:m.awayTeam;let hp=pen(m,1),ap=pen(m,0);if(Number.isFinite(hp)&&Number.isFinite(ap)&&hp!==ap)return hp>ap?m.homeTeam:m.awayTeam;return null}
function loser(m){let w=winner(m);if(!w)return null;if(same(w,m.homeTeam))return m.awayTeam;if(same(w,m.awayTeam))return m.homeTeam;return null}
function fifa(w,team){let ms=(w&&w.matches)||[],ko=ms.filter(isKO),champ=null,dead=[],alive=[],seen=[];ko.forEach(m=>{[m.homeTeam,m.awayTeam].forEach(t=>{if(t&&!/TBD|winner of|loser of/i.test(t))seen.push(t)});let win=winner(m),lose=loser(m);if(isPlayed(m)&&win&&isFinal(m))champ=win;if(isPlayed(m)&&lose)dead.push(lose);if(isLive(m)||isFuture(m))[m.homeTeam,m.awayTeam].forEach(t=>{if(t&&!/TBD|winner of|loser of/i.test(t))alive.push(t)});if(isPlayed(m)&&win)alive.push(win)});if(champ)return same(team,champ)?{txt:'🏆 Champion',cls:'championStatus'}:{txt:'❌ Eliminated',cls:'eliminatedStatus'};if(ko.length){if(dead.some(t=>same(team,t)))return{txt:'❌ Eliminated',cls:'eliminatedStatus'};if(alive.some(t=>same(team,t))||seen.some(t=>same(team,t)))return{txt:'✅ Still Alive',cls:'aliveStatus'};return{txt:'❌ Eliminated',cls:'eliminatedStatus'}}return{txt:'✅ Still Alive',cls:'aliveStatus'}}
function liveFor(w,t){try{return (w.matches||[]).filter(m=>isLive(m)&&(same(t,m.homeTeam)||same(t,m.awayTeam)))}catch(e){return[]}}
function record(w,t){let r={w:0,d:0,l:0};try{(w.matches||[]).forEach(m=>{if(!isPlayed(m))return;let h=same(t,m.homeTeam),a=same(t,m.awayTeam);if(!h&&!a)return;let hs=Number(m.homeScore||0),as=Number(m.awayScore||0);if(hs===as)r.d++;else if((h&&hs>as)||(a&&as>hs))r.w++;else r.l++})}catch(e){}return r}
function patch(){const {app,appWin,wrapWin}=docs();if(!app)return;if(appWin){appWin.rec=t=>record(appWin,t);appWin.status=t=>{let st=fifa(appWin,t),live=liveFor(appWin,t);if(live.length){let m=live[0];return{cls:'live '+st.cls,txt:`${st.txt} • Playing now • ${show(m.homeTeam)} ${m.homeScore??0} - ${m.awayScore??0} ${show(m.awayTeam)}`}}return{cls:st.cls,txt:st.txt}};try{['DEFAULT_GROUPS','groups'].forEach(k=>{if(Array.isArray(appWin[k]))appWin[k].forEach(g=>{if(g.group==='Group 1')g.friends=['Hugh','Evie','Ollie','Sharon'];if(Array.isArray(g.teams))g.teams=g.teams.map(show)})});if(Array.isArray(appWin.matches))appWin.matches.forEach(m=>{m.homeTeam=show(m.homeTeam);m.awayTeam=show(m.awayTeam)})}catch(e){}}if(wrapWin){wrapWin.scoreText=function(m){m.homeTeam=show(m.homeTeam);m.awayTeam=show(m.awayTeam);if(isFuture(m))return `${m.homeTeam} 0 - 0 ${m.awayTeam}`;let win=winner(m);return `${m.homeTeam} ${m.homeScore??0} - ${m.awayScore??0} ${m.awayTeam}${win?'<div class="wcWinner">'+(isLive(m)?'Winning':'Winner')+': '+show(win)+'</div>':''}`}}}
function style(){const {app}=docs();if(!app||app.getElementById('fifaRosterStatusStyleV61'))return;let s=app.createElement('style');s.id='fifaRosterStatusStyleV61';s.textContent='.rosterTeam,.rosterStatus,.rosterScore,.rosterRecord{animation:none!important;transition:none!important}.rosterStatus.aliveStatus{background:#dcfce7!important;color:#087443!important;border:1px solid #86efac!important}.rosterStatus.eliminatedStatus{background:#fee2e2!important;color:#b42318!important;border:1px solid #fecaca!important}.rosterStatus.championStatus{background:#fef3c7!important;color:#92400e!important;border:1px solid #fbbf24!important;box-shadow:none!important}.rosterTeam.fifaAlive{border-color:#86efac!important;background:#f0fdf4!important}.rosterTeam.fifaEliminated{border-color:#fecaca!important;background:#fff7f7!important;opacity:1!important}.rosterTeam.fifaChampion{border-color:#fbbf24!important;background:#fff7d6!important;box-shadow:none!important}';app.head.appendChild(s)}
function apply(){const {app,appWin}=docs();if(!app||!appWin)return;app.querySelectorAll('.rosterTeam').forEach(card=>{let n=card.querySelector('.rosterTeamName'),el=card.querySelector('.rosterStatus');if(!n||!el)return;let team=(n.textContent||'').replace('⚽','').trim(),st=fifa(appWin,team);if(!liveFor(appWin,team).length)el.textContent=st.txt;el.classList.remove('aliveStatus','eliminatedStatus','championStatus');el.classList.add(st.cls);card.classList.remove('fifaAlive','fifaEliminated','fifaChampion');card.classList.add(st.cls==='championStatus'?'fifaChampion':st.cls==='eliminatedStatus'?'fifaEliminated':'fifaAlive')})}
function sync(from){const {app}=docs();if(!app||syncing)return;syncing=true;[['search','sSearch'],['friend','sFriend'],['status','sStatus'],['tz','sTz']].forEach(([a,b])=>{let x=app.getElementById(a),y=app.getElementById(b);if(!x||!y)return;let src=from===b?y:x;if(app.activeElement===y)src=y;if(x.value!==src.value)x.value=src.value;if(y.value!==src.value)y.value=src.value});syncing=false}
function fixText(){const {app}=docs();if(!app)return;app.querySelectorAll('option,.leaderName,.rosterHead b,.rosterMeta,.liveFriendPill,.impactPill').forEach(el=>{let t=el.textContent||'';t=t.replace(/Hugh\s*,\s*Ollie\s*,\s*Sharon\s*(?:,|&|and)?\s*Barry/gi,'Hugh, Evie, Ollie, Sharon').replace(/Hugh\s*•\s*Ollie\s*•\s*Sharon\s*•\s*Barry/gi,'Hugh • Evie • Ollie • Sharon').replace(/Bosnia(?:\s+and\s+Herzegovina|-Herzegovina)?/gi,'Bosnia-Herzegovina').replace(/DR\s+Congo|Congo\s+DR/gi,'Congo Dr');if(el.textContent!==t)el.textContent=t})}
function resize(){try{let wrap=frame.contentDocument;frame.style.height=Math.max(wrap.documentElement.scrollHeight,window.innerHeight)+'px'}catch(e){}}
function update(from){const {app,appWin,wrapWin}=docs();if(!app)return;sync(from);patch();style();fixText();try{if(appWin&&typeof appWin.refresh==='function'&&Date.now()-lastRefresh>600){lastRefresh=Date.now();appWin.refresh()}}catch(e){}try{if(wrapWin&&typeof wrapWin.update==='function')wrapWin.update(from)}catch(e){}setTimeout(()=>{style();fixText();apply();resize()},30);resize()}
function install(){const {app}=docs();if(!app||app.__v61FifaInstall)return;['search','sSearch','friend','sFriend','status','sStatus','tz','sTz'].forEach(id=>{let el=app.getElementById(id);if(el){el.addEventListener('input',()=>setTimeout(()=>update(id),10),true);el.addEventListener('change',()=>setTimeout(()=>update(id),10),true)}});try{new MutationObserver(()=>apply()).observe(app.body,{childList:true,subtree:true})}catch(e){}app.__v61FifaInstall=true}
function boot(){install();update();apply()}
frame.addEventListener('load',()=>{let b=setInterval(boot,80);setTimeout(()=>clearInterval(b),5000);setTimeout(boot,25);setTimeout(boot,150);setTimeout(boot,500);setTimeout(boot,950)});let i=setInterval(boot,100);setTimeout(()=>clearInterval(i),5000);setInterval(boot,1500);
</script></body></html>
