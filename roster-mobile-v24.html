<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Compact Mobile Roster Tracker</title><style>html,body{margin:0;width:100%;height:100%;background:#0f7b3f;overflow:auto}iframe{border:0;width:100%;min-height:100vh;display:block}</style></head><body><iframe id="tracker" src="appv15.html?roster=24"></iframe><script>
const f=document.getElementById('tracker');
function groupName(w,g){try{return w.gname(g.group||g)}catch(e){return (g.friends||[]).join(', ')||g.group||g}}
function inject(){const d=f.contentDocument,w=f.contentWindow;if(!d||!w)return;let s=d.getElementById('compact-roster-style');if(!s){s=d.createElement('style');s.id='compact-roster-style';s.textContent=`
html,body{overflow-x:hidden!important;max-width:100%!important;height:auto!important}.top{position:static!important;top:auto!important;padding:8px!important}.scorebar{position:static!important;grid-template-columns:1fr!important;border-radius:16px!important;padding:10px!important}.scorebar .big{font-size:20px!important;color:white!important;line-height:1.08!important}.score{font-size:28px!important}.scorebar button,.ghost{display:none!important}.hero .ball{display:none!important}.hero{grid-template-columns:1fr!important;border-radius:16px!important;margin-bottom:8px!important}.hero>div:first-child{padding:14px!important}.hero h1{font-size:24px!important;line-height:1.05!important;margin:0 0 6px!important}.hero p{font-size:12px!important;line-height:1.28!important;margin:4px 0!important}header,main{padding:8px!important;max-width:100%!important}.toolbar,.scheduleFilters{grid-template-columns:1fr 1fr!important;border-radius:16px!important;padding:8px!important;gap:8px!important;margin:8px 0!important}.toolbar>div:nth-child(5){grid-column:1/-1!important}.toolbar>div:nth-child(6){display:none!important}.scheduleFilters>div{min-width:0!important}label{font-size:10px!important;margin-bottom:3px!important}select,input,button{font-size:14px!important;min-height:38px!important;width:100%!important;padding:8px!important;border-radius:12px!important}.cards{display:none!important}.grid{grid-template-columns:1fr!important;border-radius:16px!important;padding:10px!important;margin-bottom:8px!important}.grid:nth-of-type(1)>div:nth-child(2){display:none!important}.wide{border-radius:16px!important;padding:10px!important;margin-bottom:8px!important}h2{font-size:19px!important;line-height:1.1!important;margin-bottom:8px!important}.muted{font-size:10px!important}.row{grid-template-columns:1fr!important;gap:4px!important;margin:8px 0!important}.bar{height:14px!important}.teamGrid{grid-template-columns:1fr!important}.tile,.winBox{border-radius:12px!important;padding:8px!important}.teamPill,.pill{font-size:10px!important;white-space:normal!important;line-height:1.15!important;padding:5px 7px!important}table{min-width:720px!important;font-size:12px!important}th,td{padding:6px!important}.rosterGroup{background:#fff;border:1px solid #d9f1df;border-radius:14px;margin:8px 0;overflow:hidden;box-shadow:0 4px 10px #0001}.rosterHead{background:linear-gradient(135deg,#073b4c,#0f7b3f);color:#fff;padding:9px 10px}.rosterHead b{font-size:14px}.rosterMeta{font-size:10px;opacity:.9;margin-top:2px}.rosterTeams{display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:7px}.rosterTeam{border:1px solid #e1f1e6;border-radius:12px;padding:7px;background:#fafffb;display:block;min-width:0}.rosterTop{display:flex;justify-content:space-between;gap:4px;align-items:flex-start}.rosterTeamName{font-weight:950;color:#073b4c;font-size:12px;line-height:1.15}.rosterRecord{font-size:10px;color:#667085;margin-top:2px;line-height:1.15}.rosterScore{font-weight:1000;background:#fff7d6;color:#8a6200;border-radius:999px;padding:4px 6px;font-size:10px;white-space:nowrap}.rosterStatus{display:block;margin-top:5px;font-size:10px;font-weight:900;border-radius:999px;padding:4px 6px;line-height:1.1;width:fit-content;max-width:100%}@media(max-width:360px){.rosterTeams{grid-template-columns:1fr}.toolbar,.scheduleFilters{grid-template-columns:1fr!important}}`;d.head.appendChild(s)}
const alertDiv=[...d.querySelectorAll('.toolbar>div')].find(x=>/Notifications|Enable Alerts/i.test(x.textContent||''));if(alertDiv)alertDiv.remove();
renderOverallLeaderboard(d,w);renderRoster(d,w);try{f.style.height=d.documentElement.scrollHeight+'px'}catch(e){}
}
function overallRows(w){if(!w.groups||!w.calc)return[];const sc=w.calc(w.groups);return Object.keys(sc).map(k=>[k,sc[k]]).sort((a,b)=>b[1].points-a[1].points)}
function renderOverallLeaderboard(d,w){const rows=overallRows(w);const board=d.getElementById('leaderboard');if(!board)return;const max=Math.max(12,...rows.map(r=>r[1].points));board.innerHTML=rows.map((r,i)=>`<div class="row"><div><b>${i?'':'👑 '}${groupName(w,r[0])}</b><div class="muted">Overall ranking • FIFA ${r[1].fifa} • Bonus ${r[1].bonus}</div></div><div class="bar"><span style="width:${Math.min(100,r[1].points/max*100)}%"></span></div><b>${r[1].points} pts</b></div>`).join('')}
function renderRoster(d,w){if(!w.groups||!w.score||!w.status||!w.rec)return;const holder=d.getElementById('groups');if(!holder)return;const gs=w.fGroups?w.fGroups():w.groups;holder.innerHTML=gs.map(g=>{const teams=(g.teams||[]).map(t=>{let sc=w.score(t),st=w.status(t),r=w.rec(t);return `<div class="rosterTeam"><div class="rosterTop"><div><div class="rosterTeamName">⚽ ${t}</div><div class="rosterRecord">${r.w}W-${r.d}D-${r.l}L • FIFA ${sc.fifa} • B ${sc.bonus}</div></div><div class="rosterScore">${sc.total}</div></div><span class="rosterStatus ${st.cls}">${st.txt.replace('✅ ','').replace('⚠️ ','').replace('⏳ ','').replace('➖ ','').replace('🔥 ','')}</span></div>`}).join('');return `<div class="rosterGroup"><div class="rosterHead"><b>${groupName(w,g)}</b><div class="rosterMeta">${(g.friends||[]).join(' • ')} • ${(g.teams||[]).length} teams</div></div><div class="rosterTeams">${teams}</div></div>`}).join('')||'<div class="empty">No roster teams match filters.</div>'}
f.addEventListener('load',()=>{setTimeout(inject,800);setInterval(()=>{try{inject()}catch(e){}},1000)});
</script></body></html>
