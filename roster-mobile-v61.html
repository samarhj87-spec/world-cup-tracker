<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>World Cup Mobile Roster Tracker</title><link rel="preload" href="roster-mobile-v26.html?v=60" as="document"><style>html,body{margin:0;width:100%;height:100%;background:#0f7b3f;overflow:auto}iframe{border:0;width:100%;min-height:100vh;display:block}</style></head><body><iframe id="tracker" loading="eager" fetchpriority="high" src="roster-mobile-v26.html?v=60"></iframe><script>
const frame=document.getElementById('tracker');let lastRefresh=0;
function getDocs(){try{const wrap=frame.contentDocument,wrapWin=frame.contentWindow;const appFrame=wrap&&wrap.getElementById('tracker');const app=appFrame&&appFrame.contentDocument;const appWin=appFrame&&appFrame.contentWindow;return{wrap,wrapWin,app,appWin}}catch(e){return{}}}
function fire(el,type){try{el.dispatchEvent(new Event(type,{bubbles:true}))}catch(e){}}
function norm(x){return String(x||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/&/g,'and').replace(/[^a-z0-9 ]/g,' ').replace(/\s+/g,' ').trim()}
const TEAM_CODES={usa:['united states','us','u s a','america'],mex:['mexico'],rsa:['south africa'],kor:['south korea','korea'],cze:['czechia','czech republic'],can:['canada'],bih:['bosnia and herzegovina','bosnia'],qat:['qatar'],sui:['switzerland'],bra:['brazil'],mar:['morocco'],hti:['haiti'],sco:['scotland'],aus:['australia'],tur:['turkey','turkiye'],par:['paraguay'],ger:['germany'],cuw:['curacao'],civ:['ivory coast','cote d ivoire'],ecu:['ecuador'],ned:['netherlands','holland'],jpn:['japan'],swe:['sweden'],tun:['tunisia'],bel:['belgium'],egy:['egypt'],iri:['iran'],nzl:['new zealand'],esp:['spain'],cpv:['cape verde'],ksa:['saudi arabia'],uru:['uruguay'],fra:['france'],sen:['senegal'],irq:['iraq'],nor:['norway'],arg:['argentina'],dza:['algeria'],aut:['austria'],jor:['jordan'],por:['portugal'],cod:['dr congo','congo'],uzb:['uzbekistan'],col:['colombia'],eng:['england'],cro:['croatia'],gha:['ghana'],pan:['panama']};
function teamTokens(t){let n=norm(t),out=[n];Object.keys(TEAM_CODES).forEach(code=>{if(TEAM_CODES[code].some(a=>norm(a)===n))out.push(code,...TEAM_CODES[code].map(norm));});return [...new Set(out)]}
function teamMatches(q,t){let nq=norm(q);if(!nq)return true;return teamTokens(t).some(tok=>tok.includes(nq)||nq.includes(tok))}
function pairValue(app,a,b,from){const x=app.getElementById(a),y=app.getElementById(b);if(!x||!y)return;const src=(from===a)?x:(from===b)?y:(y.value&&y.value!=='all'?y:x);const dst=src===x?y:x;if(dst.value!==src.value){dst.value=src.value;fire(dst,'input');fire(dst,'change')}}
function sync(app,from){pairValue(app,'search','sSearch',from);pairValue(app,'friend','sFriend',from);pairValue(app,'status','sStatus',from);pairValue(app,'tz','sTz',from)}
function desiredNames(){return ['Hugh','Evie','Ollie','Sharon']}
function updateFriendNames(){const {app,appWin}=getDocs();const next=desiredNames();if(appWin){try{if(Array.isArray(appWin.DEFAULT_GROUPS)){appWin.DEFAULT_GROUPS.forEach(g=>{if(g.group==='Group 1')g.friends=next.slice()})}}catch(e){}try{if(Array.isArray(appWin.groups)){appWin.groups.forEach(g=>{const names=(g.friends||[]).map(norm).join('|');if(g.group==='Group 1'||(/hugh/.test(names)&&/ollie/.test(names)&&/sharon/.test(names))){g.friends=next.slice()}});appWin.localStorage.wcFriendGroups_v15=JSON.stringify(appWin.groups)}}catch(e){}}if(app){const newComma='Hugh, Evie, Ollie, Sharon',newBullet='Hugh • Evie • Ollie • Sharon';app.querySelectorAll('option,.leaderName,.rosterHead b,.rosterMeta,.liveFriendPill,.impactPill').forEach(el=>{let t=el.textContent||'';t=t.replace(/Hugh\s*,\s*Ollie\s*,\s*Sharon\s*(?:,|&|and)?\s*Barry/gi,newComma).replace(/Hugh\s*•\s*Ollie\s*•\s*Sharon\s*•\s*Barry/gi,newBullet).replace(/Hugh\s*,\s*Ollie\s*,\s*Sharon/gi,newComma);if(el.textContent!==t)el.textContent=t;});}}
function isLiveMatch(m){return ['in','live','playing'].includes(norm(m&&m.state))||['in','live','playing'].includes(norm(m&&m.status))}
function schedulePriority(m){if(isLiveMatch(m))return 0;let s=norm((m&&m.state)||'');if(['pre','upcoming','scheduled'].includes(s))return 1;if(['post','complete','completed','final','finished'].includes(s))return 2;return 3}
function patchScheduleOrder(){const {wrapWin}=getDocs();if(!wrapWin)return;wrapWin.scheduleRows=function(d,w){return (w.matches||[]).slice().filter(m=>{try{return wrapWin.matchAllowedByFilters?wrapWin.matchAllowedByFilters(d,w,m):true}catch(e){return true}}).sort((a,b)=>{let pa=schedulePriority(a),pb=schedulePriority(b);if(pa!==pb)return pa-pb;let da=new Date(a.date).getTime()||0,db=new Date(b.date).getTime()||0;return pa===2?db-da:da-db})};}
function patchScoreText(){const {wrapWin}=getDocs();if(!wrapWin)return;wrapWin.scoreText=function(m){if(m.state==='pre')return `${m.homeTeam} 0 - 0 ${m.awayTeam}`;let lead='';if(Number(m.homeScore)>Number(m.awayScore))lead=m.homeTeam;if(Number(m.awayScore)>Number(m.homeScore))lead=m.awayTeam;let label=isLiveMatch(m)?'Winning':'Winner';return `${m.homeTeam} ${m.homeScore} - ${m.awayScore} ${m.awayTeam}${lead?'<div class="wcWinner">'+label+': '+lead+'</div>':''}`};}
function applyFilters(from){const {wrapWin,app,appWin}=getDocs();if(!app)return false;updateFriendNames();sync(app,from);patchScoreText();patchScheduleOrder();try{if(appWin&&typeof appWin.refresh==='function'&&Date.now()-lastRefresh>900){lastRefresh=Date.now();appWin.refresh()}}catch(e){}try{if(wrapWin&&typeof wrapWin.update==='function')wrapWin.update(from)}catch(e){}setTimeout(updateFriendNames,20);resize();return true;}
function install(){const {app}=getDocs();if(!app)return false;if(app.__filterStableV70)return true;['search','sSearch','friend','sFriend','status','sStatus','tz','sTz'].forEach(id=>{const el=app.getElementById(id);if(!el)return;el.addEventListener('input',()=>setTimeout(()=>applyFilters(id),20));el.addEventListener('change',()=>setTimeout(()=>applyFilters(id),20));});app.__filterStableV70=true;return true;}
function resize(){try{const wrap=frame.contentDocument;frame.style.height=Math.max(wrap.documentElement.scrollHeight,window.innerHeight)+'px'}catch(e){}}
function fastStart(){install();updateFriendNames();patchScoreText();patchScheduleOrder();applyFilters();resize()}
frame.addEventListener('load',()=>{const boot=setInterval(fastStart,75);setTimeout(()=>clearInterval(boot),5000);setTimeout(fastStart,25);setTimeout(fastStart,150);setTimeout(fastStart,500);setTimeout(fastStart,950);});
const immediate=setInterval(fastStart,100);setTimeout(()=>clearInterval(immediate),5000);
setInterval(fastStart,3000);
</script></body></html>
