<!doctype html><html><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>World Cup Mobile Roster Tracker</title><style>html,body{margin:0;width:100%;height:100%;background:#0f7b3f;overflow:auto}iframe{border:0;width:100%;min-height:100vh;display:block}</style><script>
const DESIRED_FRIENDS=['Hugh','Sharon','Evie','Ollie'];
const DEFAULT_GROUPS_FIXED=[{group:'Group 1',friends:DESIRED_FRIENDS,teams:['Bosnia','Austria','South Africa','Czechia','Tunisia','Mexico','Croatia','Curaçao','Paraguay','Iraq','Scotland','Uzbekistan']},{group:'Group 2',friends:['Keith','Susie','Henry','Thomas','Barney'],teams:['New Zealand','Spain','Cape Verde','France','United States','Uruguay','Iran','Morocco','Canada','Qatar','Norway','Germany']},{group:'Group 3',friends:['Mike','Polly','Eric','Sharon'],teams:['Switzerland','Haiti','Brazil','Portugal','Ecuador','Ghana','South Korea','Panama','Netherlands','Egypt','Jordan','England']},{group:'Group 4',friends:['Brandon','Samar','Rascal'],teams:['Algeria','Türkiye','Saudi Arabia','DR Congo','Sweden','Senegal','Japan','Argentina','Australia','Côte d\'Ivoire','Belgium','Colombia']}];
function fixFriendGroups(list){if(!Array.isArray(list))return false;let changed=false;list.forEach(g=>{if(!g)return;let fs=(g.friends||[]).map(x=>String(x));let low=fs.map(x=>x.toLowerCase());if(g.group==='Group 1'||low.includes('barry')||(low.includes('hugh')&&low.includes('ollie'))){if(JSON.stringify(fs)!==JSON.stringify(DESIRED_FRIENDS)){g.friends=DESIRED_FRIENDS.slice();changed=true}}});return changed}
try{let key='wcFriendGroups_v15',gs=JSON.parse(localStorage[key]||'null');if(!Array.isArray(gs))gs=JSON.parse(JSON.stringify(DEFAULT_GROUPS_FIXED));fixFriendGroups(gs);localStorage[key]=JSON.stringify(gs)}catch(e){}
</script></head><body><iframe id='tracker' src='roster-mobile-v26.html?v=63'></iframe><script>
const frame=document.getElementById('tracker');
const ALIASES={'usa':'united states','u s a':'united states','united states of america':'united states','bosnia and herzegovina':'bosnia','dr congo':'dr congo','congo':'dr congo','ivory coast':'ivory coast','cote d ivoire':'ivory coast','curacao':'curacao','curaçao':'curacao','turkiye':'turkey','türkiye':'turkey'};
const ALIVE_TEAMS=new Set(['canada','brazil','paraguay','morocco','norway','france','mexico','england','belgium','united states','spain','portugal','switzerland','egypt','argentina','colombia','ghana']);
const R32_OUT_TEAMS=new Set(['south africa','japan','germany','netherlands','ivory coast','sweden','ecuador','dr congo','senegal','bosnia','austria','croatia','algeria','australia','cape verde']);
const OUT_TEAMS=new Set(['south africa','japan','germany','netherlands','ivory coast','sweden','ecuador','dr congo','senegal','bosnia','austria','croatia','algeria','australia','cape verde','south korea','czechia','tunisia','curacao','qatar','new zealand','iran','uruguay','haiti','scotland','turkey','saudi arabia','iraq','jordan','uzbekistan','panama']);
function norm(x){return String(x||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/&/g,'and').replace(/[^a-z0-9 ]/g,' ').replace(/\s+/g,' ').trim()}
function canon(x){let n=norm(x);return ALIASES[n]||n}
function esc(x){return String(x||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function sameTeam(a,b){return canon(a)===canon(b)}
function isKO(m){return /round of 32|round 32|r32|round of 16|round 16|r16|quarter|semi|final|third|3rd|knockout/i.test([m&&m.round,m&&m.stage,m&&m.phase,m&&m.roundName,m&&m.stageName,m&&m.name,m&&m.status].filter(Boolean).join(' '))}
function isDone(m){let s=norm((m&&m.state)||m&&m.status);return !!(m&&(m.completed||['post','complete','completed','final','finished','ft'].includes(s)))}
function winner(m){if(!m)return'';if(m.winner)return m.winner;if(m.winnerTeam)return m.winnerTeam;let hs=Number(m.homeScore),as=Number(m.awayScore);if(!isNaN(hs)&&!isNaN(as)&&hs!==as)return hs>as?m.homeTeam:m.awayTeam;let hp=Number(m.homePenaltyScore||m.homePenalties||m.homePens),ap=Number(m.awayPenaltyScore||m.awayPenalties||m.awayPens);if(!isNaN(hp)&&!isNaN(ap)&&hp!==ap)return hp>ap?m.homeTeam:m.awayTeam;return''}
function teamStatus(w,t){let n=canon(t);try{let ms=(w.matches||[]).filter(m=>isKO(m)&&(sameTeam(m.homeTeam,t)||sameTeam(m.awayTeam,t))).sort((a,b)=>new Date(a.date)-new Date(b.date));if(ms.length){let alive=false,lost=false;ms.forEach(m=>{if(isDone(m)){let win=winner(m);if(win&&canon(win)===n)alive=true;else if(win)lost=true}else alive=true});if(lost)return'eliminated';if(alive)return'alive'}}catch(e){}if(OUT_TEAMS.has(n))return'eliminated';if(ALIVE_TEAMS.has(n))return'alive';return'eliminated'}
function elimStage(t){return R32_OUT_TEAMS.has(canon(t))?'Round of 32':'Group Stage'}
function getMiddle(){try{return{d:frame.contentDocument,w:frame.contentWindow}}catch(e){return{}}}
function getApp(midDoc){try{let inner=midDoc&&midDoc.querySelector?midDoc.querySelector('iframe'):null;return{d:inner&&inner.contentDocument,w:inner&&inner.contentWindow}}catch(e){return{}}}
function normalizeFriendGroups(app){try{let changed=false;changed=fixFriendGroups(app.DEFAULT_GROUPS)||changed;changed=fixFriendGroups(app.groups)||changed;if(changed){try{app.localStorage.wcFriendGroups_v15=JSON.stringify(app.groups)}catch(e){}try{if(typeof app.controls==='function')app.controls()}catch(e){}try{let ed=app.document&&app.document.getElementById('editor');if(ed)ed.value=JSON.stringify(app.groups,null,2)}catch(e){}}return changed}catch(e){return false}}
function groupName(mid,app,g){try{return app.gname?app.gname(g.group||g):(g.friends||[]).join(', ')}catch(e){return(g&&g.group)||String(g||'')}}
function groupsFiltered(mid,d,app){try{return mid.filteredGroups?mid.filteredGroups(d,app):(app.groups||[])}catch(e){return app.groups||[]}}
function counts(app,g){let c={alive:0,eliminated:0,total:0};((g&&g.teams)||[]).forEach(t=>{c.total++;teamStatus(app,t)==='alive'?c.alive++:c.eliminated++});return c}
function statePriority(m){let s=norm((m&&m.state)||m&&m.status);if(['in','live','playing'].includes(s))return 0;if(['pre','upcoming','scheduled'].includes(s))return 1;if(['post','complete','completed','final','finished','ft'].includes(s))return 2;return 3}
function patchMiddle(){const midPack=getMiddle(),mid=midPack.w,midDoc=midPack.d;if(!mid||!midDoc)return;const appPack=getApp(midDoc),d=appPack.d,app=appPack.w;if(!d||!app)return;const namesChanged=normalizeFriendGroups(app);try{if(namesChanged&&typeof app.render==='function')app.render()}catch(e){}try{mid.applyPointColors=function(){}}catch(e){}try{mid.renderLeaderboard=function(doc,win){const board=doc.getElementById('leaderboard');if(!board)return;let sec=board.closest('.grid>div')||board.parentElement;if(sec){let h=sec.querySelector('h2');if(h&&!/alive|eliminated/i.test(h.textContent||''))h.textContent='🏆 Friend Leaderboard';let note=sec.querySelector('.leaderNote');if(!note){note=doc.createElement('div');note.className='leaderNote';h&&h.insertAdjacentElement('afterend',note)}note.textContent='Alive and eliminated teams by friend group.';[...sec.children].forEach(el=>{if(el.id==='leaderboard'||el.classList.contains('leaderNote')||el.tagName==='H2')return;if(/points|bonus|win 3|draw 1|loss 0/i.test(el.textContent||''))el.textContent='Alive and eliminated teams by friend group.'})}let rows=groupsFiltered(mid,doc,win).map(g=>({g,c:counts(win,g)})).sort((a,b)=>b.c.alive-a.c.alive||a.c.eliminated-b.c.eliminated);if(!rows.length){board.innerHTML='<div class="empty">No teams found for this filter.</div>';return}board.innerHTML='<div class="leaderCards">'+rows.map((r,i)=>{let c=r.c,total=Math.max(1,c.total),ap=Math.round(c.alive/total*100),medal=i===0?'🥇':i===1?'🥈':i===2?'🥉':'⚽',name=groupName(mid,win,r.g);return `<button class="leaderCard ${i===0?'first':''}" data-group="${esc(r.g.group)}"><div class="leaderTop"><span class="medal">${medal}</span><span class="leaderName">${esc(name)}</span><span class="leaderPts">${c.alive} alive</span></div><div class="leaderMeta">${c.alive} alive • ${c.eliminated} eliminated</div><div class="leaderBar"><span style="width:${ap}%;background:linear-gradient(90deg,#0f7b3f,#86efac)"></span></div><div class="leaderMeta">🟢 Alive &nbsp; 🔴 Eliminated</div><div class="leaderTap">Tap to filter this group</div></button>`}).join('')+'</div>';board.querySelectorAll('.leaderCard').forEach(btn=>btn.onclick=()=>{if(mid.setFriend)mid.setFriend(doc,btn.dataset.group);let sched=doc.getElementById('schedule');if(sched)sched.scrollIntoView({behavior:'smooth',block:'start'})})};mid.renderRoster=function(doc,win){const holder=doc.getElementById('groups');if(!holder)return;let gs=groupsFiltered(mid,doc,win);holder.innerHTML=gs.map(g=>{let teams=(g.teams||[]).map(t=>{let status=teamStatus(win,t),stage=elimStage(t),alive=status==='alive';return `<div class="rosterTeam"><div class="rosterTop"><div><div class="rosterTeamName">⚽ ${esc(t)}</div><div class="rosterRecord" style="color:${alive?'#087443':'#b42318'};font-weight:900">${alive?'Still Alive • Knockout Stage':'Eliminated • '+stage}</div></div><div class="rosterScore" style="background:${alive?'#dcfce7':'#fff1f4'};color:${alive?'#087443':'#b42318'};border:1px solid ${alive?'#86efac':'#fecdd3'}">${alive?'Alive':'OUT'}</div></div><span class="rosterStatus" style="background:${alive?'#dcfce7':'#fff1f4'};color:${alive?'#087443':'#b42318'};border:1px solid ${alive?'#86efac':'#fecdd3'}">${alive?'Still Alive':'Eliminated'}</span></div>`}).join('');return `<div class="rosterGroup"><div class="rosterHead"><b>${esc(groupName(mid,win,g))}</b><div class="rosterMeta">${esc((g.friends||[]).join(' • '))} • ${(g.teams||[]).length} matching country team${(g.teams||[]).length===1?'':'s'}</div></div><div class="rosterTeams">${teams}</div></div>`}).join('')||'<div class="empty">No roster teams match this filter.</div>'};mid.scheduleRows=function(doc,win){return (win.matches||[]).slice().filter(m=>{try{return mid.matchAllowedByFilters?mid.matchAllowedByFilters(doc,win,m):true}catch(e){return true}}).sort((a,b)=>{let pa=statePriority(a),pb=statePriority(b);if(pa!==pb)return pa-pb;let da=new Date(a.date).getTime()||0,db=new Date(b.date).getTime()||0;return pa===2?db-da:da-db})};if(typeof mid.update==='function')setTimeout(()=>mid.update('alivePatch'),20)}catch(e){}}
function install(){patchMiddle();setTimeout(patchMiddle,200);setTimeout(patchMiddle,600);setTimeout(patchMiddle,1200)}
frame.addEventListener('load',()=>{install();setInterval(patchMiddle,1000)});
</script></body></html>
