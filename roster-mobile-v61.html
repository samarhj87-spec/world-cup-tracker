<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>World Cup Mobile Roster Tracker</title><style>html,body{margin:0;width:100%;height:100%;background:#0f7b3f;overflow:auto}iframe{border:0;width:100%;min-height:100vh;display:block}</style></head><body><iframe id="tracker" src="roster-mobile-v26.html?v=60"></iframe><script>
const frame=document.getElementById('tracker');
function norm(x){return String(x||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9 ]/g,' ').replace(/\s+/g,' ').trim()}
function docs(){try{let d=frame.contentDocument,w=frame.contentWindow;for(let i=0;i<10;i++){let inner=d&&d.querySelector?d.querySelector('iframe'):null;if(!inner||!inner.contentDocument)break;d=inner.contentDocument;w=inner.contentWindow}return{d,w}}catch(e){return{}}}
function wrap(){try{return{d:frame.contentDocument,w:frame.contentWindow}}catch(e){return{}}}
function statePriorityFromText(txt){let n=norm(txt);if(/live|playing|in progress|halftime|half time|\bin\b/.test(n))return 0;if(/upcoming|scheduled|not started|pre|tbd/.test(n))return 1;if(/complete|completed|final|finished|full time|\bft\b|post/.test(n))return 2;return 3}
function statePriorityFromMatch(m){let n=norm((m&&m.state)||m&&m.status);if(['in','live','playing'].includes(n))return 0;if(['pre','upcoming','scheduled'].includes(n))return 1;if(['post','complete','completed','final','finished','ft'].includes(n))return 2;return statePriorityFromText(n)}
function matchRoundText(m){return norm([m&&m.round,m&&m.stage,m&&m.phase,m&&m.roundName,m&&m.stageName,m&&m.name].filter(Boolean).join(' '))}
function isKnockoutMatch(m){return /round of 32|round 32|r32|round of 16|round 16|r16|quarter|semi|final|third|3rd|knockout/.test(matchRoundText(m))}
function isKnockoutStage(w){try{let ms=(w.matches||[]).filter(isKnockoutMatch);if(!ms.length)return false;let started=ms.some(m=>{let n=norm(m.state||m.status);let t=new Date(m.date).getTime()||0;return ['in','live','playing','post','complete','completed','final','finished','ft'].includes(n)||Date.now()>=t-2*60*60*1000});return started}catch(e){return false}}
function patchCleanSlate(){try{let {w}=wrap();if(!w)return;w.isKnockoutMode=function(win){return isKnockoutStage(win||w)};w.applyPointColors=function(doc,win){if(isKnockoutStage(win||w))return;try{doc.querySelectorAll('.rosterTeam').forEach(card=>{const name=card.querySelector('.rosterTeamName'),score=card.querySelector('.rosterScore'),record=card.querySelector('.rosterRecord'),status=card.querySelector('.rosterStatus');if(!name||!score||!(win||w).rec)return;const r=(win||w).rec(String(name.textContent||'').replace('⚽','').trim());if((r.w||0)>0||(r.d||0)>0){card.classList.add('pointTeam');score.classList.add('pointScore');record&&record.classList.add('pointRecord');status&&status.classList.add('pointStatus');}})}catch(e){}}}catch(e){}}
function removeKnockoutPoints(){const {d,w}=docs();if(!d||!w||!isKnockoutStage(w))return;d.querySelectorAll('#groups .rosterTeam').forEach(card=>{card.classList.remove('pointTeam');card.querySelectorAll('.pointScore,.pointRecord,.pointStatus').forEach(x=>x.classList.remove('pointScore','pointRecord','pointStatus'));let sc=card.querySelector('.rosterScore');if(sc)sc.textContent='KO';let rec=card.querySelector('.rosterRecord');if(rec)rec.textContent='Win-or-elimination • clean slate';let st=card.querySelector('.rosterStatus');if(st)st.textContent='Win-or-elimination';});d.querySelectorAll('#leaderboard .leaderPts').forEach(x=>{x.textContent='Clean slate'});d.querySelectorAll('#leaderboard .leaderMeta').forEach(x=>{x.textContent='Knockout phase • win-or-elimination'});}
function patchScheduleSource(){try{let d=frame.contentDocument,w=frame.contentWindow;if(!w)return;w.scheduleRows=function(doc,win){return (win.matches||[]).slice().filter(m=>{try{return w.matchAllowedByFilters?w.matchAllowedByFilters(doc,win,m):true}catch(e){return true}}).sort((a,b)=>{let pa=statePriorityFromMatch(a),pb=statePriorityFromMatch(b);if(pa!==pb)return pa-pb;let da=new Date(a.date).getTime()||0,db=new Date(b.date).getTime()||0;return pa===2?db-da:da-db})};if(typeof w.update==='function')setTimeout(()=>w.update('scheduleSort'),50)}catch(e){}}
function rowPriority(r){if(r.classList.contains('in'))return 0;if(r.classList.contains('pre'))return 1;if(r.classList.contains('post'))return 2;return statePriorityFromText(r.textContent||'')}
function sortScheduleDom(){const {d}=docs();if(!d)return;let tbody=d.getElementById('tbody');if(!tbody)return;let rows=[...tbody.querySelectorAll('tr')];if(rows.length<2)return;rows.forEach((r,i)=>{if(!r.dataset.originalOrder)r.dataset.originalOrder=String(i).padStart(5,'0')});let sorted=rows.slice().sort((a,b)=>{let pa=rowPriority(a),pb=rowPriority(b);if(pa!==pb)return pa-pb;let da=Date.parse(a.textContent)||0,db=Date.parse(b.textContent)||0;return pa===2?db-da:Number(a.dataset.originalOrder)-Number(b.dataset.originalOrder)});if(sorted.some((r,i)=>r!==rows[i]))sorted.forEach(r=>tbody.appendChild(r));}
function applyPatches(){patchCleanSlate();patchScheduleSource();setTimeout(()=>{sortScheduleDom();removeKnockoutPoints()},80);setTimeout(()=>{sortScheduleDom();removeKnockoutPoints()},300)}
function installWatch(){const {d}=docs();if(!d||d.__v61PatchWatch)return;['sStatus','sFriend','sSearch','sTz','status','friend','search','tz'].forEach(id=>{let el=d.getElementById(id);if(el){el.addEventListener('change',()=>setTimeout(applyPatches,120));el.addEventListener('input',()=>setTimeout(applyPatches,120));}});d.__v61PatchWatch=true;}
frame.addEventListener('load',()=>{setTimeout(()=>{installWatch();applyPatches()},700);setTimeout(()=>{installWatch();applyPatches()},1500);setInterval(()=>{installWatch();applyPatches()},3000)});
</script></body></html>
