<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>World Cup Winner</title><style>html,body{margin:0;height:100%;background:#0f7b3f}iframe{border:0;width:100%;min-height:100vh}.banner{position:fixed;top:10px;left:10px;right:10px;z-index:9999;padding:16px;text-align:center;border-radius:16px;background:linear-gradient(135deg,#fff8cd,#ffd700);border:3px solid #c99a00;color:#503900;font:900 17px/1.35 system-ui;box-shadow:0 8px 30px #0005}.piece{position:fixed;top:-10vh;z-index:10000;pointer-events:none;font-size:22px;animation:fall var(--t) linear var(--d) forwards}@keyframes fall{to{transform:translate3d(var(--x),110vh,0) rotate(900deg);opacity:.1}}</style></head><body><div class="banner">🇪🇸 SPAIN WON THE FIFA WORLD CUP! 🏆<br>🎉 Friend leaderboard winners: Keith, Susie, Henry, Thomas, Barney 🏆</div><iframe src="roster-mobile-v26.html?v=64"></iframe><script>let icons=['🎉','🎊','✨','⭐','🏆','🇪🇸'];for(let i=0;i<90;i++){let p=document.createElement('span');p.className='piece';p.textContent=icons[i%icons.length];p.style.left=Math.random()*100+'vw';p.style.setProperty('--x',(Math.random()-.5)*38+'vw');p.style.setProperty('--t',3.5+Math.random()*3.5+'s');p.style.setProperty('--d',Math.random()*1.8+'s');document.body.appendChild(p)}setTimeout(()=>document.querySelectorAll('.piece').forEach(x=>x.remove()),9000)</script></body></html>
