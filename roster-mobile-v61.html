<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>World Cup Mobile Roster Tracker</title><style>html,body{margin:0;width:100%;height:100%;background:#0f7b3f;overflow:auto}iframe{border:0;width:100%;min-height:100vh;display:block}</style></head><body><iframe id="tracker" src="roster-mobile-v26.html?v=60"></iframe><script>
const frame=document.getElementById('tracker');
const ALIASES={'usa':'united states','u s a':'united states','united states of america':'united states','bosnia and herzegovina':'bosnia','dr congo':'dr congo','congo':'dr congo','ivory coast':'ivory coast','cote d ivoire':'ivory coast','curacao':'curacao','curaçao':'curacao','turkiye':'turkey','türkiye':'turkey'};
const ALIVE_TEAMS=new Set(['canada','brazil','paraguay','morocco','norway','france','mexico','ecuador','england','dr congo','belgium','senegal','united states','bosnia','spain','austria','portugal','croatia','switzerland','algeria','australia','egypt','argentina','cape verde','colombia','ghana']);
const OUT_TEAMS=new Set(['south africa','japan','germany','netherlands','ivory coast','sweden','south korea','czechia','tunisia','curacao','qatar','new zealand','iran','uruguay','haiti','scotland','turkey','saudi arabia','iraq','jordan','uzbekistan','panama']);
function norm(x){return String(x||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/&/g,'and').replace(/[^a-z0-9 ]/g,' ').replace(/\s+/g,' ').trim()}
function canon(x){let n=norm(x);return ALIASES[n]||n}
function sameTeam(a,b){return canon(a)===canon(b)}
function docs(){try{let d=frame.contentDocument,w=frame.contentWindow;for(let i=0;i<10;i++){let inner=d&&d.querySelector?d.querySelector('iframe'):null;if(!inner||!inner.contentDocument)break;d=inner.contentDocument;w=inner.contentWindow}return{d,w}}catch(e){return{}}}
function wrap(){try{return{d:frame.contentDocument,w:frame.contentWindow}}catch(e){return{}}}
function esc(x){return String(x||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function statePriorityFromText(txt){let n=norm(txt);if(/live|playing|in progress|halftime|half time|\bin\b/.test(n))return 0;if(/upcoming|scheduled|not started|pre|tbd/.test(n))return 1;if(/complete|completed|final|finished|full time|\bft\b|post/.test(n))return 2;return 3}
function statePriorityFromMatch(m){let n=norm((m&&m.state)||m&&m.status);if(['in','live','playing'].includes(n))return 0;if(['pre','upcoming','scheduled'].includes(n))return 1;if(['post','complete','completed','final','finished','ft'].includes(n))return 2;return statePriorityFromText(n)}
function matchRoundText(m){return norm([m&&m.round,m&&m.stage,m&&m.phase,m&&m.roundName,m&&m.stageName,m&&m.name].filter(Boolean).join(' '))}
function isKnockoutMatch(m){return /round of 32|round 32|r32|round of 16|round 16|r16|quarter|semi|final|third|3rd|knockout/.test(matchRoundText(m))}
function isMatchDone(m){let n=norm(m&&m.state),s=norm(m&&m.status);return !!(m&&(m.completed||n==='post'||['complete','completed','final','finished','ft'].includes(s)))}
function winnerName(m){if(!m)return'';if(m.winner)return m.winner;if(m.winnerTeam)return m.winnerTeam;let hs=Number(m.homeScore),as=Number(m.awayScore);if(!isNaN(hs)&&!isNaN(as)&&hs!==as)return hs>as?m.homeTeam:m.awayTeam;let hp=Number(m.homePenaltyScore||m.homePenalties||m.homePens),ap=Number(m.awayPenaltyScore||m.awayPenalties||m.awayPens);if(!isNaN(hp)&&!isNaN(ap)&&hp!==ap)return hp>ap?m.homeTeam:m.awayTeam;return''}
function isKnockoutStage(w){try{let ms=(w.matches||[]).filter(isKnockoutMatch);if(!ms.length)return false;let started=ms.some(m=>{let n=norm(m.state||m.status);let t=new Date(m.date).getTime()||0;return ['in','live','playing','post','complete','completed','final','finished','ft'].includes(n)||Date.now()>=t-2*60*60*1000});return started}catch(e){return false}}
function teamAliveStatus(w,team){let n=canon(team);try{let ms=(w.matches||[]).filter(m=>isKnockoutMatch(m)&&(sameTeam(m.homeTeam,team)||sameTeam(m.awayTeam,team))).sort((a,b)=>new Date(a.date)-new Date(b.date));let lost=false,alive=false;if(ms.length){ms.forEach(m=>{if(isMatchDone(m)){let wn=winnerName(m);if(wn&&canon(wn)===n)alive=true;else if(wn)lost=true}else alive=true});if(lost)return'eliminated';if(alive)return'alive'}}catch(e){}if(OUT_TEAMS.has(n))return'eliminated';if(ALIVE_TEAMS.has(n))return'alive';return isKnockoutStage(w)?'eliminated':'alive'}
function selectedFriend(d){let a=d.getElementById('sFriend'),b=d.getElementById('friend');return (a&&a.value&&a.value!=='all')?a.value:((b&&b.value&&b.value!=='all')?b.value:'all')}
function groupLabel(w,g){try{return w.gname?w.gname(g.group||g):(g.friends||[]).join(', ')}catch(e){return(g&&g.group)||String(g||'')}}
function groupCounts(w,g){let c={alive:0,eliminated:0,total:0};((g&&g.teams)||[]).forEach(t=>{c.total++;if(teamAliveStatus(w,t)==='alive')c.alive++;else c.eliminated++});return c}
function cleanLeaderboardCopy(d,board){let sec=board&&(board.closest('.grid>div')||board.parentElement);if(!sec)return;if(!sec.querySelector('.leaderNote')){let note=d.createElement('div');note.className='leaderNote';note.innerHTML='🏆 Alive vs eliminated by friend group.';let h=sec.querySelector('h2');h&&h.insertAdjacentElement('afterend',note)}[...sec.children].forEach(el=>{if(el.id==='leaderboard'||el.classList.contains('leaderNote')||el.tagName==='H2')return;let txt=el.textContent||'';if(/points|bonus/i.test(txt)){el.textContent='Alive and eliminated teams by friend group.';el.style.color='#667085';el.style.fontWeight='700'}})}
function updateFriendLeaderboard(){const {d,w}=docs();if(!d||!w||!w.groups)return;let board=d.getElementById('leaderboard');if(!board)return;let sel=selectedFriend(d),groups=(w.groups||[]).filter(g=>sel==='all'||g.group===sel);let rows=groups.map(g=>({g,c:groupCounts(w,g)})).sort((a,b)=>b.c.alive-a.c.alive||a.c.eliminated-b.c.eliminated);let style=d.getElementById('friend-leader-alive-style');if(!style){style=d.createElement('style');style.id='friend-leader-alive-style';style.textContent='.leaderCards{display:grid;grid-template-columns:1fr;gap:10px}.leaderCard{border:1px solid #b7efc5;background:#f0fdf4;border-radius:16px;padding:12px;text-align:left;box-shadow:0 5px 12px #16a34a22}.leaderCard.first{background:linear-gradient(135deg,#dcfce7,#fef9c3)}.leaderTop{display:flex;align-items:center;gap:8px}.medal{font-size:24px}.leaderName{font-weight:1000;color:#073b4c;line-height:1.08;flex:1;font-size:18px}.leaderPts{background:#dcfce7;color:#087443;border:1px solid #86efac;border-radius:999px;padding:6px 11px;font-size:14px;font-weight:1000;white-space:nowrap}.leaderMeta{font-size:15px;color:#073b4c;font-weight:1000;margin:10px 0}.leaderSplit{display:flex;height:18px;background:#fff;border:1px solid #c8f5d2;border-radius:999px;overflow:hidden}.leaderSplit span{display:block;height:100%}.aliveSeg{background:linear-gradient(90deg,#0f7b3f,#86efac)}.outSeg{background:linear-gradient(90deg,#fecdd3,#f43f5e)}.leaderLegend{display:flex;justify-content:space-between;font-size:13px;font-weight:1000;margin-top:8px;color:#344054}.leaderTap{font-size:13px;color:#087443;font-weight:1000;margin-top:8px}.leaderNote{font-size:13px;color:#087443;font-weight:1000;margin:6px 0 8px}@media(max-width:430px){.leaderName{font-size:17px}.leaderMeta{font-size:14px}.leaderCard{padding:10px}.leaderPts{font-size:13px}}';d.head.appendChild(style)}cleanLeaderboardCopy(d,board);if(!rows.length){let empty='<div class="empty">No friend groups found.</div>';if(board.dataset.leaderHtml!==empty){board.dataset.leaderHtml=empty;board.innerHTML=empty}return}let html='<div class="leaderCards">'+rows.map((r,i)=>{let c=r.c,total=Math.max(1,c.total),alivePct=Math.round(c.alive/total*100),outPct=100-alivePct,medal=i===0?'🥇':i===1?'🥈':i===2?'🥉':'⚽',name=groupLabel(w,r.g);return `<button class="leaderCard ${i===0?'first':''}" data-group="${esc(r.g.group)}"><div class="leaderTop"><span class="medal">${medal}</span><span class="leaderName">${esc(name)}</span><span class="leaderPts">${c.alive} alive</span></div><div class="leaderMeta">${c.alive} alive • ${c.eliminated} eliminated</div><div class="leaderSplit"><span class="aliveSeg" style="width:${alivePct}%"></span><span class="outSeg" style="width:${outPct}%"></span></div><div class="leaderLegend"><span>🟢 Alive</span><span>🔴 Eliminated</span></div><div class="leaderTap">Tap to filter this group</div></button>`}).join('')+'</div>';if(board.dataset.leaderHtml===html)return;board.dataset.leaderHtml=html;board.innerHTML=html;board.querySelectorAll('.leaderCard').forEach(btn=>btn.onclick=()=>{['sFriend','friend'].forEach(id=>{let el=d.getElementById(id);if(el)el.value=btn.dataset.group});try{if(w.update)w.update('friendLeaderboardTap')}catch(e){}})}
function setText(el,txt){if(el&&el.textContent!==txt)el.textContent=txt}
function setStyle(el,key,val){if(el&&el.style[key]!==val)el.style[key]=val}
function patchCleanSlate(){try{let {w}=wrap();if(!w)return;w.isKnockoutMode=function(win){return isKnockoutStage(win||w)};w.applyPointColors=function(doc,win){if(isKnockoutStage(win||w))return;try{doc.querySelectorAll('.rosterTeam').forEach(card=>{const name=card.querySelector('.rosterTeamName'),score=card.querySelector('.rosterScore'),record=card.querySelector('.rosterRecord'),status=card.querySelector('.rosterStatus');if(!name||!score||!(win||w).rec)return;const r=(win||w).rec(String(name.textContent||'').replace('⚽','').trim());if((r.w||0)>0||(r.d||0)>0){card.classList.add('pointTeam');score.classList.add('pointScore');record&&record.classList.add('pointRecord');status&&status.classList.add('pointStatus');}})}catch(e){}}}catch(e){}}
function removeKnockoutPoints(){const {d,w}=docs();if(!d||!w||!isKnockoutStage(w))return;d.querySelectorAll('#groups .rosterTeam').forEach(card=>{let name=card.querySelector('.rosterTeamName'),team=String(name&&name.textContent||'').replace('⚽','').trim(),st=teamAliveStatus(w,team),score=card.querySelector('.rosterScore'),rec=card.querySelector('.rosterRecord'),stat=card.querySelector('.rosterStatus');card.classList.remove('pointTeam');card.querySelectorAll('.pointScore,.pointRecord,.pointStatus').forEach(x=>x.classList.remove('pointScore','pointRecord','pointStatus'));if(st==='eliminated'){setText(score,'OUT');setText(rec,'Eliminated • knockout stage');setText(stat,'Eliminated');[score,rec,stat].forEach(el=>{setStyle(el,'color','#b42318');setStyle(el,'fontWeight','900')});setStyle(score,'background','#fff1f4');setStyle(score,'border','1px solid #fecdd3');setStyle(stat,'background','#fff1f4');setStyle(stat,'border','1px solid #fecdd3')}else{setText(score,'KO');setText(rec,'Win-or-elimination • clean slate');setText(stat,'Win-or-elimination')}});updateFriendLeaderboard();}
function patchScheduleSource(){try{let d=frame.contentDocument,w=frame.contentWindow;if(!w)return;w.scheduleRows=function(doc,win){return (win.matches||[]).slice().filter(m=>{try{return w.matchAllowedByFilters?w.matchAllowedByFilters(doc,win,m):true}catch(e){return true}}).sort((a,b)=>{let pa=statePriorityFromMatch(a),pb=statePriorityFromMatch(b);if(pa!==pb)return pa-pb;let da=new Date(a.date).getTime()||0,db=new Date(b.date).getTime()||0;return pa===2?db-da:da-db})};if(typeof w.update==='function')setTimeout(()=>w.update('scheduleSort'),50)}catch(e){}}
function rowPriority(r){if(r.classList.contains('in'))return 0;if(r.classList.contains('pre'))return 1;if(r.classList.contains('post'))return 2;return statePriorityFromText(r.textContent||'')}
function sortScheduleDom(){const {d}=docs();if(!d)return;let tbody=d.getElementById('tbody');if(!tbody)return;let rows=[...tbody.querySelectorAll('tr')];if(rows.length<2)return;rows.forEach((r,i)=>{if(!r.dataset.originalOrder)r.dataset.originalOrder=String(i).padStart(5,'0')});let sorted=rows.slice().sort((a,b)=>{let pa=rowPriority(a),pb=rowPriority(b);if(pa!==pb)return pa-pb;let da=Date.parse(a.textContent)||0,db=Date.parse(b.textContent)||0;return pa===2?db-da:Number(a.dataset.originalOrder)-Number(b.dataset.originalOrder)});if(sorted.some((r,i)=>r!==rows[i]))sorted.forEach(r=>tbody.appendChild(r));}
function applyPatches(){patchCleanSlate();patchScheduleSource();setTimeout(()=>{sortScheduleDom();removeKnockoutPoints();updateFriendLeaderboard()},80);setTimeout(()=>{sortScheduleDom();removeKnockoutPoints();updateFriendLeaderboard()},300)}
function installWatch(){const {d}=docs();if(!d||d.__v61PatchWatch)return;['sStatus','sFriend','sSearch','sTz','status','friend','search','tz'].forEach(id=>{let el=d.getElementById(id);if(el){el.addEventListener('change',()=>setTimeout(applyPatches,120));el.addEventListener('input',()=>setTimeout(applyPatches,120));}});d.__v61PatchWatch=true;}
frame.addEventListener('load',()=>{setTimeout(()=>{installWatch();applyPatches()},700);setTimeout(()=>{installWatch();applyPatches()},1500);setInterval(()=>{installWatch();applyPatches()},3000)});
</script></body></html>
