<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>World Cup Mobile Roster Tracker</title><style>html,body{margin:0;width:100%;height:100%;background:#0f7b3f;overflow:auto}iframe{border:0;width:100%;min-height:100vh;display:block}</style></head><body><iframe id="tracker" src="roster-mobile-v26.html?v=60"></iframe><script>
const frame=document.getElementById('tracker');let lastRosterHtml='',lastFilterKey='';
const ELIMINATED=['South Africa','Japan','Germany','Czechia','South Korea','Qatar','Haiti','Scotland','Turkey','Türkiye','Curacao','Curaçao','Tunisia','Iran','New Zealand','Saudi Arabia','Uruguay','Iraq','Jordan','Uzbekistan','Panama'];
const STILL_ALIVE=['Canada','Brazil','Paraguay','Netherlands','Morocco','Ivory Coast','Côte d\'Ivoire','Norway','France','Sweden','Mexico','Ecuador','England','DR Congo','Belgium','Senegal','United States','Bosnia','Bosnia-Herzegovina','Bosnia and Herzegovina','Spain','Austria','Portugal','Croatia','Switzerland','Algeria','Australia','Egypt','Argentina','Cape Verde','Colombia','Ghana'];
function norm(x){return String(x||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/&/g,'and').replace(/[^a-z0-9 ]/g,' ').replace(/\s+/g,' ').trim()}
function same(a,b){let A=norm(a),B=norm(b);if(!A||!B)return false;let aliases={'usa':'united states','us':'united states','u s a':'united states','america':'united states','bosnia herzegovina':'bosnia','bosnia and herzegovina':'bosnia','bosnia-herzegovina':'bosnia','dr congo':'congo','congo dr':'congo','cote d ivoire':'ivory coast','côte d ivoire':'ivory coast','turkey':'turkiye','türkiye':'turkiye','curacao':'curacao','curaçao':'curacao'};A=aliases[A]||A;B=aliases[B]||B;return A===B}
function allDocs(){try{const wrap=frame.contentDocument,wrapWin=frame.contentWindow;const appFrame=wrap&&wrap.querySelector('iframe');const app=appFrame&&appFrame.contentDocument;const appWin=appFrame&&appFrame.contentWindow;return{wrap,wrapWin,app,appWin}}catch(e){return{}}}
function docs(){try{let d=frame.contentDocument,w=frame.contentWindow;for(let i=0;i<10;i++){let inner=d&&d.querySelector?d.querySelector('iframe'):null;if(!inner||!inner.contentDocument)break;d=inner.contentDocument;w=inner.contentWindow}return{d,w}}catch(e){return{}}}
function finalChampion(w){try{let finals=(w.matches||[]).filter(m=>/final/i.test(String(m.round||m.stage||m.phase||''))&&!/semi|third|3rd|place/i.test(String(m.round||m.stage||m.phase||'')));let m=finals.find(x=>['post','complete','completed','final','finished'].includes(norm(x.state||x.status)));if(!m)return'';let hs=Number(m.homeScore),as=Number(m.awayScore);if(Number.isFinite(hs)&&Number.isFinite(as)&&hs!==as)return hs>as?m.homeTeam:m.awayTeam;let hp=Number(m.homePenaltyScore??m.homePenalties??m.homePens??NaN),ap=Number(m.awayPenaltyScore??m.awayPenalties??m.awayPens??NaN);if(Number.isFinite(hp)&&Number.isFinite(ap)&&hp!==ap)return hp>ap?m.homeTeam:m.awayTeam;return m.winnerTeam||m.winner||m.winnerName||''}catch(e){return''}}
function status(team,w){let champ=finalChampion(w);if(champ)return same(team,champ)?['🏆 Champion','champion','championStatus']:['❌ Eliminated','eliminated','eliminatedStatus'];if(ELIMINATED.some(x=>same(x,team)))return['❌ Eliminated','eliminated','eliminatedStatus'];if(STILL_ALIVE.some(x=>same(x,team)))return['✅ Still Alive','alive','aliveStatus'];return['❌ Eliminated','eliminated','eliminatedStatus']}
function isCompleteMatch(m){let n=norm((m&&m.state)||m&&m.status);return ['post','complete','completed','final','finished','ft'].includes(n)}
function knockoutWinner(m){try{let hs=Number(m.homeScore),as=Number(m.awayScore);if(Number.isFinite(hs)&&Number.isFinite(as)&&hs!==as)return hs>as?m.homeTeam:m.awayTeam;let hp=Number(m.homePenaltyScore??m.homePenalties??m.homePens??m.homePenalty??NaN),ap=Number(m.awayPenaltyScore??m.awayPenalties??m.awayPens??m.awayPenalty??NaN);if(Number.isFinite(hp)&&Number.isFinite(ap)&&hp!==ap)return hp>ap?m.homeTeam:m.awayTeam;return m.winnerTeam||m.winner||m.winnerName||m.advancingTeam||m.advances||''}catch(e){return''}}
function fifaRecord(team,w){let rec={w:0,d:0,l:0,gf:0,ga:0,pts:0};try{(w.matches||[]).forEach(m=>{if(!isCompleteMatch(m))return;let home=same(team,m.homeTeam),away=same(team,m.awayTeam);if(!home&&!away)return;let forScore=Number(home?m.homeScore:m.awayScore),againstScore=Number(home?m.awayScore:m.homeScore);if(!Number.isFinite(forScore)||!Number.isFinite(againstScore))return;rec.gf+=forScore;rec.ga+=againstScore;if(forScore>againstScore){rec.w++;rec.pts+=3}else if(forScore<againstScore){rec.l++}else{let kw=knockoutWinner(m);if(kw&&same(team,kw)){rec.w++;rec.pts+=3}else if(kw){rec.l++}else{rec.d++;rec.pts+=1}}})}catch(e){}return rec}
function fifaPoints(team,w){return fifaRecord(team,w).pts}
function patchFifaScoring(){const {wrapWin,appWin}=allDocs();[wrapWin,appWin].forEach(x=>{if(!x||x.__fifaScoringPatched)return;x.__fifaScoringPatched=true;x.noBonusRecord=function(w,t){return fifaRecord(t,w||x)};x.noBonusScore=function(w,t){return fifaPoints(t,w||x)};x.matchPts=function(m,t){if(!m||!isCompleteMatch(m))return 0;let home=same(t,m.homeTeam),away=same(t,m.awayTeam);if(!home&&!away)return 0;let fs=Number(home?m.homeScore:m.awayScore),as=Number(home?m.awayScore:m.homeScore);if(!Number.isFinite(fs)||!Number.isFinite(as))return 0;if(fs>as)return 3;if(fs<as)return 0;let kw=knockoutWinner(m);if(kw&&same(t,kw))return 3;if(kw)return 0;return 1}})}
function groupName(g,w){try{return (w.gname&&w.gname(g.group))||((g.friends||[]).join(', '))||g.group}catch(e){return ((g.friends||[]).join(', '))||g.group}}
function getGroups(w){try{return (Array.isArray(w.groups)&&w.groups.length?w.groups:w.DEFAULT_GROUPS)||[]}catch(e){return[]}}
function getFilter(d){let f=d.getElementById('friend')?.value||'all';let q=norm(d.getElementById('search')?.value||'');return{f,q}}
function css(d){if(d.getElementById('categorizedRosterStatusCss'))return;let s=d.createElement('style');s.id='categorizedRosterStatusCss';s.textContent=`#groups .statusRosterGroup{background:#fff;border:1px solid #e1f1e6;border-radius:18px;padding:12px;margin:10px 0;box-shadow:0 4px 10px #0001}#groups .statusRosterHead{font-weight:1000;color:#073b4c;margin-bottom:8px}#groups .statusRosterMeta{font-size:12px;color:#667085;margin-bottom:10px}#groups .statusCategoryTitle{font-size:12px;font-weight:1000;text-transform:uppercase;letter-spacing:.02em;margin:12px 0 7px;color:#073b4c}#groups .statusTeamGrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(165px,1fr));gap:8px}#groups .statusTeamTile{border-radius:14px;padding:10px;border:1px solid #e1f1e6;font-weight:950;background:white;line-height:1.2;animation:none!important;transition:none!important}.statusBadge{display:inline-block;margin-top:6px;border-radius:999px;padding:6px 9px;font-size:11px;font-weight:1000}#groups .statusCategoryTitle.eliminatedTitle{color:#b42318!important;background:#fff7f7!important;border:1px solid #fecaca!important;border-radius:10px!important;padding:7px 9px!important;display:inline-block!important}#groups .statusTeamTile.eliminated{background:#fff7f7!important;border:1px solid #fecaca!important;color:#b42318!important;opacity:1!important;box-shadow:none!important;text-shadow:none!important}#groups .statusTeamTile.eliminated *{color:#b42318!important;box-shadow:none!important;text-shadow:none!important}.statusBadge.eliminatedStatus,#groups .statusTeamTile.eliminated .statusBadge{background:#fee2e2!important;color:#b42318!important;border:1px solid #fecaca!important;box-shadow:none!important;font-weight:1000!important}.rosterTeam.forcedEliminated{background:#fff!important;border:1px solid #d7f3df!important;border-radius:16px!important;color:inherit!important;box-shadow:none!important;animation:none!important;transition:none!important}.rosterTeam.forcedEliminated .rosterTeamName{color:#073b4c!important;font-weight:1000!important}.rosterTeam.forcedEliminated .rosterRecord{color:#475467!important}.rosterTeam.forcedEliminated .rosterScore{background:#fff3cd!important;color:#7a4a00!important}.rosterTeam.forcedEliminated .rosterStatus{background:#ffe8ef!important;color:#b42318!important;border:0!important;font-weight:1000!important}.rosterTeam.forcedEliminated .pointStatus,.rosterTeam.forcedEliminated .pointRecord,.rosterTeam.forcedEliminated .pointScore{color:#b42318!important}`;d.head.appendChild(s)}
function tile(t,w){let st=status(t,w);let pts=fifaPoints(t,w);let inline=st[1]==='eliminated'?' style="background:#fff7f7!important;border:1px solid #fecaca!important;color:#b42318!important;box-shadow:none!important"':'';return `<div class="statusTeamTile ${st[1]}"${inline}><div>${t}</div><div style="font-size:12px;font-weight:900;margin-top:4px;opacity:.85">${pts} pts</div><span class="statusBadge ${st[2]}">${st[0]}</span></div>`}
function category(title,cls,teams,w){if(!teams.length)return'';return `<div class="statusCategoryTitle ${cls}Title">${title}</div><div class="statusTeamGrid">${teams.map(t=>tile(t,w)).join('')}</div>`}
function buildHtml(d,w){let {f,q}=getFilter(d);let groups=getGroups(w).filter(g=>f==='all'||g.group===f);return groups.map(g=>{let teams=(g.teams||[]).filter(t=>!q||norm(t).includes(q));if(!teams.length)return'';let champions=teams.filter(t=>status(t,w)[1]==='champion');let alive=teams.filter(t=>status(t,w)[1]==='alive');let eliminated=teams.filter(t=>status(t,w)[1]==='eliminated');let totalPts=teams.reduce((sum,t)=>sum+fifaPoints(t,w),0);return `<div class="statusRosterGroup"><div class="statusRosterHead">${g.group} — ${groupName(g,w)}</div><div class="statusRosterMeta">FIFA scoring: Win 3 • Draw 1 • Loss 0 • Knockout winner/advancing team = win &nbsp; | &nbsp; Total: ${totalPts} pts &nbsp; | &nbsp; ✅ Still Alive: ${alive.length} &nbsp; ❌ Eliminated: ${eliminated.length}${champions.length?` &nbsp; 🏆 Champion: ${champions.length}`:''}</div>${category('🏆 Champion','champion',champions,w)}${category('✅ Still Alive','alive',alive,w)}${category('❌ Eliminated','eliminated',eliminated,w)}</div>`}).join('')||'<div class="empty">No roster teams match this filter.</div>'}
function markEliminatedCards(){const {d}=docs();if(!d)return;css(d);[...d.querySelectorAll('#groups .rosterTeam')].forEach(card=>{let txt=card.textContent||'';let isElim=/eliminated/i.test(txt)||ELIMINATED.some(t=>same(t,txt));if(isElim){card.classList.add('forcedEliminated');card.classList.remove('pointTeam');card.querySelectorAll('.pointStatus,.pointRecord,.pointScore').forEach(x=>x.classList.remove('pointStatus','pointRecord','pointScore'));let badge=card.querySelector('.rosterStatus');if(badge){badge.textContent='❌ Eliminated';badge.classList.add('eliminatedStatus')}}})}
function render(force=false){patchFifaScoring();const {d,w}=docs();if(!d||!w)return;css(d);let holder=d.getElementById('groups');if(holder){let {f,q}=getFilter(d);let scoreKey=(w.matches||[]).map(m=>[m.homeTeam,m.awayTeam,m.homeScore,m.awayScore,m.homePenaltyScore,m.awayPenaltyScore,m.winnerTeam,m.state,m.status].join(':')).join('|');let key=f+'|'+q+'|'+finalChampion(w)+'|fifaKO|'+scoreKey;let html=buildHtml(d,w);if(force||key!==lastFilterKey||html!==lastRosterHtml){lastFilterKey=key;lastRosterHtml=html;holder.innerHTML=html}}markEliminatedCards();try{frame.style.height=d.documentElement.scrollHeight+'px'}catch(e){}}
function statePriorityFromText(txt){let n=norm(txt);if(/live|playing|in progress|halftime|half time|\bin\b/.test(n))return 0;if(/upcoming|scheduled|not started|pre|tbd/.test(n))return 1;if(/complete|completed|final|finished|full time|\bft\b|post/.test(n))return 2;return 3}
function statePriorityFromMatch(m){let n=norm((m&&m.state)||m&&m.status);if(['in','live','playing'].includes(n))return 0;if(['pre','upcoming','scheduled'].includes(n))return 1;if(['post','complete','completed','final','finished','ft'].includes(n))return 2;return statePriorityFromText(n)}
function patchScheduleSource(){const {wrapWin}=allDocs();if(!wrapWin||wrapWin.__liveScheduleSortPatched)return;wrapWin.__liveScheduleSortPatched=true;wrapWin.scheduleRows=function(d,w){return (w.matches||[]).slice().filter(m=>{try{return wrapWin.matchAllowedByFilters?wrapWin.matchAllowedByFilters(d,w,m):true}catch(e){return true}}).sort((a,b)=>{let pa=statePriorityFromMatch(a),pb=statePriorityFromMatch(b);if(pa!==pb)return pa-pb;let da=new Date(a.date).getTime()||0,db=new Date(b.date).getTime()||0;return pa===2?db-da:da-db})}}
function sortScheduleDom(){const {d}=docs();if(!d)return;let bodies=[...d.querySelectorAll('tbody')];let rows=[];bodies.forEach(tb=>rows.push(...tb.querySelectorAll('tr')));if(!rows.length){let h=[...d.querySelectorAll('h2,h3')].find(x=>/world cup 2026 schedule|schedule.*results/i.test(x.textContent||''));let box=h&&(h.closest('.wide')||h.parentElement);if(box)rows=[...box.querySelectorAll('tr,.wcMatch,.scheduleRow,.matchRow')]}if(rows.length<2)return;rows.forEach((r,i)=>{if(!r.dataset.originalOrder)r.dataset.originalOrder=String(i).padStart(5,'0')});let sorted=rows.slice().sort((a,b)=>{let pa=statePriorityFromText(a.textContent||''),pb=statePriorityFromText(b.textContent||'');if(pa!==pb)return pa-pb;return Number(a.dataset.originalOrder)-Number(b.dataset.originalOrder)});let changed=sorted.some((r,i)=>r!==rows[i]);if(changed){let parent=rows[0].parentElement;sorted.forEach(r=>parent.appendChild(r))}}
function applyScheduleSort(){patchFifaScoring();patchScheduleSource();setTimeout(sortScheduleDom,80)}
function installWatch(){const {d}=docs();if(!d||d.__rosterStatusNoBlink)return;['friend','search'].forEach(id=>{let el=d.getElementById(id);if(el){el.addEventListener('change',()=>{render(true);setTimeout(applyScheduleSort,50)});el.addEventListener('input',()=>{render(true);setTimeout(applyScheduleSort,50)});}});['sStatus','sFriend','sSearch','sTz','status','tz'].forEach(id=>{let el=d.getElementById(id);if(el){el.addEventListener('change',()=>setTimeout(applyScheduleSort,80));el.addEventListener('input',()=>setTimeout(applyScheduleSort,80));}});d.__rosterStatusNoBlink=true;}
function installNoBlinkObserver(){const {d}=docs();if(!d||d.__friendRosterNoBlinkObserver)return;let holder=d.getElementById('groups');if(holder&&window.MutationObserver){let pending=false;let obs=new MutationObserver(()=>{if(pending)return;pending=true;setTimeout(()=>{pending=false;markEliminatedCards();sortScheduleDom()},120)});obs.observe(holder,{childList:true,subtree:true});d.__friendRosterNoBlinkObserver=true}}
frame.addEventListener('load',()=>{setTimeout(()=>{installWatch();render(true);applyScheduleSort();installNoBlinkObserver()},1200)});
</script></body></html>
