<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>World Cup Mobile Roster Tracker</title><style>html,body{margin:0;width:100%;height:100%;background:#0f7b3f;overflow:auto}iframe{border:0;width:100%;min-height:100vh;display:block}</style></head><body><iframe id="tracker" src="appv15.html?roster=26&hideTop=1&v=60"></iframe><script>
const f=document.getElementById('tracker');let lastFilter={friend:'all',status:'all',search:''};let lastChangedId='';
const KO_START=new Date('2026-06-28T00:00:00-05:00').getTime();
const ALIVE=new Set(['canada','brazil','paraguay','morocco','norway','france','mexico','ecuador','england','dr congo','belgium','senegal','united states','bosnia','spain','austria','portugal','croatia','switzerland','algeria','australia','egypt','argentina','cape verde','colombia','ghana']);
const OUT=new Set(['south africa','japan','germany','netherlands','ivory coast','sweden','south korea','czechia','tunisia','curacao','qatar','new zealand','iran','uruguay','haiti','scotland','turkey','saudi arabia','iraq','jordan','uzbekistan','panama']);
const ALIASES={'usa':'united states','u s a':'united states','united states of america':'united states','bosnia and herzegovina':'bosnia','dr congo':'dr congo','congo':'dr congo','ivory coast':'ivory coast','cote d ivoire':'ivory coast','curacao':'curacao','curaçao':'curacao','turkiye':'turkey','türkiye':'turkey'};
const TEAM_CODES={usa:['united states','us','u s a','america'],mex:['mexico'],rsa:['south africa'],kor:['south korea','korea'],cze:['czechia','czech republic'],can:['canada'],bih:['bosnia and herzegovina','bosnia'],qat:['qatar'],sui:['switzerland'],bra:['brazil'],mar:['morocco'],hti:['haiti'],sco:['scotland'],aus:['australia'],tur:['turkey','turkiye'],par:['paraguay'],ger:['germany'],cuw:['curacao'],civ:['ivory coast','cote d ivoire'],ecu:['ecuador'],ned:['netherlands','holland'],jpn:['japan'],swe:['sweden'],tun:['tunisia'],bel:['belgium'],egy:['egypt'],iri:['iran'],nzl:['new zealand'],esp:['spain'],cpv:['cape verde'],ksa:['saudi arabia'],uru:['uruguay'],fra:['france'],sen:['senegal'],irq:['iraq'],nor:['norway'],arg:['argentina'],dza:['algeria'],aut:['austria'],jor:['jordan'],por:['portugal'],cod:['dr congo','congo'],uzb:['uzbekistan'],col:['colombia'],eng:['england'],cro:['croatia'],gha:['ghana'],pan:['panama']};
function safeDoc(){try{return{d:f.contentDocument,w:f.contentWindow}}catch(e){return{}}}
function cleanTeam(x){return String(x||'').replace('⚽','').trim()}function norm(x){return String(x||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/&/g,'and').replace(/[^a-z0-9 ]/g,' ').replace(/\s+/g,' ').trim()}
function canon(x){let n=norm(x);return ALIASES[n]||n}function sameTeam(a,b){return canon(a)===canon(b)}
function esc(x){return String(x||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function teamTokens(t){let n=norm(t),out=[n];Object.keys(TEAM_CODES).forEach(code=>{if(TEAM_CODES[code].some(a=>norm(a)===n))out.push(code,...TEAM_CODES[code].map(norm));});return [...new Set(out)]}
function teamMatches(q,t){let nq=norm(q);if(!nq)return true;return teamTokens(t).some(tok=>tok.includes(nq)||nq.includes(tok))}
function groupName(w,g){try{return w.gname(g.group||g)}catch(e){return (g.friends||[]).join(', ')||g.group||g}}
function getVal(d,a,b,def=''){const x=d.getElementById(a),y=d.getElementById(b);if(lastChangedId===a&&x)return x.value||def;if(lastChangedId===b&&y)return y.value||def;if(y&&y.value&&y.value!==def)return y.value;if(x&&x.value)return x.value;return def}
function syncPair(d,a,b,fromId){const x=d.getElementById(a),y=d.getElementById(b);if(!x||!y)return;let src=null;if(fromId===a)src=x;else if(fromId===b)src=y;else if(lastChangedId===a)src=x;else if(lastChangedId===b)src=y;if(!src)return;const dst=src===x?y:x;if(dst.value!==src.value)dst.value=src.value}
function syncControls(d,fromId){if(fromId)lastChangedId=fromId;syncPair(d,'search','sSearch',fromId);syncPair(d,'friend','sFriend',fromId);syncPair(d,'status','sStatus',fromId);syncPair(d,'tz','sTz',fromId)}
function setStatus(d,status){lastChangedId='sStatus';['status','sStatus'].forEach(id=>{const el=d.getElementById(id);if(el)el.value=status});setTimeout(()=>update('sStatus'),30)}
function setFriend(d,group){lastChangedId='sFriend';['friend','sFriend'].forEach(id=>{const el=d.getElementById(id);if(el)el.value=group});setTimeout(()=>update('sFriend'),30)}
function readFilters(d){syncControls(d);const friend=getVal(d,'friend','sFriend','all')||'all';const status=getVal(d,'status','sStatus','all')||'all';const search=getVal(d,'search','sSearch','')||'';lastFilter={friend,status,search};return lastFilter}
function filteredGroups(d,w){const flt=readFilters(d),search=flt.search;return (w.groups||[]).filter(g=>flt.friend==='all'||g.group===flt.friend).map(g=>({group:g.group,friends:g.friends||[],teams:(g.teams||[]).filter(t=>teamMatches(search,t))})).filter(g=>!norm(search)||g.teams.length)}
function friendTeamSet(w,g){if(!g||g==='all')return null;let x=(w.groups||[]).find(a=>a.group===g);return new Set(((x&&x.teams)||[]).map(norm))}
function roundText(m){return norm([m&&m.round,m&&m.stage,m&&m.phase,m&&m.roundName,m&&m.stageName,m&&m.name,m&&m.status].filter(Boolean).join(' '))}
function koRound(m){return /round of 32|round 32|r32|round of 16|round 16|r16|quarter|semi|final|third|3rd|knockout/.test(roundText(m))}
function koMatch(m){let t=new Date(m&&m.date).getTime()||0;return koRound(m)||(t&&t>=KO_START)}
function groupMatch(m){let t=new Date(m&&m.date).getTime()||0;return !!t&&t<KO_START&&!koRound(m)}
function isDone(m){let n=norm(m&&m.state),s=norm(m&&m.status);return !!(m&&(m.completed||n==='post'||['complete','completed','final','finished','ft'].includes(s)))}
function winnerName(m){if(!m)return'';if(m.winner)return m.winner;if(m.winnerTeam)return m.winnerTeam;let hs=Number(m.homeScore),as=Number(m.awayScore);if(!isNaN(hs)&&!isNaN(as)&&hs!==as)return hs>as?m.homeTeam:m.awayTeam;let hp=Number(m.homePenaltyScore||m.homePenalties||m.homePens),ap=Number(m.awayPenaltyScore||m.awayPenalties||m.awayPens);if(!isNaN(hp)&&!isNaN(ap)&&hp!==ap)return hp>ap?m.homeTeam:m.awayTeam;return''}
function groupRec(w,t){let r={w:0,d:0,l:0,played:0,points:0,gf:0,ga:0,gd:0};try{(w.matches||[]).forEach(m=>{if(!groupMatch(m)||!isDone(m))return;let H=sameTeam(m.homeTeam,t),A=sameTeam(m.awayTeam,t);if(!H&&!A)return;let hs=Number(m.homeScore)||0,as=Number(m.awayScore)||0,gf=H?hs:as,ga=H?as:hs;r.gf+=gf;r.ga+=ga;if(gf>ga)r.w++;else if(gf===ga)r.d++;else r.l++});r.played=r.w+r.d+r.l;r.points=r.w*3+r.d;r.gd=r.gf-r.ga}catch(e){}return r}
function noBonusRecord(w,t){return groupRec(w,t)}function noBonusScore(w,t){return groupRec(w,t).points||0}
function teamStatus(w,t){let n=canon(t);try{let ms=(w.matches||[]).filter(m=>koMatch(m)&&(sameTeam(m.homeTeam,t)||sameTeam(m.awayTeam,t))).sort((a,b)=>new Date(a.date)-new Date(b.date));let lost=false,alive=false;if(ms.length){ms.forEach(m=>{if(isDone(m)){let win=winnerName(m);if(win&&canon(win)===n)alive=true;else if(win)lost=true}else alive=true});if(lost)return'eliminated';if(alive)return'alive'}}catch(e){}if(OUT.has(n))return'eliminated';if(ALIVE.has(n))return'alive';return isKnockoutMode(w)?'eliminated':'alive'}
function friendCounts(w,g){let c={alive:0,eliminated:0,total:0,groupPts:0};((w.groups||[]).find(x=>x.group===g)||{teams:[]}).teams.forEach(t=>{let s=teamStatus(w,t);c.total++;c.groupPts+=noBonusScore(w,t);if(s==='alive')c.alive++;else c.eliminated++});return c}
function noBonusGroupScores(w,gs){let sc={};(gs||[]).forEach(g=>{let c=friendCounts(w,g.group);sc[g.group]={points:c.groupPts,alive:c.alive,eliminated:c.eliminated,total:c.total}});return sc}
function isKnockoutMode(w){return Date.now()>=KO_START||(w.matches||[]).some(m=>koMatch(m)&&(['in','live','playing'].includes(norm(m.state||m.status))||isDone(m)))}
function updateHeroText(d){const hero=d.querySelector('.hero');if(!hero)return;let box=hero.querySelector('div');let ps=[...hero.querySelectorAll('p')];while(ps.length<4){let p=d.createElement('p');box&&box.appendChild(p);ps.push(p)}ps[0].innerHTML='<b>Sports tracker:</b> current leader, teams by friend group, teams playing next, risk watch teams, live scores, and schedule filters.';ps[1].innerHTML='<b>Group-stage scoring:</b> Win = 3 points • Draw = 1 point • Loss = 0 points.';ps[2].textContent='After the group stage, points are no longer used. Teams advancing to the next bracket start with a clean slate.';ps[3].textContent='Elimination phase: every match is win-or-elimination.';[...hero.querySelectorAll('p')].forEach(p=>{if(/bonus|champion|round of 32 bonus/i.test(p.textContent||'')){p.textContent='Group-stage scoring only: win = 3, draw = 1, loss = 0.'}})}
function isLive(m){return ['in','live','playing'].includes(norm(m&&m.state))||['in','live','playing'].includes(norm(m&&m.status))}
function matchAllowedByFilters(d,w,m){const flt=readFilters(d),set=friendTeamSet(w,flt.friend),search=flt.search;if(!statusMatches(flt.status,m.state))return false;if(set&&!(set.has(norm(m.homeTeam))||set.has(norm(m.awayTeam))))return false;if(norm(search)&&!(teamMatches(search,m.homeTeam)||teamMatches(search,m.awayTeam)))return false;return true}
function statusMatches(s,state){if(!s||s==='all')return true;let n=norm(s);if(['post','complete','completed','final','finished'].includes(n))return state==='post';if(['pre','upcoming','scheduled'].includes(n))return state==='pre';if(['in','live'].includes(n))return state==='in'||state==='live';return s===state}
function fmtTime(d,w,date){try{const tz=(d.getElementById('sTz')||d.getElementById('tz')||{}).value||Intl.DateTimeFormat().resolvedOptions().timeZone;return new Intl.DateTimeFormat('en-US',{weekday:'short',month:'short',day:'numeric',hour:'numeric',minute:'2-digit',timeZone:tz,timeZoneName:'short'}).format(new Date(date))}catch(e){return new Date(date).toLocaleString()}}
function statusText(m){return isLive(m)?'LIVE':m.state==='post'?'COMPLETE':'UPCOMING'}function scoreText(m){if(m.state==='pre')return `${m.homeTeam} 0 - 0 ${m.awayTeam}`;let win=winnerName(m);return `${m.homeTeam} ${m.homeScore} - ${m.awayScore} ${m.awayTeam}${win?'<div class="wcWinner">Winner: '+win+'</div>':''}`}function matchPts(){return 0}
function removeSections(d){if(!d)return;d.querySelectorAll('.top,.scorebar').forEach(el=>el.remove());d.querySelectorAll('#chart,#pointTeams').forEach(el=>{let box=el.closest('.grid>div')||el.closest('.wide')||el.closest('div');box?box.remove():el.remove()});[...d.querySelectorAll('h1,h2,h3')].forEach(el=>{let txt=(el.textContent||'').toLowerCase();if(txt.includes('winning teams by group')||txt.includes('teams creating points')){let box=el.closest('.grid>div')||el.closest('.wide')||el.closest('div')||el;box.remove()}})}
function ensureLeaderboardHeader(d){const board=d.getElementById('leaderboard');if(!board)return;const sec=board.closest('.grid>div')||board.parentElement;if(sec&&!sec.querySelector('.leaderNote')){let note=d.createElement('div');note.className='leaderNote';note.innerHTML='🏆 Tap a friend group to filter the roster and schedule.';const h=sec.querySelector('h2');h&&h.insertAdjacentElement('afterend',note)}}
function renderLeaderboard(d,w){const board=d.getElementById('leaderboard');if(!board)return;ensureLeaderboardHeader(d);const gs=filteredGroups(d,w),rows=gs.map(g=>[g.group,friendCounts(w,g.group)]).sort((a,b)=>b[1].alive-a[1].alive||b[1].groupPts-a[1].groupPts),q=lastFilter.search||'';if((q||lastFilter.friend!=='all')&&!rows.length){board.innerHTML='<div class="empty">No teams found for this filter.</div>';return}const max=Math.max(1,...rows.map(r=>r[1].total));board.innerHTML='<div class="leaderCards">'+rows.map((r,i)=>{let medal=i===0?'🥇':i===1?'🥈':i===2?'🥉':'⚽';let pct=Math.min(100,r[1].alive/max*100);return `<button class="leaderCard ${i===0?'first':''}" data-group="${esc(r[0])}"><div class="leaderTop"><span class="medal">${medal}</span><span class="leaderName">${esc(groupName(w,r[0]))}</span><span class="leaderPts">${r[1].alive} alive</span></div><div class="leaderMeta">${r[1].alive} teams left • ${r[1].eliminated} eliminated • Group-stage total: ${r[1].groupPts} pts</div><div class="leaderBar"><span style="width:${pct}%"></span></div><div class="leaderTap">Tap to filter this group</div></button>`}).join('')+'</div>';board.querySelectorAll('.leaderCard').forEach(btn=>btn.onclick=()=>{setFriend(d,btn.dataset.group);const sched=d.getElementById('schedule');if(sched)sched.scrollIntoView({behavior:'smooth',block:'start'})})}
function renderRoster(d,w){const holder=d.getElementById('groups');if(!holder)return;const gs=filteredGroups(d,w);holder.innerHTML=gs.map(g=>{const teams=(g.teams||[]).map(t=>{let total=noBonusScore(w,t),s=teamStatus(w,t),out=s==='eliminated',bg=out?'#fff1f4':'#dcfce7',fg=out?'#b42318':'#087443',bd=out?'#fecdd3':'#86efac',recText=out?`Group stage: ${total} pts • Eliminated`:`Group stage: ${total} pts • Still alive`,status=out?'Eliminated':'Still Alive';return `<div class="rosterTeam"><div class="rosterTop"><div><div class="rosterTeamName">⚽ ${esc(t)}</div><div class="rosterRecord" style="color:${fg};font-weight:900">${esc(recText)}</div></div><div class="rosterScore" style="background:${bg};color:${fg};border:1px solid ${bd}">${total} pts</div></div><span class="rosterStatus ${out?'out':'alive'}" style="background:${bg};color:${fg};border:1px solid ${bd}">${status}</span></div>`}).join('');return `<div class="rosterGroup"><div class="rosterHead"><b>${esc(groupName(w,g))}</b><div class="rosterMeta">${esc((g.friends||[]).join(' • '))} • ${(g.teams||[]).length} matching country team${(g.teams||[]).length===1?'':'s'}</div></div><div class="rosterTeams">${teams}</div></div>`}).join('')||'<div class="empty">No roster teams match this filter.</div>'}
function scheduleRows(d,w){return (w.matches||[]).slice().filter(m=>matchAllowedByFilters(d,w,m)).sort((a,b)=>{let pa=isLive(a)?0:a.state==='pre'?1:2,pb=isLive(b)?0:b.state==='pre'?1:2;if(pa!==pb)return pa-pb;let da=new Date(a.date)-new Date(b.date);return pa===2?-da:da})}
function ensureScheduleTools(d,w){const sched=d.getElementById('schedule');if(!sched)return;if(!sched.querySelector('.scheduleTools')){let tools=d.createElement('div');tools.className='scheduleTools';tools.innerHTML='<button data-st="all">🌎 All</button><button data-st="in">🔴 Live</button><button data-st="pre">⏳ Upcoming</button><button data-st="post">✅ Complete</button><div class="scheduleHint">Filter by team search, friend group, or match status.</div>';let h=sched.querySelector('h2');h&&h.insertAdjacentElement('afterend',tools);tools.querySelectorAll('button').forEach(b=>b.onclick=()=>setStatus(d,b.dataset.st))}let active=(d.getElementById('sStatus')||d.getElementById('status')||{}).value||'all';sched.querySelectorAll('.scheduleTools button').forEach(b=>b.classList.toggle('active',b.dataset.st===active))}
function impactHtml(w,m,gs){let out=[];[m.homeTeam,m.awayTeam].forEach(t=>{let gr=[];try{gr=w.picked(t,gs)}catch(e){}gr.forEach(g=>out.push({g,team:t,st:teamStatus(w,t)}))});return out.length?out.map(x=>`<span class="impactPill ${x.st==='eliminated'?'zero':''}">${esc(w.gname?w.gname(x.g):x.g)}: ${esc(x.team)} • ${x.st==='eliminated'?'Eliminated':'Still Alive'}</span>`).join(''):'<span class="wcSmall">No friend impact</span>'}
function liveFriendGroupHtml(w,m,gs){let out=[];[m.homeTeam,m.awayTeam].forEach(t=>{let gr=[];try{gr=w.picked(t,gs)}catch(e){}gr.forEach(g=>out.push(`<span class="liveFriendPill">${esc(w.gname?w.gname(g):g)} • ${esc(t)}</span>`))});return out.length?`<div class="liveFriendGroups"><b>Friend group tied to this live game:</b>${out.join('')}</div>`:'<div class="wcSmall">No friend group tied to this live game</div>'}
function selectedGroups(w){return lastFilter.friend&&lastFilter.friend!=='all'?(w.groups||[]).filter(g=>g.group===lastFilter.friend):(w.groups||[])}
function renderSchedule(d,w){const tb=d.getElementById('tbody');if(!tb||!w.matches)return;ensureScheduleTools(d,w);const rows=scheduleRows(d,w),gs=selectedGroups(w);tb.innerHTML=rows.length?rows.map(m=>`<tr class="matchRow ${m.state}"><td><div class="wcDate">${fmtTime(d,w,m.date)}</div></td><td><div class="wcMatch">${esc(m.homeTeam)} vs ${esc(m.awayTeam)}</div></td><td><div class="wcScore">${scoreText(m)}</div></td><td><div class="wcStatus">${statusText(m)}</div><div class="wcSmall">${m.state==='post'?'Completed':isLive(m)?'Live now':'Upcoming'}</div></td><td>${impactHtml(w,m,gs)}</td><td><div class="wcVenue">${esc(m.venue||'')}</div></td></tr>`).join(''):`<tr><td colspan="6"><div class="emptySchedule">No schedule matches found for the selected filters.</div></td></tr>`;const sched=d.getElementById('schedule');if(sched&&!sched.querySelector('.filterNote')){let note=d.createElement('div');note.className='muted filterNote';note.textContent='Schedule follows your Friend Group, Match Status, and Team Search filters.';let h=sched.querySelector('h2');h&&h.insertAdjacentElement('afterend',note)}}
function renderCurrent(d,w){const cur=d.getElementById('current');if(!cur||!w.matches)return;const gs=selectedGroups(w),rows=(w.matches||[]).filter(m=>matchAllowedByFilters(d,w,m)&&isLive(m)).sort((a,b)=>new Date(b.date)-new Date(a.date)).slice(0,4);cur.innerHTML=rows.length?rows.map(m=>`<div class="currentCard liveOnly"><b>🔴 LIVE NOW • ${esc(m.homeTeam)} vs ${esc(m.awayTeam)}</b><div class="wcScore currentLiveScore">${scoreText(m)}</div><div class="wcSmall">Current live score • ${fmtTime(d,w,m.date)}</div>${liveFriendGroupHtml(w,m,gs)}</div>`).join(''):'<div class="empty noLiveNow">no current match</div>'}
