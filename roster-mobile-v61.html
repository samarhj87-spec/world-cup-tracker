<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>World Cup Mobile Roster Tracker</title><link rel="preload" href="roster-mobile-v26.html?v=60" as="document"><style>html,body{margin:0;width:100%;height:100%;background:#0f7b3f;overflow:auto}iframe{border:0;width:100%;min-height:100vh;display:block}</style></head><body><iframe id="tracker" loading="eager" fetchpriority="high" src="roster-mobile-v26.html?v=60"></iframe><script>
const frame=document.getElementById('tracker');let lastRefresh=0,syncing=false;
function getDocs(){try{const wrap=frame.contentDocument,wrapWin=frame.contentWindow;const appFrame=wrap&&wrap.getElementById('tracker');const app=appFrame&&appFrame.contentDocument;const appWin=appFrame&&appFrame.contentWindow;return{wrap,wrapWin,app,appWin}}catch(e){return{}}}
function fire(el,type){try{el.dispatchEvent(new Event(type,{bubbles:true}))}catch(e){}}
function norm(x){return String(x||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/&/g,'and').replace(/[^a-z0-9 ]/g,' ').replace(/\s+/g,' ').trim()}
const TEAM_CODES={usa:['united states','us','u s a','america'],mex:['mexico'],rsa:['south africa'],kor:['south korea','korea'],cze:['czechia','czech republic'],can:['canada'],bih:['bosnia and herzegovina','bosnia herzegovina','bosnia'],qat:['qatar'],sui:['switzerland'],bra:['brazil'],mar:['morocco'],hti:['haiti'],sco:['scotland'],aus:['australia'],tur:['turkey','turkiye'],par:['paraguay'],ger:['germany'],cuw:['curacao'],civ:['ivory coast','cote d ivoire'],ecu:['ecuador'],ned:['netherlands','holland'],jpn:['japan'],swe:['sweden'],tun:['tunisia'],bel:['belgium'],egy:['egypt'],iri:['iran'],nzl:['new zealand'],esp:['spain'],cpv:['cape verde'],ksa:['saudi arabia'],uru:['uruguay'],fra:['france'],sen:['senegal'],irq:['iraq'],nor:['norway'],arg:['argentina'],dza:['algeria'],aut:['austria'],jor:['jordan'],por:['portugal'],cod:['dr congo','congo'],uzb:['uzbekistan'],col:['colombia'],eng:['england'],cro:['croatia'],gha:['ghana'],pan:['panama']};
function teamTokens(t){let n=norm(t),out=[n];Object.keys(TEAM_CODES).forEach(code=>{if(TEAM_CODES[code].some(a=>norm(a)===n))out.push(code,...TEAM_CODES[code].map(norm));});return [...new Set(out)]}
function teamMatches(q,t){let nq=norm(q);if(!nq)return true;return teamTokens(t).some(tok=>tok.includes(nq)||nq.includes(tok))}
function sameTeam(a,b){return teamTokens(a).some(x=>teamTokens(b).includes(x))}
function displayTeam(t){return sameTeam(t,'Bosnia-Herzegovina')?'Bosnia-Herzegovina':t}
function normalizeBosniaData(){const {appWin}=getDocs();if(!appWin)return;try{['DEFAULT_GROUPS','groups'].forEach(key=>{if(Array.isArray(appWin[key]))appWin[key].forEach(g=>{if(Array.isArray(g.teams))g.teams=g.teams.map(displayTeam)})});if(Array.isArray(appWin.matches))appWin.matches.forEach(m=>{if(m.homeTeam)m.homeTeam=displayTeam(m.homeTeam);if(m.awayTeam)m.awayTeam=displayTeam(m.awayTeam)});if(Array.isArray(appWin.groups))appWin.localStorage.wcFriendGroups_v15=JSON.stringify(appWin.groups)}catch(e){}}
function forceBosniaText(root){if(!root)return;try{const walker=root.createTreeWalker(root.body||root,NodeFilter.SHOW_TEXT);let n;while(n=walker.nextNode()){let v=n.nodeValue||'',nv=v.replace(/\bBosnia(?:\s+and\s+Herzegovina|-Herzegovina)?\b/gi,'Bosnia-Herzegovina');if(nv!==v)n.nodeValue=nv}}catch(e){}try{root.querySelectorAll('*').forEach(el=>['title','aria-label','value'].forEach(a=>{let v=el.getAttribute&&el.getAttribute(a);if(v&&/\bBosnia(?:\s+and\s+Herzegovina|-Herzegovina)?\b/i.test(v))el.setAttribute(a,v.replace(/\bBosnia(?:\s+and\s+Herzegovina|-Herzegovina)?\b/gi,'Bosnia-Herzegovina'))}))}catch(e){}}
function pairValue(app,a,b,from){const x=app.getElementById(a),y=app.getElementById(b);if(!x||!y)return;const src=(from===a)?x:(from===b)?y:(app.activeElement===y?y:x);const val=src.value;if(x.value!==val)x.value=val;if(y.value!==val)y.value=val;}
function sync(app,from){if(syncing)return;syncing=true;pairValue(app,'search','sSearch',from);pairValue(app,'friend','sFriend',from);pairValue(app,'status','sStatus',from);pairValue(app,'tz','sTz',from);syncing=false;}
function desiredNames(){return ['Hugh','Evie','Ollie','Sharon']}
function updateFriendNames(){const {app,appWin}=getDocs();const next=desiredNames();if(appWin){try{if(Array.isArray(appWin.DEFAULT_GROUPS)){appWin.DEFAULT_GROUPS.forEach(g=>{if(g.group==='Group 1')g.friends=next.slice()})}}catch(e){}try{if(Array.isArray(appWin.groups)){appWin.groups.forEach(g=>{const names=(g.friends||[]).map(norm).join('|');if(g.group==='Group 1'||(/hugh/.test(names)&&/ollie/.test(names)&&/sharon/.test(names))){g.friends=next.slice()}});appWin.localStorage.wcFriendGroups_v15=JSON.stringify(appWin.groups)}}catch(e){}}if(app){const newComma='Hugh, Evie, Ollie, Sharon',newBullet='Hugh • Evie • Ollie • Sharon';app.querySelectorAll('option,.leaderName,.rosterHead b,.rosterMeta,.liveFriendPill,.impactPill').forEach(el=>{let t=el.textContent||'';t=t.replace(/Hugh\s*,\s*Ollie\s*,\s*Sharon\s*(?:,|&|and)?\s*Barry/gi,newComma).replace(/Hugh\s*•\s*Ollie\s*•\s*Sharon\s*•\s*Barry/gi,newBullet).replace(/Hugh\s*,\s*Ollie\s*,\s*Sharon/gi,newComma);if(el.textContent!==t)el.textContent=t;});}}
function updateTeamNames(){normalizeBosniaData();const {app}=getDocs();forceBosniaText(app)}
function observeTeamNames(){const {app}=getDocs();if(!app||app.__bosniaObserver)return;try{const ob=new MutationObserver(()=>forceBosniaText(app));ob.observe(app.body,{childList:true,subtree:true,characterData:true});app.__bosniaObserver=ob}catch(e){}}
function isLiveMatch(m){return ['in','live','playing'].includes(norm(m&&m.state))||['in','live','playing'].includes(norm(m&&m.status))}
function isPlayed(m){let s=norm((m&&m.state)||'');return ['post','complete','completed','final','finished'].includes(s)||(!['pre','upcoming','scheduled'].includes(s)&&m&&m.homeScore!=null&&m.awayScore!=null&&!isNaN(Number(m.homeScore))&&!isNaN(Number(m.awayScore)))}
function schedulePriority(m){if(isLiveMatch(m))return 0;let s=norm((m&&m.state)||'');if(['pre','upcoming','scheduled'].includes(s))return 1;if(isPlayed(m))return 2;return 3}
function teamRecord(w,t){let r={w:0,d:0,l:0};try{(w.matches||[]).forEach(m=>{if(!isPlayed(m))return;let isHome=sameTeam(t,m.homeTeam),isAway=sameTeam(t,m.awayTeam);if(!isHome&&!isAway)return;let hs=Number(m.homeScore||0),as=Number(m.awayScore||0);if(hs===as)r.d++;else if((isHome&&hs>as)||(isAway&&as>hs))r.w++;else r.l++;})}catch(e){}return r}
function patchTeamResults(){const {appWin}=getDocs();if(!appWin)return;appWin.rec=function(t){return teamRecord(appWin,t)};appWin.status=function(t){let r=teamRecord(appWin,t),played=r.w+r.d+r.l;let live=(appWin.matches||[]).some(m=>isLiveMatch(m)&&(sameTeam(t,m.homeTeam)||sameTeam(t,m.awayTeam)));if(live)return{cls:'live',txt:'🔥 Playing now'};if(played)return{cls:'status-final',txt:`✅ Played • ${r.w}W-${r.d}D-${r.l}L`};return{cls:'status-pre',txt:'⏳ Has not played yet'};};}
function patchScheduleOrder(){const {wrapWin}=getDocs();if(!wrapWin)return;wrapWin.scheduleRows=function(d,w){normalizeBosniaData();return (w.matches||[]).slice().filter(m=>{try{return wrapWin.matchAllowedByFilters?wrapWin.matchAllowedByFilters(d,w,m):true}catch(e){return true}}).sort((a,b)=>{let pa=schedulePriority(a),pb=schedulePriority(b);if(pa!==pb)return pa-pb;let da=new Date(a.date).getTime()||0,db=new Date(b.date).getTime()||0;return pa===2?db-da:da-db})};}
function patchScoreText(){const {wrapWin}=getDocs();if(!wrapWin)return;wrapWin.scoreText=function(m){if(m.homeTeam)m.homeTeam=displayTeam(m.homeTeam);if(m.awayTeam)m.awayTeam=displayTeam(m.awayTeam);if(m.state==='pre')return `${m.homeTeam} 0 - 0 ${m.awayTeam}`;let lead='';if(Number(m.homeScore)>Number(m.awayScore))lead=m.homeTeam;if(Number(m.awayScore)>Number(m.homeScore))lead=m.awayTeam;let label=isLiveMatch(m)?'Winning':'Winner';return `${m.homeTeam} ${m.homeScore} - ${m.awayScore} ${m.awayTeam}${lead?'<div class="wcWinner">'+label+': '+lead+'</div>':''}`};}
function applyFilters(from){const {wrapWin,app,appWin}=getDocs();if(!app)return false;observeTeamNames();updateFriendNames();updateTeamNames();sync(app,from);patchTeamResults();patchScoreText();patchScheduleOrder();try{if(appWin&&typeof appWin.refresh==='function'&&Date.now()-lastRefresh>900){lastRefresh=Date.now();appWin.refresh()}}catch(e){}try{if(wrapWin&&typeof wrapWin.update==='function')wrapWin.update(from)}catch(e){}setTimeout(()=>{updateFriendNames();updateTeamNames()},20);resize();return true;}
function install(){const {app}=getDocs();if(!app)return false;if(app.__filterStableV76)return true;['search','sSearch','friend','sFriend','status','sStatus','tz','sTz'].forEach(id=>{const el=app.getElementById(id);if(!el)return;el.addEventListener('input',()=>setTimeout(()=>applyFilters(id),10),true);el.addEventListener('change',()=>setTimeout(()=>applyFilters(id),10),true);});app.__filterStableV76=true;return true;}
function resize(){try{const wrap=frame.contentDocument;frame.style.height=Math.max(wrap.documentElement.scrollHeight,window.innerHeight)+'px'}catch(e){}}
function fastStart(){install();observeTeamNames();updateFriendNames();updateTeamNames();patchTeamResults();patchScoreText();patchScheduleOrder();applyFilters();resize()}
frame.addEventListener('load',()=>{const boot=setInterval(fastStart,75);setTimeout(()=>clearInterval(boot),5000);setTimeout(fastStart,25);setTimeout(fastStart,150);setTimeout(fastStart,500);setTimeout(fastStart,950);});
const immediate=setInterval(fastStart,100);setTimeout(()=>clearInterval(immediate),5000);
setInterval(fastStart,3000);
</script></body></html>
