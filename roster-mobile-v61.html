<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>World Cup Mobile Roster Tracker</title><style>html,body{margin:0;width:100%;height:100%;background:#0f7b3f;overflow:auto}iframe{border:0;width:100%;min-height:100vh;display:block}</style></head><body><iframe id="tracker" src="roster-mobile-v26.html?v=60"></iframe><script>
const frame=document.getElementById('tracker');
const KO_START=new Date('2026-06-28T00:00:00-05:00').getTime();
const ALIASES={'usa':'united states','u s a':'united states','united states of america':'united states','bosnia and herzegovina':'bosnia','dr congo':'dr congo','congo':'dr congo','ivory coast':'ivory coast','cote d ivoire':'ivory coast','curacao':'curacao','curaçao':'curacao','turkiye':'turkey','türkiye':'turkey'};
const FALLBACK_ALIVE=new Set(['canada','brazil','paraguay','morocco','norway','france','mexico','ecuador','england','dr congo','belgium','senegal','united states','bosnia','spain','austria','portugal','croatia','switzerland','algeria','australia','egypt','argentina','cape verde','colombia','ghana']);
const FALLBACK_ELIMINATED=new Set(['south africa','japan','germany','netherlands','ivory coast','sweden','south korea','czechia','tunisia','curacao','qatar','new zealand','iran','uruguay','haiti','scotland','turkey','saudi arabia','iraq','jordan','uzbekistan','panama']);
function norm(x){return String(x||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/&/g,'and').replace(/[^a-z0-9 ]/g,' ').replace(/\s+/g,' ').trim()}
function canon(x){let n=norm(x);return ALIASES[n]||n}
function sameTeam(a,b){return canon(a)===canon(b)}
function docs(){try{let d=frame.contentDocument,w=frame.contentWindow;for(let i=0;i<10;i++){let inner=d&&d.querySelector?d.querySelector('iframe'):null;if(!inner||!inner.contentDocument)break;d=inner.contentDocument;w=inner.contentWindow}return{d,w}}catch(e){return{}}}
function wrap(){try{return{d:frame.contentDocument,w:frame.contentWindow}}catch(e){return{}}}
function statePriorityFromText(txt){let n=norm(txt);if(/live|playing|in progress|halftime|half time|\bin\b/.test(n))return 0;if(/upcoming|scheduled|not started|pre|tbd/.test(n))return 1;if(/complete|completed|final|finished|full time|\bft\b|post/.test(n))return 2;return 3}
function statePriorityFromMatch(m){let n=norm((m&&m.state)||m&&m.status);if(['in','live','playing'].includes(n))return 0;if(['pre','upcoming','scheduled'].includes(n))return 1;if(['post','complete','completed','final','finished','ft'].includes(n))return 2;return statePriorityFromText(n)}
function matchRoundText(m){return norm([m&&m.round,m&&m.stage,m&&m.phase,m&&m.roundName,m&&m.stageName,m&&m.name,m&&m.status].filter(Boolean).join(' '))}
function isKnockoutRoundName(m){return /round of 32|round 32|r32|round of 16|round 16|r16|quarter|semi|final|third|3rd|knockout/.test(matchRoundText(m))}
function isKnockoutMatch(m){let t=new Date(m&&m.date).getTime()||0;return isKnockoutRoundName(m)||(t&&t>=KO_START)}
function isGroupStageMatch(m){let t=new Date(m&&m.date).getTime()||0;return !!t&&t<KO_START&&!isKnockoutRoundName(m)}
function isMatchDone(m){let n=norm(m&&m.state);return !!(m&&(m.completed||n==='post'||['complete','completed','final','finished','ft'].includes(norm(m.status))))}
function winnerName(m){if(!m)return'';if(m.winner)return m.winner;let hs=Number(m.homeScore),as=Number(m.awayScore);if(isNaN(hs)||isNaN(as)||hs===as)return'';return hs>as?m.homeTeam:m.awayTeam}
function groupStageRecord(win,team){let r={w:0,d:0,l:0,played:0,points:0,gf:0,ga:0,gd:0};try{(win.matches||[]).forEach(m=>{if(!isGroupStageMatch(m)||!isMatchDone(m))return;let H=sameTeam(m.homeTeam,team),A=sameTeam(m.awayTeam,team);if(!H&&!A)return;let hs=Number(m.homeScore)||0,as=Number(m.awayScore)||0,gf=H?hs:as,ga=H?as:hs;r.gf+=gf;r.ga+=ga;if(gf>ga)r.w++;else if(gf===ga)r.d++;else r.l++});r.played=r.w+r.d+r.l;r.points=r.w*3+r.d;r.gd=r.gf-r.ga}catch(e){}return r}
function groupStagePoints(win,team){return groupStageRecord(win,team).points||0}
function isKnockoutStage(w){try{if(Date.now()>=KO_START)return true;let ms=(w.matches||[]).filter(isKnockoutMatch);if(!ms.length)return false;return ms.some(m=>{let n=norm(m.state||m.status);let t=new Date(m.date).getTime()||0;return ['in','live','playing','post','complete','completed','final','finished','ft'].includes(n)||Date.now()>=t-2*60*60*1000})}catch(e){return Date.now()>=KO_START}}
function teamKnockoutStatus(win,team){let n=canon(team),w=win||docs().w;if(!n)return null;try{let ms=(w.matches||[]).filter(m=>isKnockoutMatch(m)&&(sameTeam(m.homeTeam,team)||sameTeam(m.awayTeam,team))).sort((a,b)=>new Date(a.date)-new Date(b.date));let lost=false,alive=false;if(ms.length){ms.forEach(m=>{if(isMatchDone(m)){let wn=winnerName(m);if(wn&&canon(wn)!==n)lost=true;if(wn&&canon(wn)===n)alive=true}else{alive=true}});if(lost)return 'eliminated';if(alive)return 'alive'}}catch(e){}if(FALLBACK_ELIMINATED.has(n))return 'eliminated';if(FALLBACK_ALIVE.has(n))return 'alive';return isKnockoutStage(w)?'eliminated':null}
function patchCleanSlate(){try{let {w}=wrap();if(!w)return;w.isKnockoutMode=function(win){return isKnockoutStage(win||w)};w.applyPointColors=function(doc,win){if(isKnockoutStage(win||w))return;try{doc.querySelectorAll('.rosterTeam').forEach(card=>{const name=card.querySelector('.rosterTeamName'),score=card.querySelector('.rosterScore'),record=card.querySelector('.rosterRecord'),status=card.querySelector('.rosterStatus');if(!name||!score||!(win||w).rec)return;const r=(win||w).rec(String(name.textContent||'').replace('⚽','').trim());if((r.w||0)>0||(r.d||0)>0){card.classList.add('pointTeam');score.classList.add('pointScore');record&&record.classList.add('pointRecord');status&&status.classList.add('pointStatus');}})}catch(e){}}}catch(e){}}
function removeKnockoutPoints(){const {d,w}=docs();if(!d||!w||!isKnockoutStage(w))return;d.querySelectorAll('#leaderboard .leaderPts').forEach(x=>{x.textContent='No points'});d.querySelectorAll('#leaderboard .leaderMeta').forEach(x=>{x.textContent='Knockout phase • win-or-elimination'});}
function markKnockoutStatuses(){const {d,w}=docs();if(!d||!w||!isKnockoutStage(w))return;d.querySelectorAll('#groups .rosterTeam').forEach(card=>{let name=card.querySelector('.rosterTeamName');if(!name)return;let team=String(name.textContent||'').replace('⚽','').trim(),st=teamKnockoutStatus(w,team);if(!st)return;card.classList.remove('pointTeam');card.querySelectorAll('.pointScore,.pointRecord,.pointStatus').forEach(x=>x.classList.remove('pointScore','pointRecord','pointStatus'));let alive=st==='alive',pts=groupStagePoints(w,team),rec=card.querySelector('.rosterRecord'),score=card.querySelector('.rosterScore'),stat=card.querySelector('.rosterStatus');if(score){score.textContent=pts+' pts';score.style.background=alive?'#dcfce7':'#fff1f4';score.style.color=alive?'#087443':'#b42318';score.style.border=alive?'1px solid #86efac':'1px solid #fecdd3'}if(rec){rec.textContent=alive?'Group stage: '+pts+' pts • Win-or-elimination':'Group stage: '+pts+' pts • Eliminated';rec.style.color=alive?'#087443':'#b42318';rec.style.fontWeight='900'}if(stat){stat.textContent=alive?'Win-or-Elimination':'Eliminated';stat.classList.remove('live','advance','strong','alive','warn','clinched','pointStatus');stat.classList.add(alive?'alive':'out');stat.style.background=alive?'#dcfce7':'#fff1f4';stat.style.color=alive?'#087443':'#b42318';stat.style.border=alive?'1px solid #86efac':'1px solid #fecdd3'}})}
function updateKnockoutImpacts(){const {d,w}=docs();if(!d||!w||!isKnockoutStage(w))return;d.querySelectorAll('#tbody .impactPill').forEach(pill=>{let txt=pill.textContent||'',m=txt.match(/^([^:]+:\s*)(.*?)\s*•/);if(!m)return;let prefix=m[1],team=m[2],st=teamKnockoutStatus(w,team);if(!st)return;pill.textContent=prefix+team+' • '+(st==='alive'?'Win-or-Elimination':'Eliminated');pill.classList.toggle('zero',st!=='alive');if(st==='eliminated'){pill.style.background='#fff1f4';pill.style.color='#b42318';pill.style.border='1px solid #fecdd3'}else{pill.style.background='#dcfce7';pill.style.color='#087443';pill.style.border='1px solid #86efac'}})}
function patchScheduleSource(){try{let d=frame.contentDocument,w=frame.contentWindow;if(!w)return;w.scheduleRows=function(doc,win){return (win.matches||[]).slice().filter(m=>{try{return w.matchAllowedByFilters?w.matchAllowedByFilters(doc,win,m):true}catch(e){return true}}).sort((a,b)=>{let pa=statePriorityFromMatch(a),pb=statePriorityFromMatch(b);if(pa!==pb)return pa-pb;let da=new Date(a.date).getTime()||0,db=new Date(b.date).getTime()||0;return pa===2?db-da:da-db})};if(typeof w.update==='function')setTimeout(()=>w.update('scheduleSort'),50)}catch(e){}}
function rowPriority(r){if(r.classList.contains('in'))return 0;if(r.classList.contains('pre'))return 1;if(r.classList.contains('post'))return 2;return statePriorityFromText(r.textContent||'')}
function sortScheduleDom(){const {d}=docs();if(!d)return;let tbody=d.getElementById('tbody');if(!tbody)return;let rows=[...tbody.querySelectorAll('tr')];if(rows.length<2)return;rows.forEach((r,i)=>{if(!r.dataset.originalOrder)r.dataset.originalOrder=String(i).padStart(5,'0')});let sorted=rows.slice().sort((a,b)=>{let pa=rowPriority(a),pb=rowPriority(b);if(pa!==pb)return pa-pb;let da=Date.parse(a.textContent)||0,db=Date.parse(b.textContent)||0;return pa===2?db-da:Number(a.dataset.originalOrder)-Number(b.dataset.originalOrder)});if(sorted.some((r,i)=>r!==rows[i]))sorted.forEach(r=>tbody.appendChild(r));}
function applyPatches(){patchCleanSlate();patchScheduleSource();setTimeout(()=>{sortScheduleDom();removeKnockoutPoints();markKnockoutStatuses();updateKnockoutImpacts()},80);setTimeout(()=>{sortScheduleDom();removeKnockoutPoints();markKnockoutStatuses();updateKnockoutImpacts()},300)}
function installWatch(){const {d}=docs();if(!d||d.__v61PatchWatch)return;['sStatus','sFriend','sSearch','sTz','status','friend','search','tz'].forEach(id=>{let el=d.getElementById(id);if(el){el.addEventListener('change',()=>setTimeout(applyPatches,120));el.addEventListener('input',()=>setTimeout(applyPatches,120));}});d.__v61PatchWatch=true;}
frame.addEventListener('load',()=>{setTimeout(()=>{installWatch();applyPatches()},700);setTimeout(()=>{installWatch();applyPatches()},1500);setInterval(()=>{installWatch();applyPatches()},3000)});
</script></body></html>
