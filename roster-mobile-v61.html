<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>World Cup Mobile Roster Tracker</title><link rel="preload" href="roster-mobile-v26.html?v=60" as="document"><style>html,body{margin:0;width:100%;height:100%;background:#0f7b3f;overflow:auto}iframe{border:0;width:100%;min-height:100vh;display:block}</style></head><body><iframe id="tracker" loading="eager" fetchpriority="high" src="roster-mobile-v26.html?v=60"></iframe><script>
const frame=document.getElementById('tracker');let lastRefresh=0,syncing=false;
function getDocs(){try{const wrap=frame.contentDocument,wrapWin=frame.contentWindow;const appFrame=wrap&&wrap.getElementById('tracker');const app=appFrame&&appFrame.contentDocument;const appWin=appFrame&&appFrame.contentWindow;return{wrap,wrapWin,app,appWin}}catch(e){return{}}}
function norm(x){return String(x||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/&/g,'and').replace(/[^a-z0-9 ]/g,' ').replace(/\s+/g,' ').trim()}
const TEAM_CODES={usa:['united states','us','u s a','america'],mex:['mexico'],rsa:['south africa'],kor:['south korea','korea'],cze:['czechia','czech republic'],can:['canada'],bih:['bosnia and herzegovina','bosnia herzegovina','bosnia'],qat:['qatar'],sui:['switzerland'],bra:['brazil'],mar:['morocco'],hti:['haiti'],sco:['scotland'],aus:['australia'],tur:['turkey','turkiye'],par:['paraguay'],ger:['germany'],cuw:['curacao'],civ:['ivory coast','cote d ivoire'],ecu:['ecuador'],ned:['netherlands','holland'],jpn:['japan'],swe:['sweden'],tun:['tunisia'],bel:['belgium'],egy:['egypt'],iri:['iran'],nzl:['new zealand'],esp:['spain'],cpv:['cape verde'],ksa:['saudi arabia'],uru:['uruguay'],fra:['france'],sen:['senegal'],irq:['iraq'],nor:['norway'],arg:['argentina'],dza:['algeria'],aut:['austria'],jor:['jordan'],por:['portugal'],cod:['dr congo','congo dr','congo'],uzb:['uzbekistan'],col:['colombia'],eng:['england'],cro:['croatia'],gha:['ghana'],pan:['panama']};
function teamTokens(t){let n=norm(t),out=[n];Object.keys(TEAM_CODES).forEach(code=>{if(TEAM_CODES[code].some(a=>norm(a)===n))out.push(code,...TEAM_CODES[code].map(norm));});return [...new Set(out)]}
function sameTeam(a,b){return teamTokens(a).some(x=>teamTokens(b).includes(x))}
function teamMatches(q,t){let nq=norm(q);if(!nq)return true;return teamTokens(t).some(tok=>tok.includes(nq)||nq.includes(tok))}
function displayTeam(t){if(sameTeam(t,'Bosnia-Herzegovina'))return 'Bosnia-Herzegovina';if(sameTeam(t,'Congo Dr'))return 'Congo Dr';return t}
function isTbd(t){return !t||/\bTBD\b|winner of|loser of/i.test(String(t))}
function isLiveMatch(m){return ['in','live','playing'].includes(norm(m&&m.state))||['in','live','playing'].includes(norm(m&&m.status))}
function isFuture(m){let s=norm((m&&m.state)||m&&m.status);return ['pre','upcoming','scheduled'].includes(s)}
function isPlayed(m){let s=norm((m&&m.state)||'');return ['post','complete','completed','final','finished'].includes(s)||(!['pre','upcoming','scheduled'].includes(s)&&m&&m.homeScore!=null&&m.awayScore!=null&&!isNaN(Number(m.homeScore))&&!isNaN(Number(m.awayScore))&&!isLiveMatch(m))}
function stageText(m){return String(m&&(m.round||m.stage||m.group||m.phase||m.competitionStage)||'')}
function isKnockout(m){return /round of 32|round of 16|quarter|semi|final|knockout|3rd|third/i.test(stageText(m))}
function isWorldCupFinal(m){let s=stageText(m).toLowerCase();return /final/.test(s)&&!/semi|3rd|third|place/.test(s)}
function penHome(m){return Number(m&&(m.homePenaltyScore??m.homePenalties??m.homePens??m.penaltyHome??m.homePK??m.homePk??NaN))}
function penAway(m){return Number(m&&(m.awayPenaltyScore??m.awayPenalties??m.awayPens??m.penaltyAway??m.awayPK??m.awayPk??NaN))}
function matchWinner(m){if(!m)return null;if(m.winnerTeam)return m.winnerTeam;if(m.winner)return m.winner;if(m.winnerName)return m.winnerName;let hs=Number(m.homeScore),as=Number(m.awayScore);if(Number.isFinite(hs)&&Number.isFinite(as)&&hs!==as)return hs>as?m.homeTeam:m.awayTeam;let hp=penHome(m),ap=penAway(m);if(Number.isFinite(hp)&&Number.isFinite(ap)&&hp!==ap)return hp>ap?m.homeTeam:m.awayTeam;return null}
function matchLoser(m){let win=matchWinner(m);if(!win)return null;if(sameTeam(win,m.homeTeam))return m.awayTeam;if(sameTeam(win,m.awayTeam))return m.homeTeam;return null}
function fifaStatusForTeam(w,team){const ms=(w&&w.matches)||[],ko=ms.filter(isKnockout);let champ=null,elim=[],alive=[],part=[];ko.forEach(m=>{[m.homeTeam,m.awayTeam].forEach(t=>{if(!isTbd(t))part.push(t)});let win=matchWinner(m),lose=matchLoser(m);if(isPlayed(m)&&win&&isWorldCupFinal(m))champ=win;if(isPlayed(m)&&lose)elim.push(lose);if(isLiveMatch(m)||isFuture(m)){[m.homeTeam,m.awayTeam].forEach(t=>{if(!isTbd(t))alive.push(t)})}if(isPlayed(m)&&win)alive.push(win)});if(champ)return sameTeam(team,champ)?{txt:'🏆 Champion',cls:'championStatus'}:{txt:'❌ Eliminated',cls:'eliminatedStatus'};if(ko.length){if(elim.some(t=>sameTeam(team,t)))return{txt:'❌ Eliminated',cls:'eliminatedStatus'};if(alive.some(t=>sameTeam(team,t))||part.some(t=>sameTeam(team,t)))return{txt:'✅ Still Alive',cls:'aliveStatus'};return{txt:'❌ Eliminated',cls:'eliminatedStatus'}}return{txt:'✅ Still Alive',cls:'aliveStatus'}}
function normalizeNames(){const{app,appWin}=getDocs();if(appWin){try{['DEFAULT_GROUPS','groups'].forEach(k=>{if(Array.isArray(appWin[k]))appWin[k].forEach(g=>{if(Array.isArray(g.teams))g.teams=g.teams.map(displayTeam);if(g.group==='Group 1')g.friends=['Hugh','Evie','Ollie','Sharon']})});if(Array.isArray(appWin.matches))appWin.matches.forEach(m=>{m.homeTeam=displayTeam(m.homeTeam);m.awayTeam=displayTeam(m.awayTeam)});if(Array.isArray(appWin.groups))appWin.localStorage.wcFriendGroups_v15=JSON.stringify(appWin.groups)}catch(e){}}if(app){app.querySelectorAll('option,.leaderName,.rosterHead b,.rosterMeta,.liveFriendPill,.impactPill').forEach(el=>{let t=el.textContent||'';t=t.replace(/Hugh\s*,\s*Ollie\s*,\s*Sharon\s*(?:,|&|and)?\s*Barry/gi,'Hugh, Evie, Ollie, Sharon').replace(/Hugh\s*•\s*Ollie\s*•\s*Sharon\s*•\s*Barry/gi,'Hugh • Evie • Ollie • Sharon').replace(/\bBosnia(?:\s+and\s+Herzegovina|-Herzegovina)?\b/gi,'Bosnia-Herzegovina').replace(/\bDR\s+Congo\b|\bCongo\s+DR\b/gi,'Congo Dr');if(el.textContent!==t)el.textContent=t})}}
function pair(app,a,b,from){const x=app.getElementById(a),y=app.getElementById(b);if(!x||!y)return;const src=(from===a)?x:(from===b)?y:(app.activeElement===y?y:x);if(x.value!==src.value)x.value=src.value;if(y.value!==src.value)y.value=src.value}
function sync(app,from){if(syncing)return;syncing=true;pair(app,'search','sSearch',from);pair(app,'friend','sFriend',from);pair(app,'status','sStatus',from);pair(app,'tz','sTz',from);syncing=false}
function teamRecord(w,t){let r={w:0,d:0,l:0};try{(w.matches||[]).forEach(m=>{if(!isPlayed(m))return;let h=sameTeam(t,m.homeTeam),a=sameTeam(t,m.awayTeam);if(!h&&!a)return;let hs=Number(m.homeScore||0),as=Number(m.awayScore||0);if(hs===as)r.d++;else if((h&&hs>as)||(a&&as>hs))r.w++;else r.l++})}catch(e){}return r}
function patchTeamResults(){const{appWin}=getDocs();if(!appWin)return;appWin.rec=t=>teamRecord(appWin,t);appWin.status=t=>{let fs=fifaStatusForTeam(appWin,t);return{cls:fs.cls,txt:fs.txt}}}
function patchSchedule(){const{wrapWin}=getDocs();if(!wrapWin)return;wrapWin.teamMatches=teamMatches;wrapWin.sameTeam=sameTeam;wrapWin.scoreText=function(m){m.homeTeam=displayTeam(m.homeTeam);m.awayTeam=displayTeam(m.awayTeam);if(m.state==='pre')return `${m.homeTeam} 0 - 0 ${m.awayTeam}`;let lead=matchWinner(m)||'';let label=isLiveMatch(m)?'Winning':'Winner';return `${m.homeTeam} ${m.homeScore??0} - ${m.awayScore??0} ${m.awayTeam}${lead?'<div class="wcWinner">'+label+': '+displayTeam(lead)+'</div>':''}`};wrapWin.scheduleRows=function(d,w){return(w.matches||[]).slice().filter(m=>{try{return wrapWin.matchAllowedByFilters?wrapWin.matchAllowedByFilters(d,w,m):true}catch(e){return true}}).sort((a,b)=>{let pa=isLiveMatch(a)?0:isFuture(a)?1:isPlayed(a)?2:3,pb=isLiveMatch(b)?0:isFuture(b)?1:isPlayed(b)?2:3;if(pa!==pb)return pa-pb;let da=new Date(a.date).getTime()||0,db=new Date(b.date).getTime()||0;return pa===2?db-da:da-db})}}
function injectStyle(){const{app}=getDocs();if(!app||app.getElementById('fifaRosterStatusStyleV61'))return;let s=app.createElement('style');s.id='fifaRosterStatusStyleV61';s.textContent='.rosterTeam,.rosterStatus,.rosterScore,.rosterRecord{animation:none!important;transition:none!important}.rosterStatus.aliveStatus,.teamPickFifaStatus.aliveStatus{background:#dcfce7!important;color:#087443!important;border:1px solid #86efac!important}.rosterStatus.eliminatedStatus,.teamPickFifaStatus.eliminatedStatus{background:#fee2e2!important;color:#b42318!important;border:1px solid #fecaca!important}.rosterStatus.championStatus,.teamPickFifaStatus.championStatus{background:#fef3c7!important;color:#92400e!important;border:1px solid #fbbf24!important;box-shadow:none!important}.rosterTeam.fifaAlive{border-color:#86efac!important;background:#f0fdf4!important}.rosterTeam.fifaEliminated{border-color:#fecaca!important;background:#fff7f7!important;opacity:1!important}.rosterTeam.fifaChampion{border-color:#fbbf24!important;background:#fff7d6!important;box-shadow:none!important}.teamPickFifaStatus{display:inline-block;margin-top:5px;border-radius:999px;padding:5px 8px;font-size:10px;font-weight:1000;line-height:1}';app.head.appendChild(s)}
function applyRosterStatus(){const{app,appWin}=getDocs();if(!app||!appWin)return;app.querySelectorAll('.rosterTeam').forEach(card=>{let n=card.querySelector('.rosterTeamName'),stEl=card.querySelector('.rosterStatus');if(!n||!stEl)return;let team=(n.textContent||'').replace('⚽','').trim(),st=fifaStatusForTeam(appWin,team);stEl.textContent=st.txt;stEl.classList.remove('aliveStatus','eliminatedStatus','championStatus');stEl.classList.add(st.cls);card.classList.remove('fifaAlive','fifaEliminated','fifaChampion');card.classList.add(st.cls==='championStatus'?'fifaChampion':st.cls==='eliminatedStatus'?'fifaEliminated':'fifaAlive')})}
function applyTeamPickStatus(){const{app,appWin}=getDocs();if(!app||!appWin)return;const sec=app.getElementById('groups')||app.body;sec.querySelectorAll('.teamPill,.tile').forEach(el=>{let raw=(el.textContent||'').replace(/✅ Still Alive|❌ Eliminated|🏆 Champion/g,'').trim();if(!raw)return;let team=raw.replace(/^⚽\s*/,'').split('•')[0].trim();let st=fifaStatusForTeam(appWin,team);let badge=el.querySelector('.teamPickFifaStatus');if(!badge){badge=app.createElement('span');badge.className='teamPickFifaStatus';el.appendChild(badge)}badge.textContent=st.txt;badge.classList.remove('aliveStatus','eliminatedStatus','championStatus');badge.classList.add(st.cls)})}
function applyFilters(from){const{wrapWin,app,appWin}=getDocs();if(!app)return false;normalizeNames();sync(app,from);patchTeamResults();patchSchedule();injectStyle();try{if(appWin&&typeof appWin.refresh==='function'&&Date.now()-lastRefresh>600){lastRefresh=Date.now();appWin.refresh()}}catch(e){}try{if(wrapWin&&typeof wrapWin.update==='function')wrapWin.update(from)}catch(e){}setTimeout(()=>{normalizeNames();injectStyle();applyRosterStatus();applyTeamPickStatus()},30);resize();return true}
function install(){const{app}=getDocs();if(!app||app.__filterStableV61Fifa2)return false;['search','sSearch','friend','sFriend','status','sStatus','tz','sTz'].forEach(id=>{const el=app.getElementById(id);if(el){el.addEventListener('input',()=>setTimeout(()=>applyFilters(id),10),true);el.addEventListener('change',()=>setTimeout(()=>applyFilters(id),10),true)}});app.__filterStableV61Fifa2=true;return true}
function resize(){try{const wrap=frame.contentDocument;frame.style.height=Math.max(wrap.documentElement.scrollHeight,window.innerHeight)+'px'}catch(e){}}
function fastStart(){install();normalizeNames();patchTeamResults();patchSchedule();injectStyle();applyRosterStatus();applyTeamPickStatus();applyFilters();resize()}
frame.addEventListener('load',()=>{const boot=setInterval(fastStart,75);setTimeout(()=>clearInterval(boot),5000);setTimeout(fastStart,25);setTimeout(fastStart,150);setTimeout(fastStart,500);setTimeout(fastStart,950)});
const immediate=setInterval(fastStart,100);setTimeout(()=>clearInterval(immediate),5000);setInterval(fastStart,1500);
</script></body></html>
