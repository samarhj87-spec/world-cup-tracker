<!doctype html><html><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>World Cup Mobile Roster Tracker</title><style>html,body{margin:0;width:100%;height:100%;background:#0f7b3f;overflow:auto}iframe{border:0;width:100%;min-height:100vh;display:block}</style></head><body><iframe id='tracker' src='roster-mobile-v26.html?v=60'></iframe><script>
const frame=document.getElementById('tracker');
frame.style.visibility='hidden';
const KO_START=new Date('2026-06-28T00:00:00-05:00').getTime();
const ALIASES={'usa':'united states','u s a':'united states','united states of america':'united states','bosnia and herzegovina':'bosnia','dr congo':'dr congo','congo':'dr congo','ivory coast':'ivory coast','cote d ivoire':'ivory coast','curacao':'curacao','curaçao':'curacao','turkiye':'turkey','türkiye':'turkey'};
const ALIVE=new Set(['canada','brazil','paraguay','morocco','norway','france','mexico','ecuador','england','dr congo','belgium','senegal','united states','bosnia','spain','austria','portugal','croatia','switzerland','algeria','australia','egypt','argentina','cape verde','colombia','ghana']);
const OUT=new Set(['south africa','japan','germany','netherlands','ivory coast','sweden','south korea','czechia','tunisia','curacao','qatar','new zealand','iran','uruguay','haiti','scotland','turkey','saudi arabia','iraq','jordan','uzbekistan','panama']);
function norm(x){return String(x||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/&/g,'and').replace(/[^a-z0-9 ]/g,' ').replace(/\s+/g,' ').trim()}
function canon(x){let n=norm(x);return ALIASES[n]||n}
function sameTeam(a,b){return canon(a)===canon(b)}
function deep(){try{let d=frame.contentDocument,w=frame.contentWindow;for(let i=0;i<10;i++){let inner=d&&d.querySelector?d.querySelector('iframe'):null;if(!inner||!inner.contentDocument)break;d=inner.contentDocument;w=inner.contentWindow}return{d,w}}catch(e){return{}}}
function outer(){try{return{d:frame.contentDocument,w:frame.contentWindow}}catch(e){return{}}}
function esc(x){return String(x||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function roundText(m){return norm([m&&m.round,m&&m.stage,m&&m.phase,m&&m.roundName,m&&m.stageName,m&&m.name,m&&m.status].filter(Boolean).join(' '))}
function koRound(m){return /round of 32|round 32|r32|round of 16|round 16|r16|quarter|semi|final|third|3rd|knockout/.test(roundText(m))}
function koMatch(m){let t=new Date(m&&m.date).getTime()||0;return koRound(m)||(t&&t>=KO_START)}
function groupMatch(m){let t=new Date(m&&m.date).getTime()||0;return !!t&&t<KO_START&&!koRound(m)}
function done(m){let n=norm(m&&m.state),s=norm(m&&m.status);return !!(m&&(m.completed||n==='post'||['complete','completed','final','finished','ft'].includes(s)))}
function winner(m){if(!m)return'';if(m.winner)return m.winner;if(m.winnerTeam)return m.winnerTeam;let hs=Number(m.homeScore),as=Number(m.awayScore);if(!isNaN(hs)&&!isNaN(as)&&hs!==as)return hs>as?m.homeTeam:m.awayTeam;let hp=Number(m.homePenaltyScore||m.homePenalties||m.homePens),ap=Number(m.awayPenaltyScore||m.awayPenalties||m.awayPens);if(!isNaN(hp)&&!isNaN(ap)&&hp!==ap)return hp>ap?m.homeTeam:m.awayTeam;return''}
function groupRec(win,team){let r={w:0,d:0,l:0,played:0,points:0,gf:0,ga:0,gd:0};try{(win.matches||[]).forEach(m=>{if(!groupMatch(m)||!done(m))return;let H=sameTeam(m.homeTeam,team),A=sameTeam(m.awayTeam,team);if(!H&&!A)return;let hs=Number(m.homeScore)||0,as=Number(m.awayScore)||0,gf=H?hs:as,ga=H?as:hs;r.gf+=gf;r.ga+=ga;if(gf>ga)r.w++;else if(gf===ga)r.d++;else r.l++});r.played=r.w+r.d+r.l;r.points=r.w*3+r.d;r.gd=r.gf-r.ga}catch(e){}return r}
function groupPts(win,team){return groupRec(win,team).points||0}
function koMode(win){try{if(Date.now()>=KO_START)return true;return (win.matches||[]).some(m=>koMatch(m)&&(done(m)||['in','live','playing'].includes(norm(m.state||m.status))))}catch(e){return Date.now()>=KO_START}}
function teamStatus(win,team){let n=canon(team);if(!n)return null;try{let ms=(win.matches||[]).filter(m=>koMatch(m)&&(sameTeam(m.homeTeam,team)||sameTeam(m.awayTeam,team))).sort((a,b)=>new Date(a.date)-new Date(b.date));let lost=false,alive=false;if(ms.length){ms.forEach(m=>{if(done(m)){let w=winner(m);if(w&&canon(w)===n)alive=true;else if(w)lost=true}else alive=true});if(lost)return'eliminated';if(alive)return'alive'}}catch(e){}if(OUT.has(n))return'eliminated';if(ALIVE.has(n))return'alive';return koMode(win)?'eliminated':null}
function teamsFor(win,g){try{let x=(win.groups||[]).find(a=>a.group===g);return ((x&&x.teams)||[])}catch(e){return[]}}
function counts(win,g){let c={alive:0,eliminated:0,total:0,groupPts:0};teamsFor(win,g).forEach(t=>{let s=teamStatus(win,t);c.total++;c.groupPts+=groupPts(win,t);if(s==='alive')c.alive++;else if(s==='eliminated')c.eliminated++});return c}
function label(ow,win,g){try{return ow.groupName?ow.groupName(win,g):(win.gname?win.gname(g.group||g):((g.friends||[]).join(' • ')||g.group||g))}catch(e){return(g&&g.group)||String(g||'')}}
function groups(ow,d,win){try{return ow.filteredGroups(d,win)}catch(e){return win.groups||[]}}
function patchRender(){let ow=outer().w;if(!ow||ow.__directKoRosterFix)return false;if(typeof ow.renderRoster!=='function'||typeof ow.renderLeaderboard!=='function'||!deep().d)return false;ow.__directKoRosterFix=true;ow.isKnockoutMode=function(win){return koMode(win||deep().w)};ow.noBonusRecord=function(win,t){return groupRec(win||deep().w,t)};ow.noBonusScore=function(win,t){return groupPts(win||deep().w,t)};ow.matchPts=function(){return 0};ow.renderRoster=function(d,win){let holder=d.getElementById('groups');if(!holder)return;let gs=groups(ow,d,win);holder.innerHTML=gs.map(g=>{let list=(g.teams||[]).map(t=>{let pts=groupPts(win,t),s=teamStatus(win,t),out=s==='eliminated',bg=out?'#fff1f4':'#dcfce7',fg=out?'#b42318':'#087443',bd=out?'#fecdd3':'#86efac',rec=out?'Group stage: '+pts+' pts • Eliminated':'Group stage: '+pts+' pts • Still alive to move on',stat=out?'Eliminated':'Still Alive';return `<div class="rosterTeam"><div class="rosterTop"><div><div class="rosterTeamName">⚽ ${esc(t)}</div><div class="rosterRecord" style="color:${fg};font-weight:900">${esc(rec)}</div></div><div class="rosterScore" style="background:${bg};color:${fg};border:1px solid ${bd}">${pts} pts</div></div><span class="rosterStatus ${out?'out':'alive'}" style="background:${bg};color:${fg};border:1px solid ${bd}">${stat}</span></div>`}).join('');return `<div class="rosterGroup"><div class="rosterHead"><b>${esc(label(ow,win,g))}</b><div class="rosterMeta">${esc((g.friends||[]).join(' • '))} • ${(g.teams||[]).length} matching country team${(g.teams||[]).length===1?'':'s'}</div></div><div class="rosterTeams">${list}</div></div>`}).join('')||'<div class="empty">No roster teams match this filter.</div>'};ow.renderLeaderboard=function(d,win){let board=d.getElementById('leaderboard');if(!board)return;try{ow.ensureLeaderboardHeader&&ow.ensureLeaderboardHeader(d)}catch(e){}let rows=groups(ow,d,win).map(g=>[g.group,counts(win,g.group)]).sort((a,b)=>b[1].alive-a[1].alive||b[1].groupPts-a[1].groupPts);if(!rows.length){board.innerHTML='<div class="empty">No teams found for this filter.</div>';return}let max=Math.max(1,...rows.map(r=>r[1].total));board.innerHTML='<div class="leaderCards">'+rows.map((r,i)=>{let c=r[1],pct=Math.round(c.alive/max*100),medal=i===0?'🥇':i===1?'🥈':i===2?'🥉':'⚽';return `<button class="leaderCard ${i===0?'first':''}" data-group="${esc(r[0])}"><div class="leaderTop"><span class="medal">${medal}</span><span class="leaderName">${esc(label(ow,win,r[0]))}</span><span class="leaderPts">${c.alive} alive</span></div><div class="leaderMeta">${c.alive} teams left • ${c.eliminated} eliminated • Group-stage total: ${c.groupPts} pts</div><div class="leaderBar"><span style="width:${pct}%"></span></div><div class="leaderTap">Tap to filter this group</div></button>`}).join('')+'</div>';board.querySelectorAll('.leaderCard').forEach(btn=>btn.onclick=()=>{try{ow.setFriend(d,btn.dataset.group)}catch(e){}let sched=d.getElementById('schedule');if(sched)sched.scrollIntoView({behavior:'smooth',block:'start'})})};ow.impactHtml=function(win,m,gs){let out=[];[m.homeTeam,m.awayTeam].forEach(t=>{let gr=[];try{gr=win.picked(t,gs)}catch(e){}gr.forEach(g=>out.push({g,team:t,s:teamStatus(win,t)}))});return out.length?out.map(x=>`<span class="impactPill ${x.s==='eliminated'?'zero':''}">${esc(win.gname?win.gname(x.g):x.g)}: ${esc(x.team)} • ${x.s==='eliminated'?'Eliminated':'Still Alive'}</span>`).join(''):'<span class="wcSmall">No friend impact</span>'};return true}
function prio(m){let n=norm((m&&m.state)||m&&m.status);if(['in','live','playing'].includes(n))return 0;if(['pre','upcoming','scheduled'].includes(n))return 1;if(['post','complete','completed','final','finished','ft'].includes(n))return 2;return 3}
function patchSchedule(){try{let ow=outer().w;if(!ow)return;ow.scheduleRows=function(d,win){return (win.matches||[]).slice().filter(m=>{try{return ow.matchAllowedByFilters?ow.matchAllowedByFilters(d,win,m):true}catch(e){return true}}).sort((a,b)=>{let pa=prio(a),pb=prio(b);if(pa!==pb)return pa-pb;let da=new Date(a.date).getTime()||0,db=new Date(b.date).getTime()||0;return pa===2?db-da:da-db})}}catch(e){}}
function finish(showNow){try{let ow=outer().w;if(ow&&typeof ow.update==='function')ow.update('directKoRosterFix')}catch(e){}setTimeout(()=>{frame.style.visibility='visible'},showNow?0:50)}
function boot(){let tries=0;let timer=setInterval(()=>{tries++;if(patchRender()){clearInterval(timer);patchSchedule();finish(false)}else if(tries>120){clearInterval(timer);frame.style.visibility='visible'}},50)}
frame.addEventListener('load',boot);
setTimeout(()=>{if(frame.style.visibility==='hidden')boot()},300);
</script></body></html>
