<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><meta http-equiv="Pragma" content="no-cache"><meta http-equiv="Expires" content="0"><title>World Cup Winner</title><style>html,body{margin:0;min-height:100%;background:#0f7b3f;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.winnerTop{position:relative;z-index:10001;padding:18px 14px 20px;text-align:center;background:linear-gradient(135deg,#fff8cd,#ffd700);border-bottom:4px solid #c99a00;color:#503900;box-shadow:0 8px 24px rgba(0,0,0,.3)}.winnerTitle{font-size:24px;font-weight:1000;line-height:1.15}.winnerGroup{margin-top:8px;font-size:17px;font-weight:900;line-height:1.35}.trophy{font-size:1.2em}iframe{border:0;width:100%;min-height:calc(100vh - 132px);display:block}.piece{position:fixed;top:-10vh;z-index:10002;pointer-events:none;font-size:22px;animation:fall var(--t) linear var(--d) forwards}@keyframes fall{to{transform:translate3d(var(--x),110vh,0) rotate(900deg);opacity:.1}}</style></head><body><section class="winnerTop" aria-label="World Cup winner"><div class="winnerTitle">🇪🇸 SPAIN WON THE FIFA WORLD CUP! <span class="trophy">🏆</span></div><div class="winnerGroup">🎉 Friend Leaderboard Winners: Keith, Susie, Henry, Thomas &amp; Barney <span class="trophy">🏆</span></div></section><iframe src="roster-mobile-v26.html?v=65" title="World Cup tracker"></iframe><script>let icons=['🎉','🎊','✨','⭐','🏆','🇪🇸'];for(let i=0;i<110;i++){let p=document.createElement('span');p.className='piece';p.textContent=icons[i%icons.length];p.style.left=Math.random()*100+'vw';p.style.setProperty('--x',(Math.random()-.5)*42+'vw');p.style.setProperty('--t',3.5+Math.random()*3.5+'s');p.style.setProperty('--d',Math.random()*1.6+'s');document.body.appendChild(p)}setTimeout(()=>document.querySelectorAll('.piece').forEach(x=>x.remove()),9500)</script></body></html>
