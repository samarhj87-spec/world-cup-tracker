<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>World Cup Mobile Roster Tracker</title><style>html,body{margin:0;width:100%;height:100%;background:#0f7b3f;overflow:auto}iframe{border:0;width:100%;min-height:100vh;display:block}</style></head><body><iframe id="tracker" src="roster-mobile-v26.html?v=60"></iframe><script>
const frame=document.getElementById('tracker');
const ELIMINATED=['South Africa','Japan','Germany','Czechia','South Korea','Qatar','Haiti','Scotland','Turkey','Türkiye','Curacao','Curaçao','Tunisia','Iran','New Zealand','Saudi Arabia','Uruguay','Iraq','Jordan','Uzbekistan','Panama'];
const STILL_ALIVE=['Canada','Brazil','Paraguay','Netherlands','Morocco','Ivory Coast','Côte d\'Ivoire','Norway','France','Sweden','Mexico','Ecuador','England','DR Congo','Belgium','Senegal','United States','Bosnia','Bosnia-Herzegovina','Bosnia and Herzegovina','Spain','Austria','Portugal','Croatia','Switzerland','Algeria','Australia','Egypt','Argentina','Cape Verde','Colombia','Ghana'];
function norm(x){return String(x||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/&/g,'and').replace(/[^a-z0-9 ]/g,' ').replace(/\s+/g,' ').trim()}
function same(a,b){let A=norm(a),B=norm(b);if(!A||!B)return false;let aliases={'usa':'united states','us':'united states','u s a':'united states','america':'united states','bosnia herzegovina':'bosnia','bosnia and herzegovina':'bosnia','bosnia-herzegovina':'bosnia','dr congo':'congo','congo dr':'congo','cote d ivoire':'ivory coast','côte d ivoire':'ivory coast','turkey':'turkiye','türkiye':'turkiye','curacao':'curacao','curaçao':'curacao'};A=aliases[A]||A;B=aliases[B]||B;return A===B}
function docs(){try{let d=frame.contentDocument,w=frame.contentWindow;for(let i=0;i<10;i++){let inner=d&&d.querySelector?d.querySelector('iframe'):null;if(!inner||!inner.contentDocument)break;d=inner.contentDocument;w=inner.contentWindow}return{d,w}}catch(e){return{}}}
function finalChampion(w){try{let finals=(w.matches||[]).filter(m=>/final/i.test(String(m.round||m.stage||m.phase||''))&&!/semi|third|3rd|place/i.test(String(m.round||m.stage||m.phase||'')));let m=finals.find(x=>['post','complete','completed','final','finished'].includes(norm(x.state||x.status)));if(!m)return'';let hs=Number(m.homeScore),as=Number(m.awayScore);if(Number.isFinite(hs)&&Number.isFinite(as)&&hs!==as)return hs>as?m.homeTeam:m.awayTeam;let hp=Number(m.homePenaltyScore??m.homePenalties??m.homePens??NaN),ap=Number(m.awayPenaltyScore??m.awayPenalties??m.awayPens??NaN);if(Number.isFinite(hp)&&Number.isFinite(ap)&&hp!==ap)return hp>ap?m.homeTeam:m.awayTeam;return m.winnerTeam||m.winner||m.winnerName||''}catch(e){return''}}
function status(team,w){let champ=finalChampion(w);if(champ)return same(team,champ)?['🏆 Champion','champion','championStatus']:['❌ Eliminated','eliminated','eliminatedStatus'];if(ELIMINATED.some(x=>same(x,team)))return['❌ Eliminated','eliminated','eliminatedStatus'];if(STILL_ALIVE.some(x=>same(x,team)))return['✅ Still Alive','alive','aliveStatus'];return['❌ Eliminated','eliminated','eliminatedStatus']}
function groupName(g,w){try{return (w.gname&&w.gname(g.group))||((g.friends||[]).join(', '))||g.group}catch(e){return ((g.friends||[]).join(', '))||g.group}}
function getGroups(w){try{return (Array.isArray(w.groups)&&w.groups.length?w.groups:w.DEFAULT_GROUPS)||[]}catch(e){return[]}}
function getFilter(d){let f=d.getElementById('friend')?.value||'all';let q=norm(d.getElementById('search')?.value||'');return{f,q}}
function css(d){if(d.getElementById('categorizedRosterStatusCss'))return;let s=d.createElement('style');s.id='categorizedRosterStatusCss';s.textContent=`#groups .statusRosterGroup{background:#fff;border:1px solid #e1f1e6;border-radius:18px;padding:12px;margin:10px 0;box-shadow:0 4px 10px #0001}#groups .statusRosterHead{font-weight:1000;color:#073b4c;margin-bottom:8px}#groups .statusRosterMeta{font-size:12px;color:#667085;margin-bottom:10px}#groups .statusTeamGrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(165px,1fr));gap:8px}#groups .statusTeamTile{border-radius:14px;padding:10px;border:1px solid #e1f1e6;font-weight:950;background:white;line-height:1.2;animation:none!important;transition:none!important}#groups .statusTeamTile.alive{background:#f0fdf4!important;border-color:#86efac!important;color:#064e3b!important}#groups .statusTeamTile.eliminated{background:#fff7f7!important;border-color:#fecaca!important;color:#7f1d1d!important}#groups .statusTeamTile.champion{background:#fff7d6!important;border-color:#fbbf24!important;color:#78350f!important}.statusBadge{display:inline-block;margin-top:6px;border-radius:999px;padding:6px 9px;font-size:11px;font-weight:1000}.statusBadge.aliveStatus{background:#dcfce7!important;color:#087443!important;border:1px solid #86efac!important}.statusBadge.eliminatedStatus{background:#fee2e2!important;color:#b42318!important;border:1px solid #fecaca!important}.statusBadge.championStatus{background:#fef3c7!important;color:#92400e!important;border:1px solid #fbbf24!important}`;d.head.appendChild(s)}
function render(){const {d,w}=docs();if(!d||!w)return;css(d);let holder=d.getElementById('groups');if(!holder)return;let {f,q}=getFilter(d);let groups=getGroups(w).filter(g=>f==='all'||g.group===f);let html=groups.map(g=>{let teams=(g.teams||[]).filter(t=>!q||norm(t).includes(q));if(!teams.length)return'';let alive=teams.filter(t=>status(t,w)[1]==='alive').length;let elim=teams.filter(t=>status(t,w)[1]==='eliminated').length;let champ=teams.filter(t=>status(t,w)[1]==='champion').length;return `<div class="statusRosterGroup"><div class="statusRosterHead">${g.group} — ${groupName(g,w)}</div><div class="statusRosterMeta">✅ Still Alive: ${alive} &nbsp; ❌ Eliminated: ${elim}${champ?` &nbsp; 🏆 Champion: ${champ}`:''}</div><div class="statusTeamGrid">${teams.map(t=>{let st=status(t,w);return `<div class="statusTeamTile ${st[1]}"><div>${t}</div><span class="statusBadge ${st[2]}">${st[0]}</span></div>`}).join('')}</div></div>`}).join('');holder.innerHTML=html||'<div class="empty">No roster teams match this filter.</div>';try{frame.style.height=d.documentElement.scrollHeight+'px'}catch(e){}}
frame.addEventListener('load',()=>{setTimeout(render,1200);setInterval(render,500)});
</script></body></html>
