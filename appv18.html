<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>World Cup 2026 Friend Tracker v18</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0f7b3f}iframe{border:0;width:100%;height:100%;display:block}</style></head><body><iframe id="tracker" src="appv17.html?v=18"></iframe><script>
const frame=document.getElementById('tracker');
function installMobileFixes(){
  const d=frame.contentDocument,w=frame.contentWindow;if(!d||!w)return;
  let style=d.getElementById('mobile-v18-style');
  if(!style){
    style=d.createElement('style');style.id='mobile-v18-style';style.textContent=`
      html,body{overflow-x:hidden!important;max-width:100%!important}
      .top{position:relative!important;top:auto!important;z-index:1!important;padding:10px 10px 4px!important}
      .scorebar{position:relative!important;grid-template-columns:1fr!important;gap:8px!important;border-radius:18px!important;padding:12px!important;box-shadow:0 8px 18px #0003!important}
      .scorebar .big{font-size:24px!important;line-height:1.1!important;white-space:normal!important;word-break:normal!important}
      .score{font-size:30px!important;line-height:1!important}
      header,main{padding:10px!important;max-width:100%!important}
      .hero{grid-template-columns:1fr!important;border-radius:18px!important}
      .hero>div:first-child{padding:18px!important}
      .hero h1{font-size:30px!important;line-height:1.05!important}
      .hero p{font-size:14px!important}
      .ball{min-height:150px!important;padding:12px!important}
      .livebox{border-radius:16px!important;padding:12px!important;max-width:none!important}
      .livebox .big{font-size:24px!important;line-height:1.1!important;white-space:normal!important}
      .toolbar,.scheduleFilters{grid-template-columns:1fr!important;border-radius:18px!important;padding:12px!important;gap:10px!important;margin:10px 0!important}
      select,input,button{font-size:16px!important;min-height:46px!important;width:100%!important}
      .cards{grid-template-columns:1fr!important;gap:10px!important;margin-bottom:10px!important}
      .card{min-height:auto!important;border-radius:18px!important;padding:14px!important}
      .card h3{font-size:15px!important;margin-bottom:6px!important}
      .big{font-size:30px!important;line-height:1.1!important;word-break:normal!important}
      .txt{font-size:13px!important;line-height:1.35!important}
      .grid{grid-template-columns:1fr!important;border-radius:18px!important;padding:12px!important;margin-bottom:10px!important}
      .wide{border-radius:18px!important;padding:12px!important;margin-bottom:10px!important}
      h2{font-size:24px!important;line-height:1.15!important}
      .row{grid-template-columns:1fr!important;gap:6px!important;margin:14px 0!important}
      .bar{height:18px!important}
      .teamGrid{grid-template-columns:1fr!important}
      .tile,.winBox{border-radius:14px!important;padding:10px!important}
      .teamPill,.pill{font-size:12px!important;line-height:1.2!important;white-space:normal!important}
      table{min-width:760px!important;font-size:13px!important}
      th,td{padding:8px!important}
      #tournamentStatusCard{order:5!important}
      #todayTeams .v17match{font-size:12px!important;line-height:1.25!important;padding:7px 8px!important;margin:5px 0!important}
    `;d.head.appendChild(style);
  }
  const top=d.querySelector('.top'); if(top) top.style.position='relative';
  const scorebar=d.querySelector('.scorebar'); if(scorebar) scorebar.style.position='relative';
}
frame.addEventListener('load',()=>{setTimeout(installMobileFixes,1000);setInterval(()=>{try{installMobileFixes()}catch(e){}},2000);});
</script></body></html>
