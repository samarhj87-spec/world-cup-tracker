<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Roster Mobile World Cup Tracker</title><style>html,body{margin:0;width:100%;height:100%;background:#0f7b3f;overflow:auto}iframe{border:0;width:100%;min-height:100vh;display:block}</style></head><body><iframe id="tracker" src="appv15.html?roster=23"></iframe><script>
const f=document.getElementById('tracker');
function norm(x){return String(x||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9 ]/g,' ').replace(/\s+/g,' ').trim()}
function groupName(w,g){try{return w.gname(g.group||g)}catch(e){return (g.friends||[]).join(', ')||g.group||g}}
function inject(){const d=f.contentDocument,w=f.contentWindow;if(!d||!w)return;let s=d.getElementById('roster-v23-style');if(!s){s=d.createElement('style');s.id='roster-v23-style';s.textContent=`
html,body{overflow-x:hidden!important;max-width:100%!important;height:auto!important}.top{position:static!important;top:auto!important;padding:10px!important}.scorebar{position:static!important;grid-template-columns:1fr!important;border-radius:18px!important;padding:14px!important}.scorebar .big{font-size:23px!important;color:white!important;line-height:1.1!important}.scorebar button,.ghost{display:none!important}.hero .ball{display:none!important}.hero{grid-template-columns:1fr!important;border-radius:18px!important}.hero>div:first-child{padding:18px!important}.hero h1{font-size:28px!important;line-height:1.05!important}header,main{padding:10px!important;max-width:100%!important}.toolbar,.scheduleFilters{grid-template-columns:1fr!important;border-radius:18px!important;padding:12px!important;gap:10px!important}.toolbar>div:nth-child(6){display:none!important}.cards{display:none!important}.grid{grid-template-columns:1fr!important;border-radius:18px!important;padding:12px!important;margin-bottom:10px!important}.grid:nth-of-type(1)>div:nth-child(2){display:none!important}.wide{border-radius:18px!important;padding:12px!important;margin-bottom:10px!important}h2{font-size:22px!important;line-height:1.15!important}.row{grid-template-columns:1fr!important}.bar{height:18px!important}select,input,button{font-size:16px!important;min-height:46px!important;width:100%!important}.teamGrid{grid-template-columns:1fr!important}.tile,.winBox{border-radius:14px!important;padding:10px!important}.teamPill,.pill{font-size:12px!important;white-space:normal!important;line-height:1.2!important}table{min-width:760px!important;font-size:13px!important}.rosterGroup{background:#fff;border:1px solid #d9f1df;border-radius:18px;margin:12px 0;overflow:hidden;box-shadow:0 6px 14px #0001}.rosterHead{background:linear-gradient(135deg,#073b4c,#0f7b3f);color:#fff;padding:13px 14px}.rosterHead b{font-size:17px}.rosterMeta{font-size:12px;opacity:.9;margin-top:4px}.rosterTeams{display:grid;grid-template-columns:1fr;gap:8px;padding:10px}.rosterTeam{border:1px solid #e1f1e6;border-radius:14px;padding:10px;background:#fafffb;display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center}.rosterTeamName{font-weight:950;color:#073b4c;font-size:15px}.rosterRecord{font-size:12px;color:#667085;margin-top:3px}.rosterScore{font-weight:1000;background:#fff7d6;color:#8a6200;border-radius:999px;padding:6px 9px;font-size:12px;white-space:nowrap}.rosterStatus{grid-column:1/-1;font-size:12px;font-weight:900;border-radius:999px;padding:6px 9px;width:max-content;max-width:100%}`;d.head.appendChild(s)}
const alertDiv=[...d.querySelectorAll('.toolbar>div')].find(x=>/Notifications|Enable Alerts/i.test(x.textContent||''));if(alertDiv)alertDiv.remove();
renderOverallLeaderboard(d,w);renderRoster(d,w);try{f.style.height=d.documentElement.scrollHeight+'px'}catch(e){}
}
function overallRows(w){if(!w.groups||!w.calc)return[];const sc=w.calc(w.groups);return Object.keys(sc).map(k=>[k,sc[k]]).sort((a,b)=>b[1].points-a[1].points)}
function renderOverallLeaderboard(d,w){const rows=overallRows(w);const leader=d.getElementById('leader'),leaderText=d.getElementById('leaderText'),board=d.getElementById('leaderboard');if(leader&&rows[0])leader.textContent=groupName(w,rows[0][0]);if(leaderText&&rows[0])leaderText.textContent='Overall leader across all friend groups • '+rows[0][1].points+' pts';if(!board)return;const max=Math.max(12,...rows.map(r=>r[1].points));board.innerHTML=rows.map((r,i)=>`<div class="row"><div><b>${i?'':'👑 '}${groupName(w,r[0])}</b><div class="muted">Overall ranking • FIFA ${r[1].fifa} • Bonus ${r[1].bonus}</div></div><div class="bar"><span style="width:${Math.min(100,r[1].points/max*100)}%"></span></div><b>${r[1].points} pts</b></div>`).join('')||'<div class="empty">No leaderboard data.</div>'}
function renderRoster(d,w){if(!w.groups||!w.score||!w.status||!w.rec)return;const holder=d.getElementById('groups');if(!holder)return;const gs=w.fGroups?w.fGroups():w.groups;holder.innerHTML=gs.map(g=>{const teams=(g.teams||[]).map(t=>{let sc=w.score(t),st=w.status(t),r=w.rec(t);return `<div class="rosterTeam"><div><div class="rosterTeamName">⚽ ${t}</div><div class="rosterRecord">${r.w}W-${r.d}D-${r.l}L • FIFA ${sc.fifa} • Bonus ${sc.bonus}</div></div><div class="rosterScore">${sc.total} pts</div><div class="rosterStatus ${st.cls}">${st.txt}</div></div>`}).join('');return `<div class="rosterGroup"><div class="rosterHead"><b>${groupName(w,g)}</b><div class="rosterMeta">${(g.friends||[]).join(' • ')} • ${(g.teams||[]).length} teams</div></div><div class="rosterTeams">${teams}</div></div>`}).join('')||'<div class="empty">No roster teams match filters.</div>'}
f.addEventListener('load',()=>{setTimeout(inject,800);setInterval(()=>{try{inject()}catch(e){}},1000)});
</script></body></html>
