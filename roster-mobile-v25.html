<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Compact Mobile Roster Tracker</title><style>html,body{margin:0;width:100%;height:100%;background:#0f7b3f;overflow:auto}iframe{border:0;width:100%;min-height:100vh;display:block}</style></head><body><iframe id="tracker" src="roster-mobile-v24.html?v=25"></iframe><script>
const f=document.getElementById('tracker');
function removeSection(){
 const d1=f.contentDocument;if(!d1)return;
 const inner=d1.querySelector('iframe');
 const d=inner&&inner.contentDocument?inner.contentDocument:d1;
 if(!d)return;
 [...d.querySelectorAll('h2')].forEach(h=>{if((h.textContent||'').toLowerCase().includes('teams creating points')){const box=h.closest('div'); if(box) box.remove(); else h.remove();}});
 const pt=d.getElementById('pointTeams'); if(pt){const box=pt.closest('div'); if(box) box.remove(); else pt.remove();}
 [...d.querySelectorAll('.grid')].forEach(g=>{if((g.textContent||'').toLowerCase().includes('teams creating points')){[...g.children].forEach(ch=>{if((ch.textContent||'').toLowerCase().includes('teams creating points'))ch.remove();});}});
 try{f.style.height=d.documentElement.scrollHeight+'px'}catch(e){}
}
f.addEventListener('load',()=>{setTimeout(removeSection,1200);setInterval(removeSection,1000)});
</script></body></html>
