<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Live Updating Mobile Roster Tracker</title><style>html,body{margin:0;width:100%;height:100%;background:#0f7b3f;overflow:auto}iframe{border:0;width:100%;min-height:100vh;display:block}</style></head><body><iframe id="tracker" src="roster-mobile-v28.html?v=30"></iframe><script>
const f=document.getElementById('tracker');
function getDocs(){const d1=f.contentDocument;if(!d1)return{};const inner=d1.querySelector('iframe');const d2=inner&&inner.contentDocument?inner.contentDocument:d1;const w2=inner&&inner.contentWindow?inner.contentWindow:f.contentWindow;return{outer:d1,d:d2,w:w2,inner}}
function removePointsSection(d){if(!d)return;const pointTeams=d.getElementById('pointTeams');if(pointTeams){const box=pointTeams.closest('.wide')||pointTeams.closest('div');if(box)box.remove()}[...d.querySelectorAll('h2,h3')].forEach(h=>{if((h.textContent||'').toLowerCase().includes('teams creating points')){const box=h.closest('.wide')||h.closest('div');if(box)box.remove();else h.remove()}});[...d.querySelectorAll('.wide,.grid>div')].forEach(box=>{if((box.textContent||'').toLowerCase().includes('teams creating points'))box.remove()})}
function refreshScores(){const {d,w}=getDocs();if(!d||!w)return;try{if(typeof w.refresh==='function')w.refresh()}catch(e){}try{if(typeof w.loadScores==='function')w.loadScores()}catch(e){}try{if(typeof w.load==='function')w.load()}catch(e){}const btn=d.getElementById('refresh')||d.getElementById('refreshTop');if(btn)btn.click();}
function touchUp(){const {d}=getDocs();if(!d)return;removePointsSection(d);let stamp=d.getElementById('liveUpdateNote');if(!stamp){stamp=d.createElement('div');stamp.id='liveUpdateNote';stamp.style.cssText='font-size:11px;color:#ecfff2;background:#073b4c;padding:7px 10px;border-radius:999px;margin:6px 8px;text-align:center;font-weight:900';stamp.textContent='Live scores auto-refresh every 30 seconds';const main=d.querySelector('main')||d.body;main.prepend(stamp)}try{f.style.height=d.documentElement.scrollHeight+'px'}catch(e){}}
f.addEventListener('load',()=>{setTimeout(()=>{refreshScores();touchUp()},1200);setInterval(refreshScores,30000);setInterval(touchUp,1500)});
</script></body></html>
