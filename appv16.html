<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><meta http-equiv="Pragma" content="no-cache"><meta http-equiv="Expires" content="0"><title>World Cup Champions</title><style>*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#0f7b3f;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.winnerTop{position:relative;z-index:99999;width:100%;padding:20px 14px;text-align:center;background:linear-gradient(135deg,#fff9d6,#ffd700);border-bottom:5px solid #b88700;color:#4b3500;box-shadow:0 8px 24px rgba(0,0,0,.35)}.winnerTitle{font-size:clamp(24px,6vw,38px);font-weight:1000;line-height:1.1}.winnerGroup{margin-top:10px;font-size:clamp(17px,4.5vw,24px);font-weight:900;line-height:1.3}.trophy{display:inline-block;filter:drop-shadow(0 2px 2px rgba(0,0,0,.25))}iframe{display:block;border:0;width:100%;height:calc(100vh - 155px);min-height:650px}.piece{position:fixed;top:-12vh;z-index:100000;pointer-events:none;font-size:24px;animation:fall var(--t) linear var(--d) forwards}@keyframes fall{to{transform:translate3d(var(--x),115vh,0) rotate(960deg);opacity:.15}}</style></head><body><header class="winnerTop"><div class="winnerTitle">🇪🇸 SPAIN WON THE FIFA WORLD CUP! <span class="trophy">🏆</span></div><div class="winnerGroup">🎉 FRIEND LEADERBOARD WINNERS:<br>Keith, Susie, Henry, Thomas &amp; Barney <span class="trophy">🏆</span></div></header><iframe src="roster-mobile-v26.html?winner=spain&v=20260719-1" title="World Cup friend tracker"></iframe><script>const icons=['🎉','🎊','✨','⭐','🏆','🇪🇸'];for(let i=0;i<140;i++){const p=document.createElement('span');p.className='piece';p.textContent=icons[i%icons.length];p.style.left=Math.random()*100+'vw';p.style.setProperty('--x',(Math.random()-.5)*50+'vw');p.style.setProperty('--t',3.8+Math.random()*4+'s');p.style.setProperty('--d',Math.random()*1.8+'s');document.body.appendChild(p)}setTimeout(()=>document.querySelectorAll('.piece').forEach(x=>x.remove()),11000)</script></body></html>
