<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>World Cup 2026 Friend Tracker v16</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0f7b3f}iframe{border:0;width:100%;height:100%;display:block}</style></head><body><iframe id="tracker" src="appv15.html?v=16"></iframe><script>
const frame=document.getElementById('tracker');
function normName(x){return String(x||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9 ]/g,' ').replace(/\s+/g,' ').trim();}
function installTournamentStatus(){
  const w=frame.contentWindow,d=frame.contentDocument;if(!w||!d)return;
  const cards=d.querySelector('.cards'); if(!cards)return;
  let card=d.getElementById('tournamentStatusCard');
  if(!card){
    card=d.createElement('div'); card.className='card'; card.id='tournamentStatusCard';
    card.innerHTML='<h3>🏁 Tournament Status</h3><div class="big" id="stillInCount">—</div><div class="txt" id="tournamentStatusText">Tracks still in vs eliminated teams once standings are decided</div>';
    cards.appendChild(card);
    cards.style.gridTemplateColumns='repeat(5,1fr)';
    const style=d.createElement('style'); style.textContent='@media(max-width:1100px){.cards{grid-template-columns:repeat(3,1fr)!important}}@media(max-width:700px){.cards{grid-template-columns:1fr!important}}'; d.head.appendChild(style);
  }
  updateTournamentStatus();
}
function updateTournamentStatus(){
  const w=frame.contentWindow,d=frame.contentDocument;if(!w||!d||!w.groups||!w.status)return;
  const seen={},teams=[];
  w.groups.forEach(g=>(g.teams||[]).forEach(t=>{const n=normName(t); if(!seen[n]){seen[n]=true; teams.push(t);}}));
  let eliminated=[],still=[],notStarted=[];
  teams.forEach(t=>{let s=''; try{s=w.status(t).txt||''}catch(e){} if(s.includes('Eliminated')) eliminated.push(t); else {still.push(t); if(s.includes('Not Played')) notStarted.push(t);} });
  const stillEl=d.getElementById('stillInCount'), textEl=d.getElementById('tournamentStatusText');
  if(stillEl) stillEl.textContent=still.length+' Still In';
  if(textEl) textEl.textContent='Eliminated: '+eliminated.length+' • Not played yet: '+notStarted.length+' • Total picked teams: '+teams.length;
}
frame.addEventListener('load',()=>{setTimeout(installTournamentStatus,600);setInterval(()=>{try{installTournamentStatus();updateTournamentStatus();}catch(e){}},2000);});
</script></body></html>
