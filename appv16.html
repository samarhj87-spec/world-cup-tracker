<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><meta http-equiv="Pragma" content="no-cache"><meta http-equiv="Expires" content="0"><title>World Cup 2026 Friend Tracker v16</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0f7b3f;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.winnerTop{position:relative;z-index:99999;width:100%;padding:12px 10px;text-align:center;background:linear-gradient(135deg,#fff7c2,#ffd700);border-bottom:3px solid #b88700;color:#493300;box-shadow:0 4px 14px rgba(0,0,0,.28)}.winnerTitle{font-size:clamp(19px,5vw,30px);font-weight:1000;line-height:1.15}.winnerGroup{margin-top:5px;font-size:clamp(14px,3.8vw,20px);font-weight:900;line-height:1.25}.trophy{display:inline-block;filter:drop-shadow(0 2px 2px rgba(0,0,0,.25))}iframe{border:0;width:100%;height:calc(100% - 105px);display:block}.piece{position:fixed;top:-10vh;z-index:100000;pointer-events:none;font-size:22px;animation:fall var(--t) linear var(--d) forwards}@keyframes fall{to{transform:translate3d(var(--x),112vh,0) rotate(900deg);opacity:.1}}</style></head><body><header class="winnerTop"><div class="winnerTitle">🇪🇸 Spain Won the FIFA World Cup! <span class="trophy">🏆</span></div><div class="winnerGroup">Keith, Susie, Henry, Thomas &amp; Barney <span class="trophy">🏆</span></div></header><iframe id="tracker" src="appv15.html?v=16"></iframe><script>
const frame=document.getElementById('tracker');
function normName(x){return String(x||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9 ]/g,' ').replace(/\s+/g,' ').trim();}
function installTournamentStatus(){
  const w=frame.contentWindow,d=frame.contentDocument;if(!w||!d)return;
  const cards=d.querySelector('.cards'); if(!cards)return;
  let card=d.getElementById('tournamentStatusCard');
  if(!card){
    card=d.createElement('div'); card.className='card'; card.id='tournamentStatusCard';
    card.innerHTML='<h3>🏁 Tournament Status</h3><div class="big" id="stillInCount">—</div><div class="txt" id="tournamentStatusText">Tracks still in vs eliminated teams once standings are decided</div>';
    cards.appendChild(card);
    cards.style.gridTemplateColumns='repeat(5,1fr)';
    const style=d.createElement('style'); style.textContent='@media(max-width:1100px){.cards{grid-template-columns:repeat(3,1fr)!important}}@media(max-width:700px){.cards{grid-template-columns:1fr!important}}'; d.head.appendChild(style);
  }
  updateTournamentStatus();
}
function updateTournamentStatus(){
  const w=frame.contentWindow,d=frame.contentDocument;if(!w||!d||!w.groups||!w.status)return;
  const seen={},teams=[];
  w.groups.forEach(g=>(g.teams||[]).forEach(t=>{const n=normName(t); if(!seen[n]){seen[n]=true; teams.push(t);}}));
  let eliminated=[],still=[],notStarted=[];
  teams.forEach(t=>{let s=''; try{s=w.status(t).txt||''}catch(e){} if(s.includes('Eliminated')) eliminated.push(t); else {still.push(t); if(s.includes('Not Played')) notStarted.push(t);} });
  const stillEl=d.getElementById('stillInCount'), textEl=d.getElementById('tournamentStatusText');
  if(stillEl) stillEl.textContent=still.length+' Still In';
  if(textEl) textEl.textContent='Eliminated: '+eliminated.length+' • Not played yet: '+notStarted.length+' • Total picked teams: '+teams.length;
}
frame.addEventListener('load',()=>{setTimeout(installTournamentStatus,600);setInterval(()=>{try{installTournamentStatus();updateTournamentStatus();}catch(e){}},2000);});
const icons=['🎉','🎊','✨','⭐','🇪🇸'];for(let i=0;i<90;i++){const p=document.createElement('span');p.className='piece';p.textContent=icons[i%icons.length];p.style.left=Math.random()*100+'vw';p.style.setProperty('--x',(Math.random()-.5)*40+'vw');p.style.setProperty('--t',3.2+Math.random()*3.2+'s');p.style.setProperty('--d',Math.random()*1.4+'s');document.body.appendChild(p)}setTimeout(()=>document.querySelectorAll('.piece').forEach(x=>x.remove()),9000);
</script></body></html>
