<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>World Cup Mobile Roster Tracker</title><style>html,body{margin:0;width:100%;height:100%;background:#0f7b3f;overflow:auto}iframe{border:0;width:100%;min-height:100vh;display:block}</style></head><body><iframe id="tracker" src="roster-mobile-v61.html?v=65"></iframe><script>
const frame=document.getElementById('tracker');
function norm(x){return String(x||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/&/g,'and').replace(/[^a-z0-9 ]/g,' ').replace(/\s+/g,' ').trim()}
const ALIVE=['Canada','Brazil','Paraguay','Netherlands','Morocco','Ivory Coast','Côte d Ivoire','Norway','France','Sweden','Mexico','Ecuador','England','DR Congo','Congo Dr','Belgium','Senegal','United States','USA','Bosnia','Bosnia-Herzegovina','Bosnia and Herzegovina','Spain','Austria','Portugal','Croatia','Switzerland','Algeria','Australia','Egypt','Argentina','Cape Verde','Colombia','Ghana'];
const ELIM=['South Africa','Japan','Germany','Czechia','South Korea','Qatar','Haiti','Scotland','Turkey','Türkiye','Curacao','Curaçao','Tunisia','Iran','New Zealand','Saudi Arabia','Uruguay','Iraq','Jordan','Uzbekistan','Panama'];
let CHAMPION='';
function hit(list,team){let t=norm(team);return list.some(x=>{let n=norm(x);return t===n||t.includes(n)||n.includes(t)})}
function status(team){if(CHAMPION&&hit([CHAMPION],team))return ['🏆 Champion','championStatus'];if(CHAMPION)return ['❌ Eliminated','eliminatedStatus'];if(hit(ELIM,team))return ['❌ Eliminated','eliminatedStatus'];return hit(ALIVE,team)?['✅ Still Alive','aliveStatus']:['❌ Eliminated','eliminatedStatus']}
function docs(){try{let d=frame.contentDocument,w=frame.contentWindow;for(let i=0;i<10;i++){let inner=d&&d.querySelector?d.querySelector('iframe'):null;if(!inner||!inner.contentDocument)break;d=inner.contentDocument;w=inner.contentWindow}return{d,w}}catch(e){return{}}}
function addStyle(d){if(!d||d.getElementById('hardRosterStatusStyle'))return;let s=d.createElement('style');s.id='hardRosterStatusStyle';s.textContent=`#groups .rosterTeam,#groups .tile,#groups .teamPill,#groups .rosterStatus,.fifaStatusBadge{animation:none!important;transition:none!important}.fifaStatusBadge,.teamPickFifaStatus{display:inline-block!important;margin:5px 4px 0 0!important;border-radius:999px!important;padding:6px 9px!important;font-size:11px!important;font-weight:1000!important;line-height:1!important}.aliveStatus{background:#dcfce7!important;color:#087443!important;border:1px solid #86efac!important}.eliminatedStatus{background:#fee2e2!important;color:#b42318!important;border:1px solid #fecaca!important}.championStatus{background:#fef3c7!important;color:#92400e!important;border:1px solid #fbbf24!important;box-shadow:none!important}#groups .fifaAlive{border-color:#86efac!important;background:#f0fdf4!important}#groups .fifaEliminated{border-color:#fecaca!important;background:#fff7f7!important;opacity:1!important}#groups .fifaChampion{border-color:#fbbf24!important;background:#fff7d6!important}`;d.head.appendChild(s)}
function teamFrom(el){let clone=el.cloneNode(true);clone.querySelectorAll('.fifaStatusBadge,.teamPickFifaStatus,.rosterStatus,.rosterRecord,.rosterScore,.muted').forEach(x=>x.remove());let txt=(clone.textContent||'').replace(/✅ Still Alive|❌ Eliminated|🏆 Champion/g,'').replace(/⚽/g,'').trim();txt=txt.split('\n')[0].split('•')[0].trim();return txt}
function apply(){const {d}=docs();if(!d)return;addStyle(d);let groups=d.getElementById('groups');if(!groups)return;
 groups.querySelectorAll('.rosterTeam').forEach(card=>{let nm=card.querySelector('.rosterTeamName');let team=nm?nm.textContent.replace('⚽','').trim():teamFrom(card);let st=status(team);let badge=card.querySelector('.rosterStatus')||card.querySelector('.fifaStatusBadge');if(!badge){badge=d.createElement('span');badge.className='fifaStatusBadge';card.appendChild(badge)}badge.textContent=st[0];badge.classList.remove('aliveStatus','eliminatedStatus','championStatus');badge.classList.add(st[1]);card.classList.remove('fifaAlive','fifaEliminated','fifaChampion');card.classList.add(st[1]==='championStatus'?'fifaChampion':st[1]==='eliminatedStatus'?'fifaEliminated':'fifaAlive')});
 groups.querySelectorAll('.tile,.teamPill').forEach(el=>{if(el.closest('.rosterTeam'))return;let team=teamFrom(el);if(!team)return;let st=status(team);let badge=el.querySelector('.teamPickFifaStatus')||el.querySelector('.fifaStatusBadge');if(!badge){badge=d.createElement('span');badge.className='teamPickFifaStatus fifaStatusBadge';el.appendChild(badge)}badge.textContent=st[0];badge.classList.remove('aliveStatus','eliminatedStatus','championStatus');badge.classList.add(st[1]);el.classList.remove('fifaAlive','fifaEliminated','fifaChampion');el.classList.add(st[1]==='championStatus'?'fifaChampion':st[1]==='eliminatedStatus'?'fifaEliminated':'fifaAlive')});
 try{frame.style.height=d.documentElement.scrollHeight+'px'}catch(e){}
}
frame.addEventListener('load',()=>{setTimeout(apply,1200);setInterval(apply,150)});
</script></body></html>
