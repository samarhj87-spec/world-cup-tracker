<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>World Cup Mobile Roster Tracker</title><style>html,body{margin:0;width:100%;height:100%;background:#0f7b3f;overflow:auto}iframe{border:0;width:100%;min-height:100vh;display:block}</style></head><body><iframe id="tracker" src="appv15.html?roster=26&hideTop=1&v=48"></iframe><script>
const f=document.getElementById('tracker');let lastFilter={friend:'all',status:'all',search:''};
function safeDoc(){try{return{d:f.contentDocument,w:f.contentWindow}}catch(e){return{}}}
function cleanTeam(x){return String(x||'').replace('⚽','').trim()}function norm(x){return String(x||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/&/g,'and').replace(/[^a-z0-9 ]/g,' ').replace(/\s+/g,' ').trim()}
function groupName(w,g){try{return w.gname(g.group||g)}catch(e){return (g.friends||[]).join(', ')||g.group||g}}function countryGroups(w){try{return w.fGroups?w.fGroups():w.groups||[]}catch(e){return w.groups||[]}}
function syncControls(d,fromId){[['search','sSearch'],['friend','sFriend'],['status','sStatus'],['tz','sTz']].forEach(([a,b])=>{const x=d.getElementById(a),y=d.getElementById(b);if(!x||!y)return;const src=(fromId===b)?y:(fromId===a)?x:(y.value&&y.value!=='all'?y:x);const dst=src===x?y:x;if(src.value!==dst.value){dst.value=src.value;dst.dispatchEvent(new Event('input',{bubbles:true}));dst.dispatchEvent(new Event('change',{bubbles:true}));}})}
function readFilters(d){const f1=d.getElementById('friend'),sf=d.getElementById('sFriend'),st1=d.getElementById('status'),sst=d.getElementById('sStatus'),q1=d.getElementById('search'),sq=d.getElementById('sSearch');const friend=(sf&&sf.value&&sf.value!=='all')?sf.value:(f1&&f1.value?f1.value:'all');const status=(sst&&sst.value&&sst.value!=='all')?sst.value:(st1&&st1.value?st1.value:'all');const search=(sq&&sq.value?sq.value:(q1&&q1.value?q1.value:''));lastFilter={friend,status,search};return lastFilter}
function statusMatches(s,state){if(!s||s==='all')return true;let n=norm(s);if(['post','complete','completed','final','finished'].includes(n))return state==='post';if(['pre','upcoming','scheduled'].includes(n))return state==='pre';if(['in','live'].includes(n))return state==='in';return s===state}function groupTeamSet(w,g){if(!g||g==='all')return null;let x=(w.groups||[]).find(a=>a.group===g);return new Set(((x&&x.teams)||[]).map(norm))}
function fmtTime(d,w,date){try{const tz=(d.getElementById('sTz')||d.getElementById('tz')||{}).value||Intl.DateTimeFormat().resolvedOptions().timeZone;return new Intl.DateTimeFormat('en-US',{weekday:'short',month:'short',day:'numeric',hour:'numeric',minute:'2-digit',timeZone:tz,timeZoneName:'short'}).format(new Date(date))}catch(e){return new Date(date).toLocaleString()}}
function statusText(m){return m.state==='in'?'LIVE':m.state==='post'?'FINAL':'UPCOMING'}function scoreText(m){if(m.state==='pre')return `${m.homeTeam} 0 - 0 ${m.awayTeam}`;let win='';if(Number(m.homeScore)>Number(m.awayScore))win=m.homeTeam;if(Number(m.awayScore)>Number(m.homeScore))win=m.awayTeam;return `${m.homeTeam} ${m.homeScore} - ${m.awayScore} ${m.awayTeam}${win?'<div class="wcWinner">Winner: '+win+'</div>':''}`}function matchPts(m,t){if(m.state==='pre')return 0;let hs=Number(m.homeScore||0),as=Number(m.awayScore||0),home=t===m.homeTeam;if(hs===as)return 1;return (home&&hs>as)||(!home&&as>hs)?3:0}
function removeSections(d){if(!d)return;d.querySelectorAll('.top,.scorebar').forEach(el=>el.remove());d.querySelectorAll('#chart,#pointTeams').forEach(el=>{let box=el.closest('.grid>div')||el.closest('.wide')||el.closest('div');box?box.remove():el.remove()});[...d.querySelectorAll('h1,h2,h3')].forEach(el=>{let txt=(el.textContent||'').toLowerCase();if(txt.includes('winning teams by group')||txt.includes('teams creating points')){let box=el.closest('.grid>div')||el.closest('.wide')||el.closest('div')||el;box.remove()}})}
function renderLeaderboard(d,w){const board=d.getElementById('leaderboard');if(!board||!w.calc)return;const gs=countryGroups(w),sc=w.calc(gs),rows=Object.keys(sc).map(k=>[k,sc[k]]).sort((a,b)=>b[1].points-a[1].points),q=(d.getElementById('search')||{}).value||'';if(q&&!rows.length){board.innerHTML='<div class="empty">No teams found for this country search.</div>';return}const max=Math.max(12,...rows.map(r=>r[1].points));board.innerHTML=rows.map((r,i)=>`<div class="row"><div><b>${i?'':'👑 '}${groupName(w,r[0])}</b><div class="muted">${q?'Filtered to '+q+' • ':''}FIFA ${r[1].fifa} • Bonus ${r[1].bonus}</div></div><div class="bar"><span style="width:${Math.min(100,r[1].points/max*100)}%"></span></div><b>${r[1].points} pts</b></div>`).join('')}
function renderRoster(d,w){const holder=d.getElementById('groups');if(!holder||!w.score||!w.status||!w.rec)return;const gs=countryGroups(w);holder.innerHTML=gs.map(g=>{const teams=(g.teams||[]).map(t=>{let sc=w.score(t),st=w.status(t),r=w.rec(t),has=(r.w||0)>0||(r.d||0)>0;return `<div class="rosterTeam ${has?'pointTeam':''}"><div class="rosterTop"><div><div class="rosterTeamName">⚽ ${t}</div><div class="rosterRecord ${has?'pointRecord':''}">${r.w}W-${r.d}D-${r.l}L • FIFA ${sc.fifa} • B ${sc.bonus}</div></div><div class="rosterScore ${has?'pointScore':''}">${sc.total}</div></div><span class="rosterStatus ${st.cls} ${has?'pointStatus':''}">${st.txt.replace('✅ ','').replace('⚠️ ','').replace('⏳ ','').replace('➖ ','').replace('🔥 ','')}</span></div>`}).join('');return `<div class="rosterGroup"><div class="rosterHead"><b>${groupName(w,g)}</b><div class="rosterMeta">${(g.friends||[]).join(' • ')} • ${(g.teams||[]).length} matching country team${(g.teams||[]).length===1?'':'s'}</div></div><div class="rosterTeams">${teams}</div></div>`}).join('')||'<div class="empty">No roster teams match this country search.</div>'}
function scheduleRows(d,w){const flt=readFilters(d),set=groupTeamSet(w,flt.friend),search=norm(flt.search);return (w.matches||[]).slice().sort((a,b)=>new Date(a.date)-new Date(b.date)).filter(m=>{if(!statusMatches(flt.status,m.state))return false;if(set&&!(set.has(norm(m.homeTeam))||set.has(norm(m.awayTeam))))return false;if(search&&!(norm(m.homeTeam).includes(search)||norm(m.awayTeam).includes(search)))return false;return true})}
function renderSchedule(d,w){const tb=d.getElementById('tbody');if(!tb||!w.matches)return;const rows=scheduleRows(d,w),flt=lastFilter,gs=flt.friend&&flt.friend!=='all'?(w.groups||[]).filter(g=>g.group===flt.friend):(w.groups||[]);function impact(m){let out=[];[m.homeTeam,m.awayTeam].forEach(t=>{let gr=[];try{gr=w.picked(t,gs)}catch(e){}gr.forEach(g=>out.push({g,team:t,pts:matchPts(m,t)}))});return out.length?out.map(x=>`<span class="impactPill ${x.pts?'':'zero'}">${w.gname?w.gname(x.g):x.g}: ${x.team} • ${x.pts} pts</span>`).join(''):'<span class="wcSmall">No friend impact</span>'}tb.innerHTML=rows.length?rows.map(m=>`<tr><td><div class="wcDate">${fmtTime(d,w,m.date)}</div></td><td><div class="wcMatch">${m.homeTeam} vs ${m.awayTeam}</div></td><td><div class="wcScore">${scoreText(m)}</div></td><td><div class="wcStatus">${statusText(m)}</div><div class="wcSmall">${m.state==='post'?'FT':m.state==='in'?'Live':'Scheduled'}</div></td><td>${impact(m)}</td><td><div class="wcVenue">${m.venue||''}</div></td></tr>`).join(''):`<tr><td colspan="6"><div class="emptySchedule">No schedule matches found for the selected filters.</div></td></tr>`;const sched=d.getElementById('schedule');if(sched&&!sched.querySelector('.filterNote')){let note=d.createElement('div');note.className='muted filterNote';note.textContent='Schedule follows your Friend, Match Status, and Team Search filters.';let h=sched.querySelector('h2');h&&h.insertAdjacentElement('afterend',note)}}
function injectStyle(d){let s=d.getElementById('mobile-v48-style');if(s)return;s=d.createElement('style');s.id='mobile-v48-style';s.textContent=`.top,.scorebar,#chart,#pointTeams{display:none!important;height:0!important;min-height:0!important;margin:0!important;padding:0!important;overflow:hidden!important}html,body{overflow-x:hidden!important;max-width:100%!important;height:auto!important}.hero .ball{display:none!important}.hero{grid-template-columns:1fr!important;border-radius:16px!important;margin-bottom:8px!important}.hero>div:first-child{padding:14px!important}.hero h1{font-size:24px!important;line-height:1.05!important;margin:0 0 6px!important}.hero p{font-size:12px!important;line-height:1.28!important;margin:4px 0!important}header,main{padding:8px!important;max-width:100%!important}.toolbar,.scheduleFilters{grid-template-columns:1fr 1fr!important;border-radius:16px!important;padding:8px!important;gap:8px!important;margin:8px 0!important}.toolbar>div:nth-child(5){grid-column:1/-1!important}.toolbar>div:nth-child(6){display:none!important}label{font-size:10px!important;margin-bottom:3px!important}select,input,button{font-size:14px!important;min-height:38px!important;width:100%!important;padding:8px!important;border-radius:12px!important}.cards{display:none!important}.grid{grid-template-columns:1fr!important;border-radius:16px!important;padding:10px!important;margin-bottom:8px!important}.wide{border-radius:16px!important;padding:10px!important;margin-bottom:8px!important}h2{font-size:19px!important;line-height:1.1!important;margin-bottom:8px!important}.muted{font-size:10px!important}.row{grid-template-columns:1fr!important;gap:4px!important;margin:8px 0!important}.bar{height:14px!important}.rosterGroup{background:#fff;border:1px solid #d9f1df;border-radius:14px;margin:8px 0;overflow:hidden;box-shadow:0 4px 10px #0001}.rosterHead{background:linear-gradient(135deg,#073b4c,#0f7b3f);color:#fff;padding:9px 10px}.rosterHead b{font-size:14px}.rosterMeta{font-size:10px;opacity:.9;margin-top:2px}.rosterTeams{display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:7px}.rosterTeam{border:1px solid #e1f1e6;border-radius:12px;padding:7px;background:#fafffb;display:block;min-width:0}.rosterTeam.pointTeam{border-color:#86efac!important;background:#f0fdf4!important;box-shadow:0 4px 10px #16a34a22!important}.rosterTop{display:flex;justify-content:space-between;gap:4px;align-items:flex-start}.rosterTeamName{font-weight:950;color:#073b4c;font-size:12px;line-height:1.15}.rosterRecord{font-size:10px;color:#667085;margin-top:2px;line-height:1.15}.rosterRecord.pointRecord{color:#087443!important;font-weight:900!important}.rosterScore{font-weight:1000;background:#fff7d6;color:#8a6200;border-radius:999px;padding:4px 6px;font-size:10px;white-space:nowrap}.rosterScore.pointScore{background:#dcfce7!important;color:#087443!important;border:1px solid #86efac!important}.rosterStatus{display:block;margin-top:5px;font-size:10px;font-weight:900;border-radius:999px;padding:4px 6px;line-height:1.1;width:fit-content;max-width:100%}.rosterStatus.pointStatus{background:#dcfce7!important;color:#087443!important;border:1px solid #86efac!important}.wcDate,.wcMatch,.wcScore,.wcStatus,.wcVenue{font-size:12px!important;line-height:1.25!important}.wcMatch,.wcStatus,.wcWinner{font-weight:1000!important;color:#087443!important}.wcSmall{font-size:10px!important;color:#667085!important;margin-top:4px!important}.impactPill{display:block;width:max-content;max-width:100%;background:#dcfce7!important;color:#087443!important;border:1px solid #86efac!important;border-radius:999px;padding:5px 8px;margin:4px 0;font-weight:1000;font-size:11px;white-space:normal}.impactPill.zero{background:#eafff0!important;color:#087443!important}.emptySchedule{padding:14px;color:#667085;font-weight:900;background:white;border:1px dashed #bfd9c7;border-radius:14px;margin:8px}@media(max-width:360px){.rosterTeams{grid-template-columns:1fr}.toolbar,.scheduleFilters{grid-template-columns:1fr!important}}`;d.head.appendChild(s)}
function install(d){if(window.__mobileV48Installed)return;['search','sSearch','friend','sFriend','status','sStatus','tz','sTz'].forEach(id=>{const el=d.getElementById(id);if(el){el.addEventListener('input',()=>setTimeout(()=>update(id),20));el.addEventListener('change',()=>setTimeout(()=>update(id),20));}});try{new MutationObserver(()=>removeSections(d)).observe(d.body,{childList:true,subtree:true});}catch(e){}window.__mobileV48Installed=true}
function applyPointColors(d,w){d.querySelectorAll('.rosterTeam').forEach(card=>{const name=card.querySelector('.rosterTeamName'),score=card.querySelector('.rosterScore'),record=card.querySelector('.rosterRecord'),status=card.querySelector('.rosterStatus');if(!name||!score||!w.rec)return;try{const r=w.rec(cleanTeam(name.textContent));if((r.w||0)>0||(r.d||0)>0){card.classList.add('pointTeam');score.classList.add('pointScore');record&&record.classList.add('pointRecord');status&&status.classList.add('pointStatus');}}catch(e){}})}
function update(fromId){const {d,w}=safeDoc();if(!d||!w)return;injectStyle(d);syncControls(d,fromId);install(d);removeSections(d);try{if(typeof w.refresh==='function'&&fromId)w.refresh()}catch(e){}renderLeaderboard(d,w);renderRoster(d,w);renderSchedule(d,w);removeSections(d);applyPointColors(d,w);try{f.style.height=d.documentElement.scrollHeight+'px'}catch(e){}}
f.addEventListener('load',()=>{setTimeout(()=>update(),250);setInterval(()=>{try{update()}catch(e){}},300)});
</script></body></html>
