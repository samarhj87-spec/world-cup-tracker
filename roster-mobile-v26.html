<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Winning Points Mobile Roster Tracker</title><style>html,body{margin:0;width:100%;height:100%;background:#0f7b3f;overflow:auto}iframe{border:0;width:100%;min-height:100vh;display:block}</style></head><body><iframe id="tracker" src="roster-mobile-v24.html?v=32"></iframe><script>
const f=document.getElementById('tracker');
function cleanTeam(x){return String(x||'').replace('⚽','').trim()}
function getDeep(){let d=f.contentDocument,w=f.contentWindow;try{for(let i=0;i<4;i++){const inner=d&&d.querySelector?d.querySelector('iframe'):null;if(!inner||!inner.contentDocument)break;d=inner.contentDocument;w=inner.contentWindow}}catch(e){}return{d,w}}
function sameDay(a,b){return a.getFullYear()==b.getFullYear()&&a.getMonth()==b.getMonth()&&a.getDate()==b.getDate()}
function fmtTime(w,d){try{return new Intl.DateTimeFormat('en-US',{hour:'numeric',minute:'2-digit',timeZone:w.id('tz').value||Intl.DateTimeFormat().resolvedOptions().timeZone}).format(new Date(d))}catch(e){return new Date(d).toLocaleTimeString([],{hour:'numeric',minute:'2-digit'})}}
function removeTeamsCreatingPoints(d){if(!d)return;const pt=d.getElementById('pointTeams');if(pt){const box=pt.closest('.wide')||pt.closest('div');if(box)box.remove();else pt.remove()}[...d.querySelectorAll('h2,h3')].forEach(h=>{if((h.textContent||'').toLowerCase().includes('teams creating points')){const box=h.closest('.wide')||h.closest('div');if(box)box.remove();else h.remove()}});[...d.querySelectorAll('.wide,.grid>div')].forEach(box=>{if((box.textContent||'').toLowerCase().includes('teams creating points'))box.remove()})}
function dailyResults(d,w){if(!d||!w||!w.matches)return;let s=d.getElementById('v26-live-style');if(!s){s=d.createElement('style');s.id='v26-live-style';s.textContent=`.rosterScore.wonPts{background:#dcfce7!important;color:#087443!important;border:1px solid #86efac!important;animation:none!important;transition:none!important}.rosterTeam.wonTeam{border-color:#86efac!important;background:#f0fdf4!important;animation:none!important;transition:none!important}.dailyLiveCard{background:linear-gradient(135deg,#073b4c,#0f7b3f)!important;color:white!important;border-radius:18px!important;padding:12px!important;margin:8px 0 10px!important;box-shadow:0 8px 16px #0002!important}.dailyLiveCard h2{color:white!important;margin:0 0 8px!important;font-size:19px!important}.dailyMatch{background:#ffffff18;border:1px solid #ffffff32;border-radius:14px;padding:9px;margin:7px 0}.dailyTeams{font-weight:1000;font-size:14px}.dailyScore{font-size:18px;font-weight:1000;color:#b7f34a}.dailyMeta{font-size:11px;color:#ecfff2;margin-top:3px}`;d.head.appendChild(s)}
let card=d.getElementById('dailyLiveResults');if(!card){card=d.createElement('section');card.id='dailyLiveResults';card.className='dailyLiveCard';const main=d.querySelector('main')||d.body;main.prepend(card)}
const today=new Date();const todays=(w.matches||[]).filter(m=>sameDay(new Date(m.date),today)).sort((a,b)=>new Date(a.date)-new Date(b.date));const pickedTeams=(w.fGroups?w.fGroups():w.groups)||[];const relevant=todays.filter(m=>{try{return w.picked(m.homeTeam,pickedTeams).length||w.picked(m.awayTeam,pickedTeams).length}catch(e){return true}});const list=relevant.length?relevant:todays;card.innerHTML='<h2>⚽ Today\'s Live Match Results</h2>'+(list.length?list.map(m=>{let state=m.state==='in'?'LIVE':m.state==='post'?'FINAL':'UPCOMING';let score=(m.state==='pre')?'vs':((m.homeScore??'')+' - '+(m.awayScore??''));return `<div class="dailyMatch"><div class="dailyTeams">${m.homeTeam} vs ${m.awayTeam}</div><div class="dailyScore">${score}</div><div class="dailyMeta">${state} • ${fmtTime(w,m.date)} • ${m.group||''}</div></div>`}).join(''):'<div class="dailyMatch">No World Cup matches listed for today yet.</div>')}
function applyGreenAndUpdate(){const {d,w}=getDeep();if(!d)return;removeTeamsCreatingPoints(d);dailyResults(d,w);try{if(w&&typeof w.refresh==='function')w.refresh()}catch(e){}try{const btn=d.getElementById('refresh')||d.getElementById('refreshTop');if(btn&&!window.__clickedOnce){window.__clickedOnce=true;btn.click()}}catch(e){}[...d.querySelectorAll('.rosterTeam')].forEach(card=>{const nameEl=card.querySelector('.rosterTeamName');const scoreEl=card.querySelector('.rosterScore');if(!nameEl||!scoreEl)return;let team=cleanTeam(nameEl.textContent);let won=false;try{won=(w.rec(team).w||0)>0}catch(e){won=(card.textContent||'').includes('1W')||(card.textContent||'').includes('2W')||(card.textContent||'').includes('3W')}if(won){scoreEl.classList.add('wonPts');card.classList.add('wonTeam')}else{scoreEl.classList.remove('wonPts');card.classList.remove('wonTeam')}});try{f.style.height=d.documentElement.scrollHeight+'px'}catch(e){}}
f.addEventListener('load',()=>{setTimeout(applyGreenAndUpdate,1500);setInterval(applyGreenAndUpdate,3000)});
</script></body></html>
