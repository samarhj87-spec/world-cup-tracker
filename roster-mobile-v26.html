<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Winning Points Mobile Roster Tracker</title><style>html,body{margin:0;width:100%;height:100%;background:#0f7b3f;overflow:auto}iframe{border:0;width:100%;min-height:100vh;display:block}</style></head><body><iframe id="tracker" src="roster-mobile-v24.html?v=37"></iframe><script>
const f=document.getElementById('tracker');
function cleanTeam(x){return String(x||'').replace('⚽','').trim()}
function getDeep(){let d=f.contentDocument,w=f.contentWindow;try{for(let i=0;i<4;i++){const inner=d&&d.querySelector?d.querySelector('iframe'):null;if(!inner||!inner.contentDocument)break;d=inner.contentDocument;w=inner.contentWindow}}catch(e){}return{d,w}}
function fmtTime(w,d){try{return new Intl.DateTimeFormat('en-US',{weekday:'short',month:'short',day:'numeric',hour:'numeric',minute:'2-digit',timeZone:w.id('tz').value||Intl.DateTimeFormat().resolvedOptions().timeZone,timeZoneName:'short'}).format(new Date(d))}catch(e){return new Date(d).toLocaleString()}}
function scoreText(m){return (m.homeScore??'')+' - '+(m.awayScore??'')}
function statusText(m){return m.state==='in'?'LIVE':m.state==='post'?'FINAL':'UPCOMING'}
function removeTeamsCreatingPoints(d){if(!d)return;const pt=d.getElementById('pointTeams');if(pt){const box=pt.closest('.wide')||pt.closest('div');if(box)box.remove();else pt.remove()}[...d.querySelectorAll('h2,h3')].forEach(h=>{if((h.textContent||'').toLowerCase().includes('teams creating points')){const box=h.closest('.wide')||h.closest('div');if(box)box.remove();else h.remove()}});[...d.querySelectorAll('.wide,.grid>div')].forEach(box=>{if((box.textContent||'').toLowerCase().includes('teams creating points'))box.remove()})}
function liveOnlyCard(d,w){if(!d||!w||!w.matches)return;let s=d.getElementById('v26-table-style');if(!s){s=d.createElement('style');s.id='v26-table-style';s.textContent=`.rosterScore.wonPts{background:#dcfce7!important;color:#087443!important;border:1px solid #86efac!important;animation:none!important;transition:none!important}.rosterTeam.wonTeam{border-color:#86efac!important;background:#f0fdf4!important;animation:none!important;transition:none!important}.dailyLiveCard,.wcScheduleCard{background:#f5fbf7!important;color:#073b4c!important;border-radius:18px!important;padding:14px!important;margin:8px 0 10px!important;box-shadow:0 8px 16px #0002!important;border-bottom:10px solid #0f7b3f!important}.dailyLiveCard h2,.wcScheduleCard h2{color:#073b4c!important;margin:0 0 10px!important;font-size:22px!important}.matchPill{display:inline-flex;flex-direction:column;gap:2px;background:#fff1f4!important;color:#b42318!important;border-radius:14px;padding:8px 10px;margin:4px;font-weight:950;font-size:12px;min-width:150px;vertical-align:top;border:1px solid #fecdd3}.matchTeams{font-weight:1000;color:#073b4c}.matchScore{font-size:17px;font-weight:1000;color:#b42318}.matchMeta{font-size:10px;color:#667085}.noLive{background:#eef7ff!important;color:#073b4c!important;border:1px solid #c7d7fe!important}.wcTableWrap{overflow:auto;border-radius:0 0 14px 14px;background:#f5fbf7}.wcTable{width:100%;border-collapse:collapse;min-width:980px;background:#f5fbf7}.wcTable th{background:#073b4c!important;color:white!important;text-align:left!important;font-size:12px!important;text-transform:uppercase!important;padding:13px 14px!important}.wcTable td{padding:14px!important;border-bottom:1px solid #d9e9df!important;vertical-align:top!important;font-size:13px!important;color:#001f24!important}.wcDate{font-weight:500;font-size:13px;line-height:1.35}.wcMatch{font-weight:1000;color:#001f24}.wcScore{line-height:1.35}.wcWinner{font-weight:1000;color:#007a3d}.wcStatus{font-weight:1000;color:#007a3d}.wcSmall{font-size:11px;color:#667085;margin-top:5px}.impactPill{display:inline-block;background:#dcfce7;color:#007a3d;border-radius:999px;padding:7px 10px;margin:4px;font-weight:1000;font-size:11px}.impactPill.zero{background:#eef7ff;color:#073b4c}.wcVenue{white-space:nowrap}.wcScheduleCard{padding:0!important;overflow:hidden}.wcScheduleCard h2{padding:14px 14px 0!important}.wcScheduleCard .muted{padding:0 14px 10px!important}`;d.head.appendChild(s)}
let card=d.getElementById('dailyLiveResults');if(!card){card=d.createElement('section');card.id='dailyLiveResults';card.className='dailyLiveCard';const main=d.querySelector('main')||d.body;main.prepend(card)}
const live=(w.matches||[]).filter(m=>m.state==='in').sort((a,b)=>new Date(a.date)-new Date(b.date));card.innerHTML='<h2>🔴 Live Matches Right Now</h2>'+(live.length?live.map(m=>`<span class="matchPill"><span class="matchTeams">${m.homeTeam} vs ${m.awayTeam}</span><span class="matchScore">${scoreText(m)}</span><span class="matchMeta">LIVE • ${fmtTime(w,m.date)}</span></span>`).join(''):'<span class="matchPill noLive"><span class="matchTeams">No live matches right now</span><span class="matchMeta">This will update when a match is live.</span></span>')}
function matchPts(m,team){if(m.state==='pre')return 0;let hs=Number(m.homeScore||0),as=Number(m.awayScore||0),isHome=team===m.homeTeam;if(hs===as)return 1;return (isHome&&hs>as)||(!isHome&&as>hs)?3:0}
function scheduleBottom(d,w){if(!d||!w||!w.matches)return;let old=d.getElementById('wcBottomSchedule');if(!old){old=d.createElement('section');old.id='wcBottomSchedule';old.className='wcScheduleCard';const main=d.querySelector('main')||d.body;main.appendChild(old)}const rows=(w.matches||[]).slice().sort((a,b)=>new Date(a.date)-new Date(b.date));const gs=(w.fGroups?w.fGroups():w.groups)||[];function impact(m){let out=[];[m.homeTeam,m.awayTeam].forEach(t=>{let gr=[];try{gr=w.picked(t,gs)}catch(e){}gr.forEach(g=>out.push({g,team:t,pts:matchPts(m,t)}))});return out.length?out.map(x=>`<span class="impactPill ${x.pts?'':'zero'}">${w.gname?w.gname(x.g):x.g}: ${x.team} • ${x.pts} pts</span>`).join(''):'<span class="wcSmall">No friend impact</span>'}function scoreCell(m){if(m.state==='pre')return '—';let winner='';if(Number(m.homeScore)>Number(m.awayScore))winner=m.homeTeam;if(Number(m.awayScore)>Number(m.homeScore))winner=m.awayTeam;return `${m.homeTeam} ${m.homeScore} - ${m.awayScore} ${m.awayTeam}${winner?'<div class="wcWinner">Winner: '+winner+'</div>':''}`}
old.innerHTML='<h2>📅 FIFA World Cup 2026 Schedule</h2><div class="muted">Full schedule shown in your selected timezone.</div><div class="wcTableWrap"><table class="wcTable"><thead><tr><th>Date / Time</th><th>Match</th><th>Score</th><th>Status</th><th>Friend Impact</th><th>Venue</th></tr></thead><tbody>'+rows.map(m=>`<tr><td><div class="wcDate">${fmtTime(w,m.date)}</div></td><td><div class="wcMatch">${m.homeTeam} vs ${m.awayTeam}</div></td><td><div class="wcScore">${scoreCell(m)}</div></td><td><div class="wcStatus">${statusText(m)}</div><div class="wcSmall">${m.state==='post'?'FT':m.state==='in'?'Live':'Scheduled'}</div></td><td>${impact(m)}</td><td><div class="wcVenue">${m.venue||''}</div></td></tr>`).join('')+'</tbody></table></div>'}
function updateAll(){const {d,w}=getDeep();if(!d)return;removeTeamsCreatingPoints(d);liveOnlyCard(d,w);scheduleBottom(d,w);try{if(w&&typeof w.refresh==='function')w.refresh()}catch(e){}try{const btn=d.getElementById('refresh')||d.getElementById('refreshTop');if(btn&&!window.__clickedOnce){window.__clickedOnce=true;btn.click()}}catch(e){}[...d.querySelectorAll('.rosterTeam')].forEach(card=>{const nameEl=card.querySelector('.rosterTeamName');const scoreEl=card.querySelector('.rosterScore');if(!nameEl||!scoreEl)return;let team=cleanTeam(nameEl.textContent);let won=false;try{won=(w.rec(team).w||0)>0}catch(e){won=(card.textContent||'').includes('1W')||(card.textContent||'').includes('2W')||(card.textContent||'').includes('3W')}if(won){scoreEl.classList.add('wonPts');card.classList.add('wonTeam')}else{scoreEl.classList.remove('wonPts');card.classList.remove('wonTeam')}});try{f.style.height=d.documentElement.scrollHeight+'px'}catch(e){}}
f.addEventListener('load',()=>{setTimeout(updateAll,1500);setInterval(updateAll,3000)});
</script></body></html>
