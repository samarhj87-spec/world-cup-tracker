<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Winning Points Mobile Roster Tracker</title><style>html,body{margin:0;width:100%;height:100%;background:#0f7b3f;overflow:auto}iframe{border:0;width:100%;min-height:100vh;display:block}</style></head><body><iframe id="tracker" src="roster-mobile-v24.html?v=36"></iframe><script>
const f=document.getElementById('tracker');
function cleanTeam(x){return String(x||'').replace('⚽','').trim()}
function getDeep(){let d=f.contentDocument,w=f.contentWindow;try{for(let i=0;i<4;i++){const inner=d&&d.querySelector?d.querySelector('iframe'):null;if(!inner||!inner.contentDocument)break;d=inner.contentDocument;w=inner.contentWindow}}catch(e){}return{d,w}}
function fmtTime(w,d){try{return new Intl.DateTimeFormat('en-US',{weekday:'short',month:'short',day:'numeric',hour:'numeric',minute:'2-digit',timeZone:w.id('tz').value||Intl.DateTimeFormat().resolvedOptions().timeZone}).format(new Date(d))}catch(e){return new Date(d).toLocaleString()}}
function scoreText(m){return (m.homeScore??'')+' - '+(m.awayScore??'')}
function removeTeamsCreatingPoints(d){if(!d)return;const pt=d.getElementById('pointTeams');if(pt){const box=pt.closest('.wide')||pt.closest('div');if(box)box.remove();else pt.remove()}[...d.querySelectorAll('h2,h3')].forEach(h=>{if((h.textContent||'').toLowerCase().includes('teams creating points')){const box=h.closest('.wide')||h.closest('div');if(box)box.remove();else h.remove()}});[...d.querySelectorAll('.wide,.grid>div')].forEach(box=>{if((box.textContent||'').toLowerCase().includes('teams creating points'))box.remove()})}
function liveOnlyCard(d,w){if(!d||!w||!w.matches)return;let s=d.getElementById('v26-extra-style');if(!s){s=d.createElement('style');s.id='v26-extra-style';s.textContent=`.rosterScore.wonPts{background:#dcfce7!important;color:#087443!important;border:1px solid #86efac!important;animation:none!important;transition:none!important}.rosterTeam.wonTeam{border-color:#86efac!important;background:#f0fdf4!important;animation:none!important;transition:none!important}.dailyLiveCard,.wcScheduleCard{background:#f5fbf7!important;color:#073b4c!important;border-radius:18px!important;padding:14px!important;margin:8px 0 10px!important;box-shadow:0 8px 16px #0002!important;border-bottom:10px solid #0f7b3f!important}.dailyLiveCard h2,.wcScheduleCard h2{color:#073b4c!important;margin:0 0 10px!important;font-size:22px!important}.matchPill{display:inline-flex;flex-direction:column;gap:2px;background:#fff1f4!important;color:#b42318!important;border-radius:14px;padding:8px 10px;margin:4px;font-weight:950;font-size:12px;min-width:150px;vertical-align:top;border:1px solid #fecdd3}.matchTeams{font-weight:1000;color:#073b4c}.matchScore{font-size:17px;font-weight:1000;color:#b42318}.matchMeta{font-size:10px;color:#667085}.noLive{background:#eef7ff!important;color:#073b4c!important;border:1px solid #c7d7fe!important}.schedDay{font-weight:1000;margin:12px 0 6px;color:#087443}.schedRow{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;background:white;border:1px solid #d9f1df;border-radius:13px;padding:8px;margin:6px 0}.schedTeams{font-size:13px;font-weight:950;color:#073b4c}.schedMeta{font-size:10px;color:#667085;margin-top:2px}.schedStatus{font-size:11px;font-weight:1000;border-radius:999px;background:#fff7d6;color:#8a6200;padding:5px 7px;white-space:nowrap}.schedStatus.live{background:#fff1f4;color:#b42318}.schedStatus.final{background:#dcfce7;color:#087443}`;d.head.appendChild(s)}
let card=d.getElementById('dailyLiveResults');if(!card){card=d.createElement('section');card.id='dailyLiveResults';card.className='dailyLiveCard';const main=d.querySelector('main')||d.body;main.prepend(card)}
const live=(w.matches||[]).filter(m=>m.state==='in').sort((a,b)=>new Date(a.date)-new Date(b.date));card.innerHTML='<h2>🔴 Live Matches Right Now</h2>'+(live.length?live.map(m=>`<span class="matchPill"><span class="matchTeams">${m.homeTeam} vs ${m.awayTeam}</span><span class="matchScore">${scoreText(m)}</span><span class="matchMeta">LIVE • ${fmtTime(w,m.date)}</span></span>`).join(''):'<span class="matchPill noLive"><span class="matchTeams">No live matches right now</span><span class="matchMeta">This will update when a match is live.</span></span>')}
function scheduleBottom(d,w){if(!d||!w||!w.matches)return;let old=d.getElementById('wcBottomSchedule');if(!old){old=d.createElement('section');old.id='wcBottomSchedule';old.className='wcScheduleCard';const main=d.querySelector('main')||d.body;main.appendChild(old)}const rows=(w.matches||[]).slice().sort((a,b)=>new Date(a.date)-new Date(b.date));let grouped={};rows.forEach(m=>{const key=new Intl.DateTimeFormat('en-US',{weekday:'short',month:'short',day:'numeric',timeZone:(w.id&&w.id('tz')&&w.id('tz').value)||Intl.DateTimeFormat().resolvedOptions().timeZone}).format(new Date(m.date));(grouped[key]=grouped[key]||[]).push(m)});old.innerHTML='<h2>📅 FIFA World Cup 2026 Schedule</h2><div class="muted">Full schedule shown in your selected timezone.</div>'+Object.keys(grouped).map(day=>'<div class="schedDay">'+day+'</div>'+grouped[day].map(m=>{const status=m.state==='in'?'LIVE':m.state==='post'?'FINAL':'UPCOMING';const cls=m.state==='in'?'live':m.state==='post'?'final':'';const score=m.state==='pre'?'':` • ${scoreText(m)}`;return `<div class="schedRow"><div><div class="schedTeams">${m.homeTeam} vs ${m.awayTeam}${score}</div><div class="schedMeta">${fmtTime(w,m.date)} ${m.group?'• '+m.group:''} ${m.venue?'• '+m.venue:''}</div></div><div class="schedStatus ${cls}">${status}</div></div>`}).join('')).join('')}
function updateAll(){const {d,w}=getDeep();if(!d)return;removeTeamsCreatingPoints(d);liveOnlyCard(d,w);scheduleBottom(d,w);try{if(w&&typeof w.refresh==='function')w.refresh()}catch(e){}try{const btn=d.getElementById('refresh')||d.getElementById('refreshTop');if(btn&&!window.__clickedOnce){window.__clickedOnce=true;btn.click()}}catch(e){}[...d.querySelectorAll('.rosterTeam')].forEach(card=>{const nameEl=card.querySelector('.rosterTeamName');const scoreEl=card.querySelector('.rosterScore');if(!nameEl||!scoreEl)return;let team=cleanTeam(nameEl.textContent);let won=false;try{won=(w.rec(team).w||0)>0}catch(e){won=(card.textContent||'').includes('1W')||(card.textContent||'').includes('2W')||(card.textContent||'').includes('3W')}if(won){scoreEl.classList.add('wonPts');card.classList.add('wonTeam')}else{scoreEl.classList.remove('wonPts');card.classList.remove('wonTeam')}});try{f.style.height=d.documentElement.scrollHeight+'px'}catch(e){}}
f.addEventListener('load',()=>{setTimeout(updateAll,1500);setInterval(updateAll,3000)});
</script></body></html>
