<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Winning Points Mobile Roster Tracker</title><style>html,body{margin:0;width:100%;height:100%;background:#0f7b3f;overflow:auto}iframe{border:0;width:100%;min-height:100vh;display:block}</style></head><body><iframe id="tracker" src="roster-mobile-v24.html?v=34"></iframe><script>
const f=document.getElementById('tracker');
function cleanTeam(x){return String(x||'').replace('⚽','').trim()}
function getDeep(){let d=f.contentDocument,w=f.contentWindow;try{for(let i=0;i<4;i++){const inner=d&&d.querySelector?d.querySelector('iframe'):null;if(!inner||!inner.contentDocument)break;d=inner.contentDocument;w=inner.contentWindow}}catch(e){}return{d,w}}
function fmtTime(w,d){try{return new Intl.DateTimeFormat('en-US',{weekday:'short',hour:'numeric',minute:'2-digit',timeZone:w.id('tz').value||Intl.DateTimeFormat().resolvedOptions().timeZone}).format(new Date(d))}catch(e){return new Date(d).toLocaleString([],{weekday:'short',hour:'numeric',minute:'2-digit'})}}
function scoreText(m){if(m.state==='pre')return 'Upcoming';return (m.homeScore??'')+' - '+(m.awayScore??'')}
function statusText(m){return m.state==='in'?'LIVE':m.state==='post'?'FINAL':'UPCOMING'}
function removeTeamsCreatingPoints(d){if(!d)return;const pt=d.getElementById('pointTeams');if(pt){const box=pt.closest('.wide')||pt.closest('div');if(box)box.remove();else pt.remove()}[...d.querySelectorAll('h2,h3')].forEach(h=>{if((h.textContent||'').toLowerCase().includes('teams creating points')){const box=h.closest('.wide')||h.closest('div');if(box)box.remove();else h.remove()}});[...d.querySelectorAll('.wide,.grid>div')].forEach(box=>{if((box.textContent||'').toLowerCase().includes('teams creating points'))box.remove()})}
function matchCard(d,w){if(!d||!w||!w.matches)return;let s=d.getElementById('match-card-style');if(!s){s=d.createElement('style');s.id='match-card-style';s.textContent=`.rosterScore.wonPts{background:#dcfce7!important;color:#087443!important;border:1px solid #86efac!important;animation:none!important;transition:none!important}.rosterTeam.wonTeam{border-color:#86efac!important;background:#f0fdf4!important;animation:none!important;transition:none!important}.dailyLiveCard{background:#f5fbf7!important;color:#073b4c!important;border-radius:18px!important;padding:14px!important;margin:8px 0 10px!important;box-shadow:0 8px 16px #0002!important;border-bottom:10px solid #0f7b3f!important}.dailyLiveCard h2{color:#073b4c!important;margin:0 0 10px!important;font-size:22px!important}.sectionLabel{font-size:12px;font-weight:1000;color:#087443;margin:8px 4px 3px;text-transform:uppercase}.matchPill{display:inline-flex;flex-direction:column;gap:2px;background:#fff7d6;color:#8a6200;border-radius:14px;padding:8px 10px;margin:4px;font-weight:950;font-size:12px;min-width:140px;vertical-align:top}.matchPill.live{background:#fff1f4!important;color:#b42318!important}.matchPill.final{background:#dcfce7!important;color:#087443!important}.matchTeams{font-weight:1000;color:#073b4c}.matchScore{font-size:14px;font-weight:1000}.matchMeta{font-size:10px;color:#667085}`;d.head.appendChild(s)}
let card=d.getElementById('dailyLiveResults');if(!card){card=d.createElement('section');card.id='dailyLiveResults';card.className='dailyLiveCard';const main=d.querySelector('main')||d.body;main.prepend(card)}
const now=new Date(),future=new Date(now.getTime()+48*3600000),past=new Date(now.getTime()-24*3600000);const all=(w.matches||[]).filter(m=>{const dt=new Date(m.date);return dt>=past&&dt<=future}).sort((a,b)=>new Date(a.date)-new Date(b.date));const pickedTeams=(w.fGroups?w.fGroups():w.groups)||[];const relevant=all.filter(m=>{try{return w.picked(m.homeTeam,pickedTeams).length||w.picked(m.awayTeam,pickedTeams).length}catch(e){return true}});const list=(relevant.length?relevant:all);const liveFinal=list.filter(m=>m.state==='in'||m.state==='post').slice(0,6);const upcoming=list.filter(m=>m.state==='pre').slice(0,6);function pill(m){let cls=m.state==='in'?'live':m.state==='post'?'final':'';return `<span class="matchPill ${cls}"><span class="matchTeams">${m.homeTeam} vs ${m.awayTeam}</span><span class="matchScore">${scoreText(m)}</span><span class="matchMeta">${statusText(m)} • ${fmtTime(w,m.date)}</span></span>`}
card.innerHTML='<h2>🔥 Live Match Results + Upcoming</h2><div class="sectionLabel">Live / Final Scores</div>'+(liveFinal.length?liveFinal.map(pill).join(''):'<span class="matchPill">No live or final results in the current window.</span>')+'<div class="sectionLabel">Upcoming Matches</div>'+(upcoming.length?upcoming.map(pill).join(''):'<span class="matchPill">No upcoming matches in the next 48 hours.</span>')}
function updateAll(){const {d,w}=getDeep();if(!d)return;removeTeamsCreatingPoints(d);matchCard(d,w);try{if(w&&typeof w.refresh==='function')w.refresh()}catch(e){}try{const btn=d.getElementById('refresh')||d.getElementById('refreshTop');if(btn&&!window.__clickedOnce){window.__clickedOnce=true;btn.click()}}catch(e){}[...d.querySelectorAll('.rosterTeam')].forEach(card=>{const nameEl=card.querySelector('.rosterTeamName');const scoreEl=card.querySelector('.rosterScore');if(!nameEl||!scoreEl)return;let team=cleanTeam(nameEl.textContent);let won=false;try{won=(w.rec(team).w||0)>0}catch(e){won=(card.textContent||'').includes('1W')||(card.textContent||'').includes('2W')||(card.textContent||'').includes('3W')}if(won){scoreEl.classList.add('wonPts');card.classList.add('wonTeam')}else{scoreEl.classList.remove('wonPts');card.classList.remove('wonTeam')}});try{f.style.height=d.documentElement.scrollHeight+'px'}catch(e){}}
f.addEventListener('load',()=>{setTimeout(updateAll,1500);setInterval(updateAll,3000)});
</script></body></html>
