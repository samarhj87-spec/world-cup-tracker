<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Winning Points Mobile Roster Tracker</title><style>html,body{margin:0;width:100%;height:100%;background:#0f7b3f;overflow:auto}iframe{border:0;width:100%;min-height:100vh;display:block}</style></head><body><iframe id="tracker" src="roster-mobile-v24.html?v=40"></iframe><script>
const f=document.getElementById('tracker');
let lastFilter={friend:'all',status:'all',search:''};
function cleanTeam(x){return String(x||'').replace('⚽','').trim()}
function norm(x){return String(x||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/&/g,'and').replace(/[^a-z0-9 ]/g,' ').replace(/\s+/g,' ').trim()}
function getDeep(){let d=f.contentDocument,w=f.contentWindow;try{for(let i=0;i<4;i++){const inner=d&&d.querySelector?d.querySelector('iframe'):null;if(!inner||!inner.contentDocument)break;d=inner.contentDocument;w=inner.contentWindow}}catch(e){}return{d,w}}
function fmtTime(w,d){try{return new Intl.DateTimeFormat('en-US',{weekday:'short',month:'short',day:'numeric',hour:'numeric',minute:'2-digit',timeZone:w.id('tz').value||Intl.DateTimeFormat().resolvedOptions().timeZone,timeZoneName:'short'}).format(new Date(d))}catch(e){return new Date(d).toLocaleString()}}
function scoreText(m){return (m.homeScore??'')+' - '+(m.awayScore??'')}
function statusText(m){return m.state==='in'?'LIVE':m.state==='post'?'FINAL':'UPCOMING'}
function readFilters(d){let f1=d.getElementById('friend'),sf=d.getElementById('sFriend'),st1=d.getElementById('status'),sst=d.getElementById('sStatus'),q1=d.getElementById('search'),sq=d.getElementById('sSearch');let friend=(sf&&sf.value&&sf.value!=='all')?sf.value:(f1&&f1.value?f1.value:'all');let status=(sst&&sst.value&&sst.value!=='all')?sst.value:(st1&&st1.value?st1.value:'all');let search=(sq&&sq.value?sq.value:(q1&&q1.value?q1.value:''));lastFilter={friend,status,search};return lastFilter}
function syncScheduleControls(d){let f1=d.getElementById('friend'),sf=d.getElementById('sFriend'),st1=d.getElementById('status'),sst=d.getElementById('sStatus'),q1=d.getElementById('search'),sq=d.getElementById('sSearch');if(f1&&sf&&sf.value==='all'&&f1.value!=='all')sf.value=f1.value;if(st1&&sst&&sst.value==='all'&&st1.value!=='all')sst.value=st1.value;if(q1&&sq&&!sq.value&&q1.value)sq.value=q1.value}
function statusMatches(selected,state){if(!selected||selected==='all')return true;let s=norm(selected);if(['post','complete','completed','final','finished'].includes(s))return state==='post';if(['pre','upcoming','scheduled'].includes(s))return state==='pre';if(['in','live'].includes(s))return state==='in';return selected===state}
function groupTeamSet(w,group){if(!group||group==='all')return null;let g=(w.groups||[]).find(x=>x.group===group);return new Set(((g&&g.teams)||[]).map(norm))}
function removeTeamsCreatingPoints(d){if(!d)return;const pt=d.getElementById('pointTeams');if(pt){const box=pt.closest('.wide')||pt.closest('div');if(box)box.remove();else pt.remove()}[...d.querySelectorAll('h2,h3')].forEach(h=>{if((h.textContent||'').toLowerCase().includes('teams creating points')){const box=h.closest('.wide')||h.closest('div');if(box)box.remove();else h.remove()}});[...d.querySelectorAll('.wide,.grid>div')].forEach(box=>{if((box.textContent||'').toLowerCase().includes('teams creating points'))box.remove()})}
function installFilterWatch(d){if(window.__filterWatchInstalled)return;['friend','sFriend','status','sStatus','search','sSearch','tz','sTz'].forEach(id=>{const el=d.getElementById(id);if(el){el.addEventListener('change',()=>setTimeout(updateAll,20));el.addEventListener('input',()=>setTimeout(updateAll,20));}});window.__filterWatchInstalled=true}
function injectStyle(d){let s=d.getElementById('v26-force-filter-style');if(s)return;s=d.createElement('style');s.id='v26-force-filter-style';s.textContent=`.rosterScore.wonPts{background:#dcfce7!important;color:#087443!important;border:1px solid #86efac!important;animation:none!important;transition:none!important}.rosterTeam.wonTeam{border-color:#86efac!important;background:#f0fdf4!important;animation:none!important;transition:none!important}.dailyLiveCard{background:#f5fbf7!important;color:#073b4c!important;border-radius:18px!important;padding:14px!important;margin:8px 0 10px!important;box-shadow:0 8px 16px #0002!important;border-bottom:10px solid #0f7b3f!important}.dailyLiveCard h2{color:#073b4c!important;margin:0 0 10px!important;font-size:22px!important}.matchPill{display:inline-flex;flex-direction:column;gap:2px;background:#fff1f4!important;color:#b42318!important;border-radius:14px;padding:8px 10px;margin:4px;font-weight:950;font-size:12px;min-width:150px;vertical-align:top;border:1px solid #fecdd3}.matchTeams{font-weight:1000;color:#073b4c}.matchScore{font-size:17px;font-weight:1000;color:#b42318}.matchMeta{font-size:10px;color:#667085}.noLive{background:#eef7ff!important;color:#073b4c!important;border:1px solid #c7d7fe!important}.wcTable{width:100%!important;border-collapse:collapse!important;min-width:1120px!important;background:#f5fbf7!important;font-size:14px!important}.wcTable th{background:#073b4c!important;color:white!important;text-align:left!important;font-size:13px!important;text-transform:uppercase!important;padding:14px 16px!important;font-weight:1000!important}.wcTable td{padding:16px!important;border-bottom:1px solid #ddeee4!important;vertical-align:top!important;color:#001f24!important;background:#f5fbf7!important;line-height:1.35!important}.wcDate{font-size:14px;line-height:1.35}.wcMatch{font-size:14px;font-weight:1000;color:#001f24}.wcScore{font-size:14px;line-height:1.35}.wcWinner{font-weight:1000;color:#007a3d}.wcStatus{font-weight:1000;color:#007a3d;font-size:14px}.wcSmall{font-size:12px;color:#667085;margin-top:6px}.impactPill{display:block;width:max-content;max-width:100%;background:#dcfce7;color:#007a3d;border-radius:999px;padding:7px 12px;margin:5px 0;font-weight:1000;font-size:13px;white-space:normal}.impactPill.zero{background:#eafff0;color:#007a3d}.wcVenue{font-size:14px;white-space:nowrap}.emptySchedule{padding:18px;color:#667085;font-weight:900;background:white;border:1px dashed #bfd9c7;border-radius:14px;margin:10px}`;d.head.appendChild(s)}
function liveOnlyCard(d,w){if(!d||!w||!w.matches)return;let card=d.getElementById('dailyLiveResults');if(!card){card=d.createElement('section');card.id='dailyLiveResults';card.className='dailyLiveCard';const main=d.querySelector('main')||d.body;main.prepend(card)}const live=(w.matches||[]).filter(m=>m.state==='in').sort((a,b)=>new Date(a.date)-new Date(b.date));card.innerHTML='<h2>🔴 Live Matches Right Now</h2>'+(live.length?live.map(m=>`<span class="matchPill"><span class="matchTeams">${m.homeTeam} vs ${m.awayTeam}</span><span class="matchScore">${scoreText(m)}</span><span class="matchMeta">LIVE • ${fmtTime(w,m.date)}</span></span>`).join(''):'<span class="matchPill noLive"><span class="matchTeams">No live matches right now</span><span class="matchMeta">This will update when a match is live.</span></span>')}
function matchPts(m,team){if(m.state==='pre')return 0;let hs=Number(m.homeScore||0),as=Number(m.awayScore||0),isHome=team===m.homeTeam;if(hs===as)return 1;return (isHome&&hs>as)||(!isHome&&as>hs)?3:0}
function filteredRows(d,w){syncScheduleControls(d);const f=readFilters(d);const teamSet=groupTeamSet(w,f.friend);const search=norm(f.search);return (w.matches||[]).slice().sort((a,b)=>new Date(a.date)-new Date(b.date)).filter(m=>{if(!statusMatches(f.status,m.state))return false;if(teamSet&&!(teamSet.has(norm(m.homeTeam))||teamSet.has(norm(m.awayTeam))))return false;if(search&&!(norm(m.homeTeam).includes(search)||norm(m.awayTeam).includes(search)))return false;return true})}
function scheduleHTML(d,w){const rows=filteredRows(d,w);const f=lastFilter;const gs=f.friend&&f.friend!=='all'?(w.groups||[]).filter(g=>g.group===f.friend):(w.groups||[]);function impact(m){let out=[];[m.homeTeam,m.awayTeam].forEach(t=>{let gr=[];try{gr=w.picked(t,gs)}catch(e){}gr.forEach(g=>out.push({g,team:t,pts:matchPts(m,t)}))});return out.length?out.map(x=>`<span class="impactPill ${x.pts?'':'zero'}">${w.gname?w.gname(x.g):x.g}: ${x.team} • ${x.pts} pts</span>`).join(''):'<span class="wcSmall">No friend impact</span>'}function scoreCell(m){if(m.state==='pre')return `${m.homeTeam} 0 - 0 ${m.awayTeam}`;let winner='';if(Number(m.homeScore)>Number(m.awayScore))winner=m.homeTeam;if(Number(m.awayScore)>Number(m.homeScore))winner=m.awayTeam;return `${m.homeTeam} ${m.homeScore} - ${m.awayScore} ${m.awayTeam}${winner?'<div class="wcWinner">Winner: '+winner+'</div>':''}`}
return rows.length?rows.map(m=>`<tr><td><div class="wcDate">${fmtTime(w,m.date)}</div></td><td><div class="wcMatch">${m.homeTeam} vs ${m.awayTeam}</div></td><td><div class="wcScore">${scoreCell(m)}</div></td><td><div class="wcStatus">${statusText(m)}</div><div class="wcSmall">${m.state==='post'?'FT':m.state==='in'?'Live':'Scheduled'}</div></td><td>${impact(m)}</td><td><div class="wcVenue">${m.venue||''}</div></td></tr>`).join(''):`<tr><td colspan="6"><div class="emptySchedule">No schedule matches found for the selected filters.</div></td></tr>`}
function scheduleBottom(d,w){if(!d||!w||!w.matches)return;let tb=d.getElementById('tbody');if(tb){tb.innerHTML=scheduleHTML(d,w)}let old=d.getElementById('wcBottomSchedule');if(old)old.remove();let sched=d.getElementById('schedule');if(sched){let note=sched.querySelector('.filterNote');if(!note){note=d.createElement('div');note.className='muted filterNote';note.textContent='Schedule follows your Friend, Match Status, and Team Search filters.';let h=sched.querySelector('h2');h&&h.insertAdjacentElement('afterend',note)}}}
function updateAll(){const {d,w}=getDeep();if(!d)return;injectStyle(d);installFilterWatch(d);removeTeamsCreatingPoints(d);liveOnlyCard(d,w);scheduleBottom(d,w);try{if(w&&typeof w.refresh==='function')w.refresh()}catch(e){}try{const btn=d.getElementById('refresh')||d.getElementById('refreshTop');if(btn&&!window.__clickedOnce){window.__clickedOnce=true;btn.click()}}catch(e){}[...d.querySelectorAll('.rosterTeam')].forEach(card=>{const nameEl=card.querySelector('.rosterTeamName');const scoreEl=card.querySelector('.rosterScore');if(!nameEl||!scoreEl)return;let team=cleanTeam(nameEl.textContent);let won=false;try{won=(w.rec(team).w||0)>0}catch(e){won=(card.textContent||'').includes('1W')||(card.textContent||'').includes('2W')||(card.textContent||'').includes('3W')}if(won){scoreEl.classList.add('wonPts');card.classList.add('wonTeam')}else{scoreEl.classList.remove('wonPts');card.classList.remove('wonTeam')}});try{f.style.height=d.documentElement.scrollHeight+'px'}catch(e){}}
f.addEventListener('load',()=>{setTimeout(updateAll,1500);setInterval(updateAll,1200)});
</script></body></html>
