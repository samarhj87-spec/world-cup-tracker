<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>World Cup Mobile Roster Tracker</title>
<style>html,body{margin:0;width:100%;height:100%;background:#0f7b3f;overflow:auto}iframe{border:0;width:100%;min-height:100vh;display:block}</style>
</head>
<body>
<iframe id="tracker" src="appv15.html?roster=26&hideTop=1&v=46"></iframe>
<script>
const f=document.getElementById('tracker');
function safeDoc(){try{return{d:f.contentDocument,w:f.contentWindow}}catch(e){return{}}}
function cleanTeam(x){return String(x||'').replace('⚽','').trim()}
function groupName(w,g){try{return w.gname(g.group||g)}catch(e){return (g.friends||[]).join(', ')||g.group||g}}
function countryGroups(w){try{return w.fGroups?w.fGroups():w.groups||[]}catch(e){return w.groups||[]}}
function syncControls(d,fromId){[['search','sSearch'],['friend','sFriend'],['status','sStatus'],['tz','sTz']].forEach(([a,b])=>{const x=d.getElementById(a),y=d.getElementById(b);if(!x||!y)return;const src=(fromId===b)?y:(fromId===a)?x:(y.value&&y.value!=='all'?y:x);const dst=src===x?y:x;if(src.value!==dst.value){dst.value=src.value;dst.dispatchEvent(new Event('input',{bubbles:true}));dst.dispatchEvent(new Event('change',{bubbles:true}));}})}
function removeSections(d){
  if(!d)return;
  d.querySelectorAll('.top,.scorebar,#chart,#pointTeams').forEach(el=>{let box=el.closest('section')||el.closest('.grid>div')||el.closest('.wide')||el.closest('div'); if(box)box.remove(); else el.remove();});
  [...d.querySelectorAll('h1,h2,h3,div,section')].forEach(el=>{const txt=(el.textContent||'').toLowerCase(); if(txt.includes('winning teams by group')||txt.includes('teams creating points')){let box=el.closest('section')||el.closest('.grid>div')||el.closest('.wide')||el; box.remove();}});
}
function renderLeaderboard(d,w){const board=d.getElementById('leaderboard');if(!board||!w.calc)return;const gs=countryGroups(w);const sc=w.calc(gs);const rows=Object.keys(sc).map(k=>[k,sc[k]]).sort((a,b)=>b[1].points-a[1].points);const q=(d.getElementById('search')||{}).value||'';if(q&&!rows.length){board.innerHTML='<div class="empty">No teams found for this country search.</div>';return}const max=Math.max(12,...rows.map(r=>r[1].points));board.innerHTML=rows.map((r,i)=>`<div class="row"><div><b>${i?'':'👑 '}${groupName(w,r[0])}</b><div class="muted">${q?'Filtered to '+q+' • ':''}FIFA ${r[1].fifa} • Bonus ${r[1].bonus}</div></div><div class="bar"><span style="width:${Math.min(100,r[1].points/max*100)}%"></span></div><b>${r[1].points} pts</b></div>`).join('')}
function renderRoster(d,w){const holder=d.getElementById('groups');if(!holder||!w.score||!w.status||!w.rec)return;const gs=countryGroups(w);holder.innerHTML=gs.map(g=>{const teams=(g.teams||[]).map(t=>{let sc=w.score(t),st=w.status(t),r=w.rec(t);return `<div class="rosterTeam"><div class="rosterTop"><div><div class="rosterTeamName">⚽ ${t}</div><div class="rosterRecord">${r.w}W-${r.d}D-${r.l}L • FIFA ${sc.fifa} • B ${sc.bonus}</div></div><div class="rosterScore">${sc.total}</div></div><span class="rosterStatus ${st.cls}">${st.txt.replace('✅ ','').replace('⚠️ ','').replace('⏳ ','').replace('➖ ','').replace('🔥 ','')}</span></div>`}).join('');return `<div class="rosterGroup"><div class="rosterHead"><b>${groupName(w,g)}</b><div class="rosterMeta">${(g.friends||[]).join(' • ')} • ${(g.teams||[]).length} matching country team${(g.teams||[]).length===1?'':'s'}</div></div><div class="rosterTeams">${teams}</div></div>`}).join('')||'<div class="empty">No roster teams match this country search.</div>'}
function injectStyle(d){let s=d.getElementById('mobile-v46-style');if(s)return;s=d.createElement('style');s.id='mobile-v46-style';s.textContent=`.top,.scorebar,#chart,#pointTeams{display:none!important;height:0!important;min-height:0!important;margin:0!important;padding:0!important;overflow:hidden!important}html,body{overflow-x:hidden!important;max-width:100%!important;height:auto!important}.hero .ball{display:none!important}.hero{grid-template-columns:1fr!important;border-radius:16px!important;margin-bottom:8px!important}.hero>div:first-child{padding:14px!important}.hero h1{font-size:24px!important;line-height:1.05!important;margin:0 0 6px!important}.hero p{font-size:12px!important;line-height:1.28!important;margin:4px 0!important}header,main{padding:8px!important;max-width:100%!important}.toolbar,.scheduleFilters{grid-template-columns:1fr 1fr!important;border-radius:16px!important;padding:8px!important;gap:8px!important;margin:8px 0!important}.toolbar>div:nth-child(5){grid-column:1/-1!important}.toolbar>div:nth-child(6){display:none!important}label{font-size:10px!important;margin-bottom:3px!important}select,input,button{font-size:14px!important;min-height:38px!important;width:100%!important;padding:8px!important;border-radius:12px!important}.cards{display:none!important}.grid{grid-template-columns:1fr!important;border-radius:16px!important;padding:10px!important;margin-bottom:8px!important}.wide{border-radius:16px!important;padding:10px!important;margin-bottom:8px!important}h2{font-size:19px!important;line-height:1.1!important;margin-bottom:8px!important}.muted{font-size:10px!important}.row{grid-template-columns:1fr!important;gap:4px!important;margin:8px 0!important}.bar{height:14px!important}.rosterGroup{background:#fff;border:1px solid #d9f1df;border-radius:14px;margin:8px 0;overflow:hidden;box-shadow:0 4px 10px #0001}.rosterHead{background:linear-gradient(135deg,#073b4c,#0f7b3f);color:#fff;padding:9px 10px}.rosterHead b{font-size:14px}.rosterMeta{font-size:10px;opacity:.9;margin-top:2px}.rosterTeams{display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:7px}.rosterTeam{border:1px solid #e1f1e6;border-radius:12px;padding:7px;background:#fafffb;display:block;min-width:0}.rosterTop{display:flex;justify-content:space-between;gap:4px;align-items:flex-start}.rosterTeamName{font-weight:950;color:#073b4c;font-size:12px;line-height:1.15}.rosterRecord{font-size:10px;color:#667085;margin-top:2px;line-height:1.15}.rosterScore{font-weight:1000;background:#fff7d6;color:#8a6200;border-radius:999px;padding:4px 6px;font-size:10px;white-space:nowrap}.rosterStatus{display:block;margin-top:5px;font-size:10px;font-weight:900;border-radius:999px;padding:4px 6px;line-height:1.1;width:fit-content;max-width:100%}@media(max-width:360px){.rosterTeams{grid-template-columns:1fr}.toolbar,.scheduleFilters{grid-template-columns:1fr!important}}`;d.head.appendChild(s)}
function install(d){if(window.__mobileV46Installed)return;['search','sSearch','friend','sFriend','status','sStatus','tz','sTz'].forEach(id=>{const el=d.getElementById(id);if(el){el.addEventListener('input',()=>setTimeout(()=>update(id),20));el.addEventListener('change',()=>setTimeout(()=>update(id),20));}});try{new MutationObserver(()=>removeSections(d)).observe(d.body,{childList:true,subtree:true});}catch(e){}window.__mobileV46Installed=true}
function update(fromId){const {d,w}=safeDoc();if(!d||!w)return;injectStyle(d);syncControls(d,fromId);install(d);removeSections(d);try{if(typeof w.refresh==='function'&&fromId)w.refresh()}catch(e){}renderLeaderboard(d,w);renderRoster(d,w);removeSections(d);d.querySelectorAll('.rosterTeam').forEach(card=>{const name=card.querySelector('.rosterTeamName'),score=card.querySelector('.rosterScore');if(!name||!score||!w.rec)return;try{if((w.rec(cleanTeam(name.textContent)).w||0)>0){card.style.background='#f0fdf4';score.style.background='#dcfce7';score.style.color='#087443'}}catch(e){}});try{f.style.height=d.documentElement.scrollHeight+'px'}catch(e){}}
f.addEventListener('load',()=>{setTimeout(()=>update(),250);setInterval(()=>{try{update()}catch(e){}},300)});
</script>
</body>
</html>
