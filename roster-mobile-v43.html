<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>World Cup Mobile Roster Tracker</title><style>html,body{margin:0;width:100%;height:100%;background:#0f7b3f;overflow:auto}iframe{border:0;width:100%;min-height:100vh;display:block}</style></head><body><iframe id="tracker" src="roster-mobile-v42.html?v=43"></iframe><script>
const f=document.getElementById('tracker');
function deepDoc(){let d=f.contentDocument;try{for(let i=0;i<8;i++){let frame=d&&d.querySelector?d.querySelector('iframe'):null;if(!frame||!frame.contentDocument)break;d=frame.contentDocument}}catch(e){}return d}
function solid(){let d=deepDoc();if(!d)return;let s=d.getElementById('solid-no-blink-status');if(!s){s=d.createElement('style');s.id='solid-no-blink-status';s.textContent=`.rosterTeam,.rosterStatus,.rosterScore,.rosterRecord{animation:none!important;transition:none!important}.rosterStatus.aliveStatus{background:#dcfce7!important;color:#087443!important;border:1px solid #86efac!important}.rosterStatus.eliminatedStatus{background:#fee2e2!important;color:#b42318!important;border:1px solid #fecaca!important}.rosterStatus.championStatus{background:#fef3c7!important;color:#92400e!important;border:1px solid #fbbf24!important;box-shadow:none!important}.rosterTeam.fifaAlive{border-color:#86efac!important;background:#f0fdf4!important}.rosterTeam.fifaEliminated{border-color:#fecaca!important;background:#fff7f7!important;opacity:1!important}.rosterTeam.fifaChampion{border-color:#fbbf24!important;background:#fff7d6!important;box-shadow:none!important}`;d.head.appendChild(s)}try{f.style.height=d.documentElement.scrollHeight+'px'}catch(e){}}
f.addEventListener('load',()=>{setTimeout(solid,1000);setInterval(solid,500)});
</script></body></html>
